<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronología y Calendario Legal | 45 y Más Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-deep: #050810; --bg-panel: #0a0f1d; --glass-bg: rgba(15, 23, 42, 0.7); --brand-orange: #ff7315; --neon-blue: #38bdf8; --border-glass: rgba(255, 255, 255, 0.08); --text-main: #f8fafc; --text-muted: #94a3b8; --danger: #ef4444; --warning: #f59e0b; --success: #10b981; }
        body.light-mode { --bg-deep: #f8fafc; --bg-panel: #ffffff; --glass-bg: rgba(255, 255, 255, 0.9); --border-glass: rgba(0, 0, 0, 0.1); --text-main: #0f172a; --text-muted: #475569; }
        body.light-mode .topbar { background: rgba(255, 255, 255, 0.95); }
        body.light-mode .logo-visor { color: #0f172a; }
        body.light-mode .timeline-card { background: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        body.light-mode .unlock-overlay { background: rgba(255,255,255,0.85); border-color: var(--brand-orange); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s, color 0.3s; }
        
        .topbar { background: rgba(5, 8, 16, 0.85); backdrop-filter: blur(15px); padding: 15px 25px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--border-glass); z-index: 10; flex-wrap: wrap; }
        .logo-visor { font-weight: 800; font-size: 1.1rem; color: var(--text-main); margin-right: auto; display: flex; align-items: center; gap: 8px; }
        .logo-visor i { color: var(--neon-blue); }
        
        .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-glass); font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.3s ease; color: var(--text-main); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-volver { background: transparent; color: var(--text-muted); border: none; } .btn-volver:hover { color: var(--brand-orange); }
        .btn-accion { background: var(--glass-bg); border-color: rgba(56, 189, 248, 0.3); color: var(--neon-blue); }
        .btn-vip { background: linear-gradient(135deg, var(--brand-orange), #d95d0b); border: none; color: white; box-shadow: 0 4px 12px rgba(255, 115, 21, 0.3); }
        .btn-camaleon { background: transparent; border: 1px solid var(--brand-orange); color: var(--brand-orange); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.75rem; }

        .status-badge { background: rgba(250, 204, 21, 0.2); padding: 3px 8px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
        .status-pro { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: rgba(16, 185, 129, 0.3); }

        .workspace { flex: 1; overflow: auto; padding: 40px 20px; display: flex; justify-content: center; position: relative; }
        .timeline-container { max-width: 800px; width: 100%; position: relative; padding-left: 40px; padding-bottom: 50px; }
        .timeline-container::before { content: ''; position: absolute; top: 0; bottom: 0; left: 14px; width: 3px; background: linear-gradient(to bottom, var(--neon-blue), var(--brand-orange)); border-radius: 3px; }

        .timeline-item { position: relative; margin-bottom: 35px; opacity: 0; transform: translateY(20px); animation: fadeInUp 0.5s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        .timeline-dot { position: absolute; left: -34px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg-deep); border: 4px solid var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); z-index: 2; }
        .tipo-notificacion .timeline-dot { border-color: var(--neon-blue); }
        .tipo-prevencion .timeline-dot { border-color: var(--warning); }
        .tipo-vencimiento .timeline-dot { border-color: var(--danger); }
        .tipo-audiencia .timeline-dot { border-color: var(--success); }

        .timeline-card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-glass); border-radius: 14px; padding: 20px; position: relative; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .timeline-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; background: var(--neon-blue); }
        .tipo-prevencion .timeline-card::before { background: var(--warning); }
        .tipo-vencimiento .timeline-card::before { background: var(--danger); }
        .tipo-audiencia .timeline-card::before { background: var(--success); }

        .timeline-date { color: var(--text-muted); font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .timeline-title { color: var(--text-main); font-size: 1.15rem; font-weight: 800; margin-bottom: 8px; }
        .timeline-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.4; }
        
        .timeline-foja { display: inline-flex; align-items: center; gap: 5px; margin-top: 12px; background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; color: var(--text-main); border: 1px solid var(--border-glass); }

        /* BLOQUEO DEMO */
        .blurred-section { position: relative; }
        .blurred-content { filter: blur(6px); opacity: 0.4; pointer-events: none; }
        .unlock-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 5; width: 90%; max-width: 380px; background: rgba(10, 15, 29, 0.85); backdrop-filter: blur(8px); padding: 25px; border-radius: 14px; border: 1px solid var(--brand-orange); }

        #modalVIP { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-card { background: var(--bg-panel); border: 1px solid var(--border-glass); padding: 35px; border-radius: 20px; text-align: center; max-width: 380px; width: 90%; }
        .input-vip { background: rgba(0,0,0,0.1); border: 1px solid #cbd5e1; color: var(--text-main); padding: 12px; width: 100%; border-radius: 8px; text-align: center; font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; outline: none; }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="iurisvisor.html" class="btn btn-volver"><i class="fa-solid fa-arrow-left"></i> Visor Pro</a>
        <div class="logo-visor">
            <i class="fa-solid fa-timeline"></i> Cronología & Calendario
            <span class="status-badge" id="status-badge">DEMO</span>
        </div>
        
        <button id="btn-sync" class="btn btn-accion" onclick="renderizarLineaDeTiempo()"><i class="fa-solid fa-rotate"></i> Actualizar</button>
        <button id="btn-exportar" class="btn btn-vip" onclick="intentarExportar()"><i class="fa-solid fa-download"></i> Guardar PDF</button>

        <button onclick="toggleTheme()" class="btn-camaleon" id="btnTheme">
            <i class="fa-solid fa-circle-half-stroke"></i> <span id="text-theme">Claro</span>
        </button>
    </div>

    <div class="workspace" id="lienzo-exportar">
        <div class="timeline-container" id="timeline-container">
            <!-- Se carga dinámicamente -->
        </div>
    </div>

    <div id="modalVIP">
        <div class="modal-card">
            <h2><i class="fa-solid fa-key" style="color: var(--brand-orange);"></i> Activar Pro</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">Ingresa tu token (45YMAS) para ver todos los plazos críticos y exportar el calendario.</p>
            <input type="text" id="tokenInput" class="input-vip" placeholder="TOKEN 45YMAS" autocomplete="off">
            <button class="btn btn-vip" style="width: 100%; justify-content: center; padding: 12px;" onclick="validarTokenVIP()">VALIDAR Y DESBLOQUEAR</button>
            <button style="background:none; border:none; color: var(--text-muted); margin-top: 12px; cursor:pointer; font-size: 0.8rem;" onclick="cerrarModalVIP()">Cancelar</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('text-theme').innerText = isLight ? "Oscuro" : "Claro";
            document.querySelector('#btnTheme i').className = isLight ? "fa-solid fa-moon" : "fa-solid fa-circle-half-stroke";
            localStorage.setItem('tema', isLight ? 'light' : 'dark');
        }
        
        let esProActivado = localStorage.getItem('pro_activo') === 'true';

        window.onload = () => { 
            if(localStorage.getItem('tema') === 'light') toggleTheme(); 
            if(esProActivado) {
                document.getElementById('status-badge').className = 'status-badge status-pro';
                document.getElementById('status-badge').innerText = 'PRO ACTIVA';
            }
            renderizarLineaDeTiempo(); 
        };

        function renderizarLineaDeTiempo() {
            const container = document.getElementById('timeline-container');
            const datosGuardados = localStorage.getItem('datos_timeline_45ymas');

            if (!datosGuardados) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 50px 20px; color: var(--text-muted);">
                        <i class="fa-solid fa-calendar-days" style="font-size: 3.5rem; margin-bottom: 15px; opacity: 0.5;"></i>
                        <h3 style="color: var(--text-main); margin-bottom: 8px;">Sin expediente cargado</h3>
                        <p style="font-size: 0.85rem;">Carga un PDF en el <a href="iurisvisor.html" style="color: var(--neon-blue);">IurisVisor Pro</a> y ejecuta el Radar para poblar el calendario.</p>
                    </div>
                `;
                return;
            }

            const plazos = JSON.parse(datosGuardados);
            let html = '';

            for(let i = 0; i < Math.min(2, plazos.length); i++) {
                html += crearItemHTML(plazos[i], i);
            }

            if(plazos.length > 2) {
                if(esProActivado) {
                    for(let i = 2; i < plazos.length; i++) {
                        html += crearItemHTML(plazos[i], i);
                    }
                } else {
                    html += `
                    <div class="blurred-section">
                        <div class="unlock-overlay">
                            <i class="fa-solid fa-lock" style="font-size: 2.5rem; color: var(--brand-orange); margin-bottom: 10px;"></i>
                            <h3 style="color:var(--text-main); font-size:1.1rem; margin-bottom:8px;">Cronología Protegida</h3>
                            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;">Los plazos fatales y fechas de entrega están ocultos en la demo.</p>
                            <button class="btn btn-vip" style="width: 100%; justify-content: center;" onclick="verificarVIP()">DESBLOQUEAR PRO</button>
                        </div>
                        <div class="blurred-content">
                    `;
                    for(let i = 2; i < plazos.length; i++) {
                        html += crearItemHTML(plazos[i], i);
                    }
                    html += `</div></div>`;
                }
            }
            container.innerHTML = html;
        }

        function crearItemHTML(item, index) {
            const delay = (index * 0.15);
            return `
            <div class="timeline-item ${item.tipo}" style="animation-delay: ${delay}s">
                <div class="timeline-dot"></div>
                <div class="timeline-card">
                    <div class="timeline-date"><i class="fa-regular fa-calendar-days"></i> ${item.fecha} (Fecha de Entrega/Vencimiento)</div>
                    <div class="timeline-title">${item.titulo}</div>
                    <div class="timeline-desc">${item.desc}</div>
                    <div class="timeline-foja"><i class="fa-solid fa-file-lines"></i> Foja Asociada: ${item.foja}</div>
                </div>
            </div>
            `;
        }

        function verificarVIP() { document.getElementById('modalVIP').style.display = 'flex'; }
        function cerrarModalVIP() { document.getElementById('modalVIP').style.display = 'none'; }
        
        function validarTokenVIP() {
            if(document.getElementById('tokenInput').value.trim().toUpperCase() === "45YMAS") {
                esProActivado = true; 
                localStorage.setItem('pro_activo', 'true');
                cerrarModalVIP();
                
                const badge = document.getElementById('status-badge');
                badge.className = 'status-badge status-pro'; badge.innerText = 'PRO ACTIVA';
                renderizarLineaDeTiempo();
                alert("¡Desbloqueado con éxito!");
            } else { alert("Token inválido."); }
        }

        function intentarExportar() {
            if(!esProActivado) { verificarVIP(); return; }
            window.scrollTo(0,0);
            
            html2canvas(document.getElementById('lienzo-exportar'), { 
                backgroundColor: document.body.classList.contains('light-mode') ? "#f8fafc" : "#050810", 
                scale: 2,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a'); 
                link.download = 'Calendario_Plazos_45yMas.png'; 
                link.href = canvas.toDataURL("image/png"); 
                link.click();
            });
        }
    </script>
</body>
</html>
