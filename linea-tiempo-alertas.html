<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronología y Calendario Legal | 45 y Más Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-deep: #050810; --bg-panel: #0a0f1d; --glass-bg: rgba(15, 23, 42, 0.7); --brand-orange: #ff7315; --neon-blue: #38bdf8; --border-glass: rgba(255, 255, 255, 0.08); --text-main: #f8fafc; --text-muted: #94a3b8; --danger: #ef4444; --warning: #f59e0b; --success: #10b981; }
        body.light-mode { --bg-deep: #f8fafc; --bg-panel: #ffffff; --glass-bg: rgba(255, 255, 255, 0.9); --border-glass: rgba(0, 0, 0, 0.1); --text-main: #0f172a; --text-muted: #475569; }
        body.light-mode .topbar { background: rgba(255, 255, 255, 0.95); }
        body.light-mode .timeline-card { background: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        body.light-mode .timeline-dot { background: #ffffff; }
        body.light-mode .unlock-overlay { background: rgba(255,255,255,0.85); border-color: var(--brand-orange); }
        body.light-mode .unlock-overlay h3 { color: #0f172a; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05) 0%, transparent 100%); transition: background 0.3s, color 0.3s; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }

        .topbar { background: rgba(5, 8, 16, 0.85); backdrop-filter: blur(15px); padding: 15px 25px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--border-glass); z-index: 10; flex-wrap: wrap; }
        .logo-visor { font-weight: 800; font-size: 1.1rem; color: var(--text-main); margin-right: auto; display: flex; align-items: center; gap: 8px; transition: color 0.3s; }
        .logo-visor i { color: var(--neon-blue); }
        
        .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-glass); font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.3s ease; color: var(--text-main); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-volver { background: transparent; color: var(--text-muted); border: none; } .btn-volver:hover { color: var(--brand-orange); }
        .btn-accion { background: var(--glass-bg); border-color: rgba(56, 189, 248, 0.3); color: var(--neon-blue); } .btn-accion:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--neon-blue); }
        .btn-vip { background: linear-gradient(135deg, var(--brand-orange), #d95d0b); border: none; color: white; box-shadow: 0 4px 12px rgba(255, 115, 21, 0.3); } .btn-vip:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 115, 21, 0.5); }
        .btn-camaleon { background: transparent; border: 1px solid var(--brand-orange); color: var(--brand-orange); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.75rem; transition: all 0.3s; margin-left: 10px; } .btn-camaleon:hover { background: var(--brand-orange); color: white; }
        
        .status-badge { background: rgba(250, 204, 21, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
        .status-pro { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: rgba(16, 185, 129, 0.3); }

        .workspace { flex: 1; overflow: auto; padding: 40px 20px; display: flex; justify-content: center; position: relative; }
        .timeline-container { max-width: 800px; width: 100%; position: relative; padding-left: 40px; padding-bottom: 50px; }
        .timeline-container::before { content: ''; position: absolute; top: 0; bottom: 0; left: 14px; width: 3px; background: linear-gradient(to bottom, var(--neon-blue), var(--brand-orange)); border-radius: 3px; }

        .timeline-item { position: relative; margin-bottom: 35px; opacity: 0; transform: translateY(20px); animation: fadeInUp 0.5s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        .timeline-dot { position: absolute; left: -34px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg-deep); border: 4px solid var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); z-index: 2; transition: background 0.3s; }
        
        .tipo-notificacion .timeline-dot { border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
        .tipo-prevencion .timeline-dot { border-color: var(--warning); box-shadow: 0 0 10px var(--warning); }
        .tipo-vencimiento .timeline-dot { border-color: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .tipo-audiencia .timeline-dot { border-color: var(--success); box-shadow: 0 0 10px var(--success); }

        .timeline-card { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-glass); border-radius: 14px; padding: 25px; transition: all 0.3s ease; box-shadow: 0 8px 25px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .timeline-card:hover { transform: translateX(8px); border-color: rgba(255, 255, 255, 0.2); }
        
        .timeline-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 5px; background: var(--neon-blue); }
        .tipo-prevencion .timeline-card::before { background: var(--warning); }
        .tipo-vencimiento .timeline-card::before { background: var(--danger); }
        .tipo-audiencia .timeline-card::before { background: var(--success); }

        .timeline-date { color: var(--text-muted); font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .timeline-title { color: var(--text-main); font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; transition: color 0.3s; }
        .timeline-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
        
        .timeline-foja { display: inline-flex; align-items: center; gap: 6px; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; color: var(--text-main); border: 1px solid var(--border-glass); cursor: pointer; transition: all 0.2s; }
        .timeline-foja:hover { background: var(--neon-blue); color: #fff; border-color: var(--neon-blue); transform: translateY(-2px); }
        .tipo-vencimiento .timeline-foja { border-color: var(--danger); color: var(--danger); }
        .tipo-vencimiento .timeline-foja:hover { background: var(--danger); color: #fff; }

        /* MODO DEMO - DIFUMINADO */
        .blurred-section { position: relative; }
        .blurred-content { filter: blur(8px); opacity: 0.4; pointer-events: none; user-select: none; transition: filter 0.5s, opacity 0.5s; }
        .unlock-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 5; width: 90%; max-width: 400px; background: rgba(10, 15, 29, 0.85); backdrop-filter: blur(8px); padding: 30px; border-radius: 16px; border: 1px solid var(--brand-orange); box-shadow: 0 20px 40px rgba(0,0,0,0.5); transition: background 0.3s; }
        .unlock-overlay h3 { color: var(--text-main); margin: 15px 0 10px 0; }
        .unlock-overlay p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

        /* MODAL VIP */
        #modalVIP { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-card { background: var(--bg-panel); border: 1px solid var(--border-glass); padding: 40px; border-radius: 20px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .input-vip { background: rgba(0,0,0,0.1); border: 1px solid #cbd5e1; color: var(--text-main); padding: 15px; width: 100%; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; outline: none; }
        .input-vip:focus { border-color: var(--brand-orange); }

        #toast-noti { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--brand-orange); color: white; padding: 15px 25px; border-radius: 8px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; display: flex; align-items: center; gap: 10px; }
        #toast-noti.show { bottom: 30px; }

        /* RESPONSIVIDAD CELULARES */
        @media (max-width: 768px) {
            .topbar { justify-content: center; }
            .timeline-container { padding-left: 20px; }
            .timeline-container::before { left: 4px; }
            .timeline-dot { left: -24px; width: 14px; height: 14px; }
            .timeline-card { padding: 15px; }
            .timeline-title { font-size: 1.05rem; }
            .timeline-desc { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <button onclick="window.close()" class="btn btn-volver" id="btnCerrar"><i class="fa-solid fa-arrow-left"></i> Volver al Visor</button>
        <div class="logo-visor">
            <i class="fa-solid fa-calendar-check"></i> Cronología & Calendario
            <span class="status-badge status-demo" id="status-badge">VERSIÓN DEMO</span>
        </div>
        
        <button id="btn-sync" class="btn btn-accion" onclick="sincronizarDatos()"><i class="fa-solid fa-rotate"></i> Forzar Lectura</button>
        <button id="btn-exportar" class="btn btn-vip" onclick="intentarExportar()"><i class="fa-solid fa-download"></i> Guardar Calendario</button>

        <button onclick="toggleTheme()" class="btn-camaleon" id="btnTheme">
            <i class="fa-solid fa-circle-half-stroke"></i> <span id="text-theme">Modo Claro</span>
        </button>
    </div>

    <!-- EL ÁREA QUE SE VA A EXPORTAR -->
    <div class="workspace" id="lienzo-exportar">
        <div class="timeline-container" id="timeline-container">
            <!-- SE GENERA DINÁMICAMENTE POR JS -->
        </div>
    </div>

    <!-- NOTIFICACIÓN TOAST -->
    <div id="toast-noti">
        <i class="fa-solid fa-link"></i> <span>Abriendo foja en IurisVisor...</span>
    </div>

    <!-- MODAL VIP -->
    <div id="modalVIP">
        <div class="modal-card">
            <div style="position: absolute; top:0; left:0; width:100%; height:5px; background: linear-gradient(90deg, #facc15, var(--brand-orange));"></div>
            <h2><i class="fa-solid fa-key" style="color: var(--brand-orange); margin-bottom:10px;"></i> Activar Inteligencia VIP</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Ingresa tu token para eliminar el desenfoque, visualizar los plazos fatales y habilitar la exportación del calendario.</p>
            <input type="text" id="tokenInput" class="input-vip" placeholder="TOKEN 45YMAS" autocomplete="off">
            <button class="btn btn-vip" style="width: 100%; justify-content: center; padding: 15px;" onclick="validarTokenVIP()">VALIDAR Y DESBLOQUEAR</button>
            <button style="background:none; border:none; color: var(--text-muted); margin-top: 15px; cursor:pointer;" onclick="cerrarModalVIP()">Cancelar</button>
        </div>
    </div>

    <script>
        // TEMA
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            const btnSpan = document.getElementById('text-theme');
            const btnIcon = document.querySelector('#btnTheme i');
            if(isLight) { btnSpan.innerText = "Modo Oscuro"; btnIcon.className = "fa-solid fa-moon"; localStorage.setItem('tema', 'light'); } 
            else { btnSpan.innerText = "Modo Claro"; btnIcon.className = "fa-solid fa-circle-half-stroke"; localStorage.setItem('tema', 'dark'); }
        }

        // VARIABLE GLOBAL DE TOKEN
        let esProActivado = localStorage.getItem('pro_activo') === 'true';

        // CARGA INTELIGENTE AL INICIAR
        window.onload = () => { 
            if(localStorage.getItem('tema') === 'light') toggleTheme(); 
            
            // Si ya está desbloqueado desde IurisVisor, actualiza la UI
            if(esProActivado) {
                const badge = document.getElementById('status-badge');
                badge.className = 'status-badge status-pro'; 
                badge.innerText = 'PRO ACTIVA';
            }
            
            // Dibuja el calendario automáticamente leyendo el LocalStorage
            renderizarLineaDeTiempo(); 
            
            // Si se abrió en nueva pestaña, ajusta el botón de volver
            if(window.history.length <= 1) {
                document.getElementById('btnCerrar').innerHTML = '<i class="fa-solid fa-times"></i> Cerrar Pestaña';
            } else {
                document.getElementById('btnCerrar').onclick = () => { window.location.href = 'iurisvisor.html'; };
            }
        };

        // ====== DIBUJO DINÁMICO DEL CALENDARIO ======
        function renderizarLineaDeTiempo() {
            const container = document.getElementById('timeline-container');
            const datosGuardados = localStorage.getItem('datos_timeline_45ymas');

            if (!datosGuardados) {
                // Estado Vacío (Aún no escanean nada)
                container.innerHTML = `
                    <div style="text-align:center; padding: 60px 20px; color: var(--text-muted);">
                        <i class="fa-solid fa-calendar-xmark" style="font-size: 4.5rem; margin-bottom: 20px; opacity: 0.5;"></i>
                        <h2 style="color: var(--text-main); margin-bottom: 10px;">Esperando Expediente</h2>
                        <p style="font-size: 0.95rem; line-height:1.5;">Por favor, ve al <a href="iurisvisor.html" style="color: var(--neon-blue);">IurisVisor Pro</a>, carga un expediente PDF e inicia el Radar para que el sistema extraiga las fechas clave y arme tu calendario de plazos.</p>
                    </div>
                `;
                return;
            }

            const plazos = JSON.parse(datosGuardados);
            let html = '';

            // 1. Mostrar plazos iniciales (gratis)
            for(let i = 0; i < Math.min(2, plazos.length); i++) {
                html += crearItemHTML(plazos[i], i);
            }

            // 2. Si hay más plazos, verificar estado PRO
            if(plazos.length > 2) {
                if(esProActivado) {
                    for(let i = 2; i < plazos.length; i++) {
                        html += crearItemHTML(plazos[i], i);
                    }
                } else {
                    html += `
                    <div class="blurred-section" id="seccion-bloqueada">
                        <div class="unlock-overlay" id="overlay-vip">
                            <i class="fa-solid fa-lock" style="font-size: 3rem; color: var(--brand-orange); margin-bottom: 15px;"></i>
                            <h3>Calendario Protegido</h3>
                            <p>Los términos fatales, vencimientos y sentencias están ocultos en la versión de prueba.</p>
                            <button class="btn btn-vip" style="width: 100%; justify-content: center; padding: 12px;" onclick="verificarVIP()">DESBLOQUEAR VIP (45YMAS)</button>
                        </div>
                        <div class="blurred-content" id="contenido-oculto">
                    `;
                    for(let i = 2; i < plazos.length; i++) {
                        html += crearItemHTML(plazos[i], i);
                    }
                    html += `</div></div>`;
                }
            }
            container.innerHTML = html;
        }

        function crearItemHTML(item, index) {
            const delay = (index * 0.15); // Efecto cascada rápido
            const esFatal = item.foja === 'Fatal';
            const fojaIcon = esFatal ? '<i class="fa-solid fa-triangle-exclamation"></i> Alerta Crítica' : `<i class="fa-solid fa-magnifying-glass"></i> Foja Asociada: ${item.foja}`;
            const claseColor = esFatal ? 'color: var(--danger)' : '';
            
            return `
            <div class="timeline-item ${item.tipo}" style="animation-delay: ${delay}s">
                <div class="timeline-dot"></div>
                <div class="timeline-card">
                    <div class="timeline-date"><i class="fa-regular fa-calendar-days"></i> ${item.fecha} (Fecha Clave)</div>
                    <div class="timeline-title" style="${claseColor}">${item.titulo}</div>
                    <div class="timeline-desc">${item.desc}</div>
                    <div class="timeline-foja" onclick="abrirFojaSimulada('${item.foja}')">${fojaIcon}</div>
                </div>
            </div>
            `;
        }

        function sincronizarDatos() {
            const btn = document.getElementById('btn-sync');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Leyendo...';
            btn.style.pointerEvents = 'none';

            // Animación y forzar re-lectura
            setTimeout(() => {
                renderizarLineaDeTiempo();
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Actualizado';
                btn.style.borderColor = "var(--success)"; btn.style.color = "var(--success)";
                btn.style.pointerEvents = 'auto';
            }, 800);
        }

        function abrirFojaSimulada(foja) {
            const toast = document.getElementById('toast-noti');
            toast.querySelector('span').innerText = foja === 'Fatal' ? 'Redirigiendo a alerta crítica en IurisVisor...' : `Consultando Foja ${foja} en el visor...`;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // ====== LÓGICA VIP ======
        function verificarVIP() { document.getElementById('modalVIP').style.display = 'flex'; }
        function cerrarModalVIP() { document.getElementById('modalVIP').style.display = 'none'; }
        
        function validarTokenVIP() {
            if(document.getElementById('tokenInput').value.trim().toUpperCase() === "45YMAS") {
                esProActivado = true; 
                localStorage.setItem('pro_activo', 'true'); // GUARDA EN TODO EL NAVEGADOR
                cerrarModalVIP();
                
                const badge = document.getElementById('status-badge');
                badge.className = 'status-badge status-pro'; badge.innerText = 'PRO ACTIVA';
                
                // Redibuja limpio
                renderizarLineaDeTiempo();
            } else { alert("Acceso Denegado. Token inválido."); }
        }

        // ====== MOTOR DE EXPORTACIÓN ROBUSTO ======
        function intentarExportar() {
            if(!esProActivado) { verificarVIP(); return; }
            const btnExp = document.getElementById('btn-exportar');
            btnExp.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Guardando...';
            
            // TRUCO VITAL: Subir el scroll asegura que capture todo el documento hacia abajo
            window.scrollTo(0,0);
            
            const container = document.getElementById('lienzo-exportar');
            const themeBg = document.body.classList.contains('light-mode') ? "#f8fafc" : "#050810";
            
            setTimeout(() => {
                html2canvas(container, { 
                    backgroundColor: themeBg, 
                    scale: 2, // Alta Resolución
                    useCORS: true,
                    windowWidth: container.scrollWidth,
                    windowHeight: container.scrollHeight
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'Calendario_Plazos_45yMas.png'; 
                    link.href = canvas.toDataURL("image/png"); 
                    link.click();
                    btnExp.innerHTML = '<i class="fa-solid fa-download"></i> Guardar Calendario';
                }).catch(err => {
                    alert("Hubo un error al generar la imagen.");
                    console.error(err);
                    btnExp.innerHTML = '<i class="fa-solid fa-download"></i> Guardar Calendario';
                });
            }, 300); // Pequeño retraso para que suba el scroll
        }
    </script>
</body>
</html>
