<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>45YMÁS Bóveda Inteligente | Visor de Expedientes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-dark: #070b14;
      --bg-sidebar: #0b1120;
      --bg-card: #111a2e;
      --accent-orange: #ea580c;
      --accent-amber: #f59e0b;
      --accent-blue: #38bdf8;
      --accent-emerald: #10b981;
      --border-line: rgba(148, 163, 184, 0.18);
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050811; }
    ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.4); border-radius: 999px; }

    /* BARRA SUPERIOR */
    .visor-header {
      height: 58px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 12px;
      z-index: 40;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-light);
    }
    .brand-title {
      font-weight: 900;
      font-size: 14px;
      color: var(--accent-amber);
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-sub {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      display: block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .hdr-btn {
      background: #131c31;
      color: var(--text-light);
      border: 1px solid var(--border-line);
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.18s ease;
    }
    .hdr-btn:hover {
      border-color: var(--accent-amber);
      background: #1a2642;
    }
    .hdr-select-exp {
      background: #0f1b33;
      color: #60a5fa;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      max-width: 310px;
      cursor: pointer;
      outline: none;
    }
    .hdr-btn-ia {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      padding: 7px 15px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.4);
      transition: transform 0.15s ease;
    }
    .hdr-btn-ia:hover { transform: translateY(-1px); }

    /* LAYOUT PRINCIPAL DE 3 COLUMNAS */
    .visor-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 225px 1fr 330px;
      overflow: hidden;
      min-height: 0;
    }
    @media (max-width: 1100px) {
      .visor-workspace { grid-template-columns: 185px 1fr 290px; }
    }
    @media (max-width: 820px) {
      .visor-workspace { grid-template-columns: 1fr; }
      .sidebar-left { display: none; }
    }

    /* COLUMNA IZQUIERDA: FOJAS Y MINIATURAS */
    .sidebar-left {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }
    .side-btn-dashed {
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px dashed rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.08);
      color: var(--accent-amber);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .side-btn-dashed:hover { background: rgba(245, 158, 11, 0.18); }
    .side-btn-order {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px dashed rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.7);
      color: var(--accent-blue);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .fojas-thumbs-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }
    .foja-thumb-card {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .foja-thumb-card.activa {
      border-color: var(--accent-amber);
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
      background: #17233d;
    }
    .foja-thumb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--accent-amber);
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .foja-thumb-preview {
      width: 100%;
      height: 115px;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      font-size: 10px;
      padding: 6px;
      text-align: center;
    }
    .foja-thumb-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* COLUMNA CENTRAL: LIENZO DEL DOCUMENTO */
    .center-stage {
      background: #04070e;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: auto;
      padding: 24px 20px 90px 20px;
    }
    .sheet-container {
      background: #ffffff;
      color: #0f172a;
      width: 100%;
      max-width: 820px;
      min-height: 980px;
      border-radius: 6px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.8);
      position: relative;
      transform-origin: top center;
      transition: transform 0.15s ease;
      overflow: hidden;
    }
    .sheet-html-content {
      padding: 44px 52px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11.5pt;
      line-height: 1.6;
      color: #000000;
    }
    .sheet-html-content * { color: #000000; }
    .sheet-html-content table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .sheet-html-content td, .sheet-html-content th { border: 1px solid #000; padding: 6px 8px; }
    .sheet-image-render {
      width: 100%;
      height: auto;
      display: block;
    }
    #annotation-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }
    .empty-doc-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 760px;
      padding: 40px;
      color: #1e293b;
    }

    /* Resaltado de palabra encontrada por IA */
    mark.ia-highlight {
      background-color: #fde047 !important;
      color: #000000 !important;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 800;
      box-shadow: 0 0 0 2px #f59e0b;
    }

    /* BARRA FLOTANTE INFERIOR DE CONTROLES */
    .floating-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.75);
      z-index: 50;
    }
    .ctrl-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.2);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: #334155; color: #fff; }
    .ctrl-btn.activo {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--accent-amber);
      color: var(--accent-amber);
    }
    .ctrl-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-amber);
      padding: 0 8px;
    }

    /* COLUMNA DERECHA: ALERTAS IA Y APUNTES */
    .sidebar-right {
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .right-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border-line);
      background: #080d19;
    }
    .right-tab-btn {
      padding: 13px 10px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .right-tab-btn.activo {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.05);
    }
    .right-panel-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }
    .ia-search-input {
      width: 100%;
      background: #060a12;
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text-light);
      font-size: 12px;
      outline: none;
    }
    .ia-search-input:focus { border-color: var(--accent-blue); }
    .ia-results-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 3px;
    }
    .ia-card-item {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ia-card-item:hover {
      border-color: var(--accent-amber);
      transform: translateX(2px);
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR DEL VISOR -->
  <header class="visor-header">
    <a href="portal-pro.html" class="brand-box">
      <i class="fa-solid fa-scale-balanced" style="color:#f59e0b; font-size:20px;"></i>
      <div>
        <span class="brand-title">45YMÁS</span>
        <span class="brand-sub">Bóveda Inteligente</span>
      </div>
    </a>

    <div class="header-actions">
      <a href="index.html" class="hdr-btn"><i class="fa-solid fa-house"></i> Inicio</a>
      <a href="portal-pro.html" class="hdr-btn"><i class="fa-solid fa-folder-tree"></i> Bóveda</a>

      <!-- Selector directo de expediente (Carga tanto Juzgados como Convenios MASC) -->
      <select id="visor-exp-selector" onchange="VisorApp.cambiarExpedienteDesdeSelector(this.value)" class="hdr-select-exp" title="Cambiar de expediente">
        <option value="">Cargando expediente...</option>
      </select>

      <label class="hdr-btn" style="cursor:pointer;">
        <i class="fa-solid fa-file-arrow-up" style="color:#38bdf8;"></i> Cargar
        <input type="file" id="visor-input-cargar" multiple accept=".pdf,.doc,.docx,image/*" style="display:none;" onchange="VisorApp.subirArchivosAlExpediente(this.files); this.value='';" />
      </label>

      <button type="button" onclick="VisorApp.descargarArchivoOriginalActual()" class="hdr-btn">
        <i class="fa-solid fa-download" style="color:#10b981;"></i> Original
      </button>

      <button type="button" onclick="VisorApp.ejecutarReconocimientoIA(true)" class="hdr-btn-ia" title="Analizar cláusulas, actuaciones de juzgado, montos, términos y partes">
        <i class="fa-solid fa-brain"></i> IA
      </button>
    </div>
  </header>

  <!-- ÁREA DE TRABAJO DE 3 COLUMNAS -->
  <div class="visor-workspace">
    <!-- IZQUIERDA: LISTA DE FOJAS -->
    <aside class="sidebar-left">
      <label class="side-btn-dashed">
        <i class="fa-solid fa-plus"></i> Insertar Foja
        <input type="file" multiple accept=".pdf,.doc,.docx,image/*" style="display:none;" onchange="VisorApp.subirArchivosAlExpediente(this.files); this.value='';" />
      </label>
      <button type="button" onclick="VisorApp.invertirOrdenFojas()" class="side-btn-order">
        <i class="fa-solid fa-arrow-down-up-across-line"></i> Ordenar Fojas
      </button>
      <div id="fojas-sidebar-list" class="fojas-thumbs-list"></div>
    </aside>

    <!-- CENTRO: HOJA DEL EXPEDIENTE -->
    <main class="center-stage" id="center-stage-scroll">
      <div id="sheet-container" class="sheet-container">
        <canvas id="annotation-canvas"></canvas>
        <div id="sheet-render-area"></div>
      </div>

      <!-- CONTROLES FLOTANTES INFERIORES -->
      <div class="floating-controls">
        <button type="button" class="ctrl-btn" onclick="VisorApp.irAFoja(VisorApp.fojaIndiceActual - 1)" title="Foja anterior">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span id="visor-page-counter" class="ctrl-counter">0/0</span>
        <button type="button" class="ctrl-btn" onclick="VisorApp.irAFoja(VisorApp.fojaIndiceActual + 1)" title="Foja siguiente">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button type="button" class="ctrl-btn" onclick="VisorApp.cambiarZoom(0.12)" title="Acercar">
          <i class="fa-solid fa-magnifying-glass-plus"></i>
        </button>
        <button type="button" class="ctrl-btn" onclick="VisorApp.cambiarZoom(-0.12)" title="Alejar">
          <i class="fa-solid fa-magnifying-glass-minus"></i>
        </button>
        <button type="button" class="ctrl-btn" onclick="VisorApp.resetZoom()" title="Tamaño 1:1">1:1</button>
        <button type="button" id="btn-tool-highlight" class="ctrl-btn" onclick="VisorApp.activarHerramientaDibujo('highlight')" title="Marcatextos amarillo">
          <i class="fa-solid fa-highlighter" style="color:#facc15;"></i>
        </button>
        <button type="button" id="btn-tool-pen" class="ctrl-btn" onclick="VisorApp.activarHerramientaDibujo('pen')" title="Pluma roja">
          <i class="fa-solid fa-pen" style="color:#f87171;"></i>
        </button>
        <button type="button" class="ctrl-btn" onclick="VisorApp.limpiarAnotacionesFoja()" title="Borrar trazos de esta foja">
          <i class="fa-solid fa-eraser"></i>
        </button>
        <button type="button" class="ctrl-btn" onclick="window.print()" title="Imprimir foja">
          <i class="fa-solid fa-print"></i>
        </button>
      </div>
    </main>

    <!-- DERECHA: ALERTAS IA Y APUNTES -->
    <aside class="sidebar-right">
      <div class="right-tabs">
        <button type="button" id="tab-btn-alertas" class="right-tab-btn activo" onclick="VisorApp.cambiarTabDerecha('alertas')">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Alertas IA
        </button>
        <button type="button" id="tab-btn-apuntes" class="right-tab-btn" onclick="VisorApp.cambiarTabDerecha('apuntes')">
          <i class="fa-solid fa-pen-to-square"></i> Apuntes
        </button>
      </div>

      <!-- Panel Alertas IA -->
      <div id="panel-derecha-alertas" class="right-panel-body">
        <input
          type="text"
          id="ia-search-input"
          class="ia-search-input"
          placeholder="Buscar palabra en el documento..."
          oninput="VisorApp.filtrarPalabrasIA(this.value)"
        />
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#94a3b8;">
          <span id="ia-status-subtitle">Reconocimiento de Juzgados y MASC</span>
          <button type="button" onclick="VisorApp.ejecutarOCRCompletoEnFojas()" style="background:none; border:none; color:#38bdf8; font-size:11px; font-weight:700; cursor:pointer;" title="Leer imágenes escaneadas con OCR">
            <i class="fa-solid fa-eye"></i> Leer Escaneo (OCR)
          </button>
        </div>
        <div id="ia-results-container" class="ia-results-list"></div>
      </div>

      <!-- Panel Apuntes del Expediente -->
      <div id="panel-derecha-apuntes" class="right-panel-body" style="display:none;">
        <p style="margin:0; font-size:11px; color:#94a3b8;">
          Bitácora y observaciones jurídicas de este expediente (se guardan automáticamente):
        </p>
        <textarea
          id="visor-apuntes-textarea"
          oninput="VisorApp.guardarApuntesExpediente(this.value)"
          placeholder="Escribe aquí acuerdos, prevenciones, fechas de audiencia o notas del expediente..."
          style="flex:1; width:100%; background:#060a12; border:1px solid var(--border-line); border-radius:10px; padding:12px; color:#f8fafc; font-size:12.5px; line-height:1.5; resize:none; outline:none;"
        ></textarea>
      </div>
    </aside>
  </div>
<!-- === FIN DE LA PARTE 1 DE 3 (SECCIÓN 2: VISOR) - PEGA LA PARTE 2 JUSTO DEBAJO DE ESTA LÍNEA === -->
 <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const VisorApp = {
      expedienteActual: null,
      todosLosExpedientes: [],
      fojasRenderizadas: [], // [{ numFoja, tituloSlot, fileName, tipo: 'imagen'|'html', dataUrl, html, texto, rawBuffer, mimeType }]
      fojaIndiceActual: 0,
      zoomActual: 1,
      herramientaActiva: null, // 'highlight' | 'pen' | null
      dibujando: false,
      trazosPorFoja: {},
      hallazgosIACache: [],

      // Diccionario Completo: Palabras Clave de Juzgados (Mercantil, Civil, Familiar, Amparo) + Convenios MASC / IJA
      DICCIONARIO_JURIDICO: [
        {
          categoria: '⚖️ Juzgado, Vía y Radicación',
          color: '#38bdf8',
          patron: /(?:JUZGADO\s+[0-9A-ZÁÉÍÓÚÑ°º\s]{2,45}|EXPEDIENTE\s*(?:N[ÚU]MERO|JUDICIAL)?\s*[:#.]?\s*\d{1,4}\/\d{4}|V[ÍI]A\s+(?:EJECUTIVA\s+MERCANTIL|ORDINARIA\s+CIVIL|CIVIL\s+SUMARIA|FAMILIAR)|AUTO\s+DE\s+(?:RADICACI[ÓO]N|EXEQUENDO|INICIO|ADMISI[ÓO]N))/gi
        },
        {
          categoria: '📄 Demanda, Partes y Prestaciones',
          color: '#f59e0b',
          patron: /(?:ESCRITO\s+INICIAL\s+DE\s+DEMANDA|COMPAREZCO\s+A\s+DEMANDAR|PARTE\s+ACTORA|PARTE\s+DEMANDADA|DEMANDAD[OA]|ACTOR[A]?|PRESTACIONES|CAP[ÍI]TULO\s+DE\s+HECHOS|DERECHO)/gi
        },
        {
          categoria: '💰 Pagaré, Montos y Suerte Principal',
          color: '#10b981',
          patron: /(?:SUERTE\s+PRINCIPAL|PAGAR[ÉE]|T[ÍI]TULO\s+DE\s+CR[ÉE]DITO|ENDOSO\s+EN\s+PROCURACI[ÓO]N|INTERESES\s+(?:MORATORIOS|ORDINARIOS)|RENTA\s+MENSUAL|DEP[ÓO]SITO\s+EN\s+GARANT[ÍI]A|\$[\s]*[0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?|CANTIDAD\s+DE\s+\$?[0-9,.]+)/gi
        },
        {
          categoria: '🔔 Emplazamiento, Pruebas y Diligencias',
          color: '#a855f7',
          patron: /(?:DILIGENCIA\s+DE\s+EMPLAZAMIENTO|REQUERIMIENTO\s+DE\s+PAGO|EMBARGO\s+DE\s+BIENES|ACTUARIO\s+NOTIFICADOR|C[ÉE]DULA\s+DE\s+NOTIFICACI[ÓO]N|CONTESTACI[ÓO]N\s+DE\s+DEMANDA|EXCEPCIONES\s+Y\s+DEFENSAS|PRUEBAS|CONFESIONAL|TESTIMONIAL|DOCUMENTAL\s+P[ÚU]BLICA|DOCUMENTAL\s+PRIVADA)/gi
        },
        {
          categoria: '⏳ Plazos, Términos y Prevenciones',
          color: '#ef4444',
          patron: /(?:T[ÉE]RMINO\s+(?:DE|IMPRORROGABLE\s+DE)?\s*\d+\s+D[ÍI]AS|PREVENCI[ÓO]N|APERCIBIMIENTO|APERCIBID[OA]|REBELD[ÍI]A|CADUCIDAD\s+DE\s+LA\s+INSTANCIA|AUDIENCIA\s+(?:DE\s+LEY|PRELIMINAR|DE\s+JUICIO|CONCILIATORIA)|VENCIMIENTO|VIGENCIA)/gi
        },
        {

          color: '#eab308',
          patron: /(?:VISTOS\s+PARA\s+RESOLVER|RESULTANDO|CONSIDERANDO|PROPOSICIONES|PUNTOS\s+RESOLUTIVOS|SENTENCIA\s+(?:DEFINITIVA|INTERLOCUTORIA)|CAUSA\s+EJECUTORIA|COSA\s+JUZGADA|RECURSO\s+DE\s+(?:APELACI[ÓO]N|REVOCACI[ÓO]N)|JUICIO\s+DE\s+AMPARO|SUSPENSI[ÓO]N\s+PROVISIONAL)/gi
        },
        {
          categoria: '🤝 Cláusulas y Convenios MASC / IJA',
          color: '#14b8a6',
          patron: /(?:CL[ÁA]USULA\s+(?:PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA|SEXTA|S[ÉE]PTIMA|OCTAVA|NOVENA|D[ÉE]CIMA|\d+)|PREVENTIVO\s+DE\s+ARRENDAMIENTO|PENSI[ÓO]N\s+ALIMENTICIA|GUARDA\s+Y\s+CUSTODIA|DIVORCIO\s+(?:POR\s+MUTUO|ADMINISTRATIVO)|PREDIAL\s*(?:N[ÚU]MERO|CUENTA)?\s*[:#]?\s*[0-9\-]{5,15}|ESCRITURA\s+P[ÚU]BLICA|ACREDITACI[ÓO]N\s*(?:0?65|353)|DIRECTOR\s+GENERAL)/gi
        }
      ],

      async inicializar() {
        this.inicializarEventosDibujo();
        await this.cargarCatalogoYExpedienteActivo();
      },

      // 1. CARGADOR UNIVERSAL: Busca en Juzgados y en Convenios MASC sin perder los archivos
      async cargarCatalogoYExpedienteActivo() {
        const params = new URLSearchParams(window.location.search);
        const expIdUrl = params.get('id');
        const expNumUrl = params.get('exp');

        let listaMasc = [];
        let listaJuz = [];

        if (window.localforage) {
          listaMasc = (await localforage.getItem('boveda_pro_despacho45_lf_bd_masc')) ||
                      (await localforage.getItem('boveda_pro_aldo_indep_lf_bd_masc')) || [];
          listaJuz = (await localforage.getItem('boveda_pro_despacho45_lf_bd_juzgados')) ||
                     (await localforage.getItem('boveda_pro_aldo_indep_lf_bd_juzgados')) || [];
        }

        if (listaMasc.length === 0) {
          try { listaMasc = JSON.parse(localStorage.getItem('boveda_pro_despacho45_bd_masc') || '[]'); } catch (e) {}
        }
        if (listaJuz.length === 0) {
          try { listaJuz = JSON.parse(localStorage.getItem('boveda_pro_despacho45_bd_juzgados') || '[]'); } catch (e) {}
        }

        this.todosLosExpedientes = [...listaJuz, ...listaMasc];

        // Buscar el expediente solicitado
        let encontrado = null;
        if (window.localforage) {
          const paquete = await localforage.getItem('paquete_visor_activo');
          if (paquete && (!expIdUrl || paquete.expId === expIdUrl || paquete.numExpediente === expNumUrl)) {
            encontrado = {
              id: paquete.expId,
              tipoRegistro: paquete.tipoRegistro || 'juzgado',
              numExpediente: paquete.numExpediente,
              solicitante: paquete.solicitante,
              centro: paquete.centro,
              categoria: paquete.categoria,
              predial: paquete.predial || '',
              docs: paquete.docs || {},
              piezasPreCargadas: paquete.piezas || []
            };
          }
        }

        if (!encontrado || Object.keys(encontrado.docs || {}).length === 0) {
          const deLista = this.todosLosExpedientes.find(e => e.id === expIdUrl || e.numExpediente === expNumUrl);
          if (deLista) encontrado = deLista;
        }

        if (!encontrado) {
          try {
            const lsExp = JSON.parse(localStorage.getItem('visor_active_expediente') || 'null');
            if (lsExp) encontrado = lsExp;
          } catch (e) {}
        }

        if (!encontrado && this.todosLosExpedientes.length > 0) {
          encontrado = this.todosLosExpedientes[0];
        }

        this.expedienteActual = encontrado;
        this.poblarSelectorSuperior();
        await this.procesarYDesglosarExpedienteActivo();
      },

      poblarSelectorSuperior() {
        const sel = document.getElementById('visor-exp-selector');
        if (!sel) return;

        if (this.todosLosExpedientes.length === 0 && this.expedienteActual) {
          this.todosLosExpedientes = [this.expedienteActual];
        }

        if (this.todosLosExpedientes.length === 0) {
          sel.innerHTML = `<option value="">Sin expedientes registrados</option>`;
          return;
        }

        sel.innerHTML = this.todosLosExpedientes.map(e => {
          const etiquetaTipo = (e.tipoRegistro === 'juzgado' || (e.centro && e.centro.includes('Juzgado'))) ? '⚖️' : '🤝';
          const selected = (this.expedienteActual && e.id === this.expedienteActual.id) ? 'selected' : '';
          return `<option value="${e.id}" ${selected}>${etiquetaTipo} ${e.numExpediente} - ${(e.solicitante || e.centro || 'Expediente').substring(0, 32)}</option>`;
        }).join('');
      },

      async cambiarExpedienteDesdeSelector(nuevoId) {
        const dest = this.todosLosExpedientes.find(e => e.id === nuevoId);
        if (!dest) return;
        this.expedienteActual = dest;
        this.fojaIndiceActual = 0;
        await this.procesarYDesglosarExpedienteActivo();
      },

      // Recupera el binario ArrayBuffer desde LocalForage o Google Drive
      async recuperarBinarioDePieza(docInfo, exp) {
        if (docInfo.arrayBuffer && docInfo.arrayBuffer.byteLength > 0) {
          return docInfo.arrayBuffer;
        }
        if (window.localforage) {
          if (docInfo.storeKey) {
            const item = await localforage.getItem(docInfo.storeKey);
            if (item) {
              if (item instanceof ArrayBuffer) return item;
              if (ArrayBuffer.isView(item)) return item.buffer;
              if (item instanceof Blob) return await item.arrayBuffer();
            }
          }
          // Búsqueda por coincidencia de número de expediente en las llaves de LocalForage
          const numLimpio = String(exp?.numExpediente || '').replace(/\W/g, '_');
          const llaves = await localforage.keys();
          const llaveMatch = llaves.find(k =>
            k.startsWith('bin_') &&
            ((docInfo.storeKey && k.includes(docInfo.storeKey)) || (numLimpio && k.includes(numLimpio)))
          );
          if (llaveMatch) {
            const item = await localforage.getItem(llaveMatch);
            if (item instanceof ArrayBuffer) return item;
            if (ArrayBuffer.isView(item)) return item.buffer;
            if (item instanceof Blob) return await item.arrayBuffer();
          }
        }

        // Respaldo desde Google Drive si cuenta con token activo
        const token = localStorage.getItem('drive_token');
        if (token && docInfo.driveFileId && !token.startsWith('oauth_session_')) {
          try {
            const res = await fetch(`https://www.googleapis.com/drive/v3/files/${docInfo.driveFileId}?alt=media`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (res.ok) {
              const ab = await res.arrayBuffer();
              if (window.localforage && docInfo.storeKey) await localforage.setItem(docInfo.storeKey, ab);
              return ab;
            }
          } catch (e) {}
        }
        return null;
      },

      decodificarDocWord97(arrayBuffer, fileName) {
        try {
          const bytes = new Uint8Array(arrayBuffer);
          let bloques = [];
          let actual = '';
          for (let i = 0; i < bytes.length; i++) {
            const b = bytes[i];
            if ((b >= 32 && b <= 126) || (b >= 160 && b <= 255) || b === 10 || b === 13 || b === 9) {
              actual += (b === 13 || b === 10) ? '\n' : String.fromCharCode(b);
            } else {
              const limpio = actual.trim();
              if (limpio.length >= 24 && /[AEIOUÁÉÍÓÚaeiouáéíóú]{2,}/.test(limpio) && !/^(Root Entry|WordDocument|CompObj|Microsoft Word|Normal\.dot|MSWordDoc)/i.test(limpio)) {
                bloques.push(limpio);
              }
              actual = '';
            }
          }
          if (actual.trim().length >= 24) bloques.push(actual.trim());
          const texto = bloques.join('\n\n');
          const html = bloques.map(p => `<p>${p.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</p>`).join('');
          return { texto: texto || fileName, html: html || `<p>${fileName}</p>` };
        } catch (e) {
          return { texto: fileName, html: `<p>${fileName}</p>` };
        }
      },

      // 2. DESGLOSA TODOS LOS ARCHIVOS DEL EXPEDIENTE EN FOJAS INDIVIDUALES
      async procesarYDesglosarExpedienteActivo() {
        this.fojasRenderizadas = [];
        this.fojaIndiceActual = 0;

        const areaRender = document.getElementById('sheet-render-area');
        if (areaRender) {
          areaRender.innerHTML = `<div class="empty-doc-state"><i class="fa-solid fa-spinner fa-spin" style="font-size:36px; color:#f59e0b; margin-bottom:12px;"></i><h3>Cargando fojas del expediente...</h3></div>`;
        }

        if (!this.expedienteActual) {
          this.renderizarEstadoVacio();
          return;
        }

        // Cargar apuntes guardados de este expediente
        const notasGuardadas = localStorage.getItem(`apuntes_exp_${this.expedienteActual.id}`) || this.expedienteActual.predial || '';
        const txtApuntes = document.getElementById('visor-apuntes-textarea');
        if (txtApuntes) txtApuntes.value = notasGuardadas;

        // Reunir piezas documentales ordenadas por fojaOrden
        let listaPiezas = [];
        if (Array.isArray(this.expedienteActual.piezasPreCargadas) && this.expedienteActual.piezasPreCargadas.length > 0) {
          listaPiezas = [...this.expedienteActual.piezasPreCargadas];
        } else if (this.expedienteActual.docs) {
          listaPiezas = Object.entries(this.expedienteActual.docs)
            .filter(([_, d]) => d && d.fileName)
            .map(([slotKey, d]) => ({ slotKey, ...d }));
        }

        listaPiezas.sort((a, b) => (Number(a.fojaOrden) || 10) - (Number(b.fojaOrden) || 10));

        let contadorFojaGlobal = 1;

        for (const pieza of listaPiezas) {
          const fileName = pieza.fileName || 'Documento.pdf';
          const ext = (fileName.split('.').pop() || '').toLowerCase();
          const tituloSlot = (pieza.slotKey || 'documento').replace(/_/g, ' ').toUpperCase();
          const ab = await this.recuperarBinarioDePieza(pieza, this.expedienteActual);

          if (ab && ext === 'pdf' && window.pdfjsLib) {
            try {
              const pdf = await pdfjsLib.getDocument({ data: ab.slice(0) }).promise;
              for (let numPag = 1; numPag <= pdf.numPages; numPag++) {
                const page = await pdf.getPage(numPag);
                const viewport = page.getViewport({ scale: 1.65 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

                const content = await page.getTextContent();
                let textoPag = content.items.map(it => it.str).join(' ').trim();
                if (!textoPag && pieza.extractedText && numPag === 1) {
                  textoPag = pieza.extractedText;
                }

                this.fojasRenderizadas.push({
                  numFoja: contadorFojaGlobal++,
                  tituloSlot: `${tituloSlot} (Pág. ${numPag}/${pdf.numPages})`,
                  fileName,
                  tipo: 'imagen',
                  dataUrl: canvas.toDataURL('image/jpeg', 0.88),
                  html: '',
                  texto: textoPag,
                  rawBuffer: ab,
                  mimeType: 'application/pdf'
                });
              }
              continue;
            } catch (errPdf) {
              console.warn('Error al desglosar PDF:', errPdf);
            }
          }

          if (ab && ext === 'docx' && window.mammoth) {
            try {
              const [resHtml, resTxt] = await Promise.all([
                mammoth.convertToHtml({ arrayBuffer: ab.slice(0) }),
                mammoth.extractRawText({ arrayBuffer: ab.slice(0) })
              ]);
              this.fojasRenderizadas.push({
                numFoja: contadorFojaGlobal++,
                tituloSlot,
                fileName,
                tipo: 'html',
                dataUrl: '',
                html: resHtml.value || `<p>${resTxt.value || fileName}</p>`,
                texto: resTxt.value || pieza.extractedText || '',
                rawBuffer: ab,
                mimeType: pieza.mimeType || 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
              });
              continue;
            } catch (errDocx) {}
          }

          if (ab && ext === 'doc') {
            const dec = this.decodificarDocWord97(ab, fileName);
            this.fojasRenderizadas.push({
              numFoja: contadorFojaGlobal++,
              tituloSlot,
              fileName,
              tipo: 'html',
              dataUrl: '',
              html: dec.html,
              texto: dec.texto || pieza.extractedText || '',
              rawBuffer: ab,
              mimeType: 'application/msword'
            });
            continue;
          }

          if (ab && ['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
            const blob = new Blob([ab], { type: pieza.mimeType || 'image/jpeg' });
            const dataUrl = await new Promise(r => {
              const reader = new FileReader();
              reader.onload = () => r(reader.result);
              reader.readAsDataURL(blob);
            });
            this.fojasRenderizadas.push({
              numFoja: contadorFojaGlobal++,
              tituloSlot,
              fileName,
              tipo: 'imagen',
              dataUrl,
              html: '',
              texto: pieza.extractedText || '',
              rawBuffer: ab,
              mimeType: pieza.mimeType || 'image/jpeg'
            });
            continue;
          }

          // Si solo se cuenta con el HTML o texto extraído en caché
          if (pieza.htmlContent || pieza.extractedText) {
            const tmp = document.createElement('div');
            tmp.innerHTML = pieza.htmlContent || `<p>${pieza.extractedText}</p>`;
            this.fojasRenderizadas.push({
              numFoja: contadorFojaGlobal++,
              tituloSlot,
              fileName,
              tipo: 'html',
              dataUrl: '',
              html: pieza.htmlContent || `<div style="white-space:pre-wrap;">${pieza.extractedText}</div>`,
              texto: pieza.extractedText || tmp.innerText || '',
              rawBuffer: null,
              mimeType: 'text/html'
            });
          }
        }

        this.renderizarListaMiniaturasIzquierda();

        if (this.fojasRenderizadas.length > 0) {
          this.irAFoja(0);
          await this.ejecutarReconocimientoIA(false);
        } else {
          this.renderizarEstadoVacio();
        }
      },

      renderizarEstadoVacio() {
        document.getElementById('visor-page-counter').textContent = '0/0';
        document.getElementById('fojas-sidebar-list').innerHTML = '';
        const area = document.getElementById('sheet-render-area');
        if (area) {
          area.innerHTML = `
            <div class="empty-doc-state">
              <i class="fa-solid fa-file-circle-plus" style="font-size:48px; color:#d97706; margin-bottom:14px;"></i>
              <h2 style="margin:0 0 8px 0; font-size:20px; color:#0f172a;">Este expediente aún no tiene documentos subidos</h2>
              <p style="max-width:460px; color:#475569; font-size:13.5px; line-height:1.5;">
                Usa el botón <strong>"+ Insertar Foja"</strong> a la izquierda o <strong>"Cargar"</strong> arriba a la derecha para subir la Demanda, Auto Judicial, Convenio o PDF escaneado y analizarlo con <strong>IA</strong>.
              </p>
            </div>
          `;
        }
        const contIA = document.getElementById('ia-results-container');
        if (contIA) {
          contIA.innerHTML = `
            <div style="padding:16px; text-align:center; color:#64748b; font-size:12px; line-height:1.5;">
              Sube un documento con el botón <strong>"Cargar"</strong> y pulsa <strong>"🟠 IA"</strong> para listar actuaciones de juzgado, montos, términos y cláusulas.
            </div>
          `;
        }
      },

      renderizarListaMiniaturasIzquierda() {
        const cont = document.getElementById('fojas-sidebar-list');
        if (!cont) return;

        cont.innerHTML = this.fojasRenderizadas.map((foja, idx) => `
          <div onclick="VisorApp.irAFoja(${idx})" class="foja-thumb-card ${idx === this.fojaIndiceActual ? 'activa' : ''}">
            <div class="foja-thumb-header">
              <span>FOJA ${String(foja.numFoja).padStart(3, '0')}</span>
              <span style="color:#94a3b8; font-size:9.5px;">${foja.tipo === 'imagen' ? 'PDF/IMG' : 'DOC'}</span>
            </div>
            <div class="foja-thumb-preview">
              ${foja.tipo === 'imagen'
                ? `<img src="${foja.dataUrl}" alt="Foja ${foja.numFoja}" />`
                : `<div style="overflow:hidden; max-height:100px; font-size:8px; text-align:left; color:#334155;">
                     <strong style="display:block; color:#0f172a; margin-bottom:3px;">${foja.fileName}</strong>${(foja.texto || '').substring(0, 180)}...
                   </div>`
              }
            </div>
            <div style="margin-top:5px; font-size:10px; color:#cbd5e1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
              ${foja.tituloSlot}
            </div>
          </div>
        `).join('');
      },

      irAFoja(indice, palabraAResaltar = '') {
        if (this.fojasRenderizadas.length === 0) return;
        if (indice < 0 || indice >= this.fojasRenderizadas.length) return;

        this.fojaIndiceActual = indice;
        const foja = this.fojasRenderizadas[indice];
        document.getElementById('visor-page-counter').textContent = `${indice + 1}/${this.fojasRenderizadas.length}`;

        const area = document.getElementById('sheet-render-area');
        if (foja.tipo === 'imagen') {
          area.innerHTML = `<img src="${foja.dataUrl}" class="sheet-image-render" alt="Foja ${foja.numFoja}" />`;
        } else {
          let htmlMostrar = foja.html || `<div style="white-space:pre-wrap;">${foja.texto}</div>`;
          if (palabraAResaltar && palabraAResaltar.trim().length >= 2) {
            const rx = new RegExp(`(${palabraAResaltar.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            htmlMostrar = htmlMostrar.replace(rx, '<mark class="ia-highlight">$1</mark>');
          }
          area.innerHTML = `<div class="sheet-html-content">${htmlMostrar}</div>`;
        }

        this.renderizarListaMiniaturasIzquierda();
        setTimeout(() => {
          this.ajustarLienzoDibujo();
          const markEl = area.querySelector('mark.ia-highlight');
          if (markEl) markEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 80);
      },

      invertirOrdenFojas() {
        if (this.fojasRenderizadas.length < 2) return;
        this.fojasRenderizadas.reverse();
        this.fojasRenderizadas.forEach((f, idx) => { f.numFoja = idx + 1; });
        this.irAFoja(0);
      },

      cambiarZoom(delta) {
        this.zoomActual = Math.min(2.2, Math.max(0.55, +(this.zoomActual + delta).toFixed(2)));
        document.getElementById('sheet-container').style.transform = `scale(${this.zoomActual})`;
      },

      resetZoom() {
        this.zoomActual = 1;
        document.getElementById('sheet-container').style.transform = 'scale(1)';
      },

      // 3. HERRAMIENTAS DE MARCATEXTOS Y PLUMA SOBRE LA FOJA
      inicializarEventosDibujo() {
        const canvas = document.getElementById('annotation-canvas');
        if (!canvas) return;

        const obtenerCoords = (e) => {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: (clientX - rect.left) / this.zoomActual,
            y: (clientY - rect.top) / this.zoomActual
          };
        };

        const iniciar = (e) => {
          if (!this.herramientaActiva) return;
          this.dibujando = true;
          const ctx = canvas.getContext('2d');
          const { x, y } = obtenerCoords(e);
          ctx.beginPath();
          ctx.moveTo(x, y);
        };

        const mover = (e) => {
          if (!this.dibujando || !this.herramientaActiva) return;
          e.preventDefault();
          const ctx = canvas.getContext('2d');
          const { x, y } = obtenerCoords(e);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (this.herramientaActiva === 'highlight') {
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.38)';
            ctx.lineWidth = 18;
          } else {
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.92)';
            ctx.lineWidth = 2.5;
          }
          ctx.lineTo(x, y);
          ctx.stroke();
        };

        const terminar = () => {
          if (!this.dibujando) return;
          this.dibujando = false;
          this.trazosPorFoja[this.fojaIndiceActual] = canvas.toDataURL();
        };

        canvas.addEventListener('mousedown', iniciar);
        canvas.addEventListener('mousemove', mover);
        window.addEventListener('mouseup', terminar);
        canvas.addEventListener('touchstart', iniciar, { passive: false });
        canvas.addEventListener('touchmove', mover, { passive: false });
        window.addEventListener('touchend', terminar);
      },

      ajustarLienzoDibujo() {
        const sheet = document.getElementById('sheet-container');
        const canvas = document.getElementById('annotation-canvas');
        if (!sheet || !canvas) return;
        canvas.width = sheet.offsetWidth || 820;
        canvas.height = sheet.offsetHeight || 980;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const guardado = this.trazosPorFoja[this.fojaIndiceActual];
        if (guardado) {
          const img = new Image();
          img.onload = () => ctx.drawImage(img, 0, 0);
          img.src = guardado;
        }
      },

      activarHerramientaDibujo(tipo) {
        this.herramientaActiva = (this.herramientaActiva === tipo) ? null : tipo;
        const canvas = document.getElementById('annotation-canvas');
        if (canvas) canvas.style.pointerEvents = this.herramientaActiva ? 'auto' : 'none';
        document.getElementById('btn-tool-highlight').classList.toggle('activo', this.herramientaActiva === 'highlight');
        document.getElementById('btn-tool-pen').classList.toggle('activo', this.herramientaActiva === 'pen');
      },

      limpiarAnotacionesFoja() {
        const canvas = document.getElementById('annotation-canvas');
        if (!canvas) return;
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        delete this.trazosPorFoja[this.fojaIndiceActual];
      },
// === FIN DE LA PARTE 2 DE 3 (SECCIÓN 2: VISOR) - PEGA LA PARTE 3 JUSTO DEBAJO DE ESTA LÍNEA ===
cambiarTabDerecha(tab) {

        document.getElementById('panel-derecha-alertas').style.display = esAlertas ? 'flex' : 'none';
        document.getElementById('panel-derecha-apuntes').style.display = esAlertas ? 'none' : 'flex';
        document.getElementById('tab-btn-alertas').classList.toggle('activo', esAlertas);
        document.getElementById('tab-btn-apuntes').classList.toggle('activo', !esAlertas);
      },

      guardarApuntesExpediente(texto) {
        if (!this.expedienteActual) return;
        localStorage.setItem(`apuntes_exp_${this.expedienteActual.id}`, texto);
      },

      // 4. SUBIR ARCHIVOS DIRECTAMENTE DESDE EL VISOR ("+ Insertar Foja" o "Cargar")
      async subirArchivosAlExpediente(fileList) {
        if (!fileList || fileList.length === 0) return;

        if (!this.expedienteActual) {
          this.expedienteActual = {
            id: `exp-visor-${Date.now()}`,
            tipoRegistro: 'juzgado',
            numExpediente: '001/2026',
            solicitante: 'EXPEDIENTE CARGADO EN VISOR',
            centro: 'Juzgado 1° de lo Mercantil',
            categoria: 'Mercantil',
            docs: {}
          };
        }

        const subtituloIA = document.getElementById('ia-status-subtitle');
        if (subtituloIA) subtituloIA.textContent = 'Subiendo e integrando fojas...';

        for (let i = 0; i < fileList.length; i++) {
          const file = fileList[i];
          const rawBuffer = await file.arrayBuffer();
          const slotId = this.expedienteActual.tipoRegistro === 'juzgado'
            ? (i === 0 && !this.expedienteActual.docs?.escrito_inicial ? 'escrito_inicial' : `pieza_judicial_${Date.now()}_${i}`)
            : (i === 0 && !this.expedienteActual.docs?.convenio_final ? 'convenio_final' : `anexo_masc_${Date.now()}_${i}`);

          const storeKey = `bin_${(this.expedienteActual.centro || 'Juzgado').replace(/\W/g, '_')}_${(this.expedienteActual.numExpediente || '001').replace(/\W/g, '_')}_${slotId}`;

          if (window.localforage) {
            await localforage.setItem(storeKey, rawBuffer);
          }

          if (!this.expedienteActual.docs) this.expedienteActual.docs = {};
          this.expedienteActual.docs[slotId] = {
            fileName: file.name,
            mimeType: file.type || 'application/pdf',
            pages: 1,
            date: new Date().toISOString().split('T')[0],
            fojaOrden: Object.keys(this.expedienteActual.docs).length + 1,
            storeKey,
            realUploaded: true
          };
        }

        // Sincronizar también en las bases principales de la Bóveda (Juzgados y MASC)
        if (window.localforage) {
          await localforage.setItem('paquete_visor_activo', {
            expId: this.expedienteActual.id,
            tipoRegistro: this.expedienteActual.tipoRegistro,
            numExpediente: this.expedienteActual.numExpediente,
            solicitante: this.expedienteActual.solicitante,
            centro: this.expedienteActual.centro,
            categoria: this.expedienteActual.categoria,
            docs: this.expedienteActual.docs,
            piezas: []
          });

          const claveBD = (this.expedienteActual.tipoRegistro === 'juzgado' || (this.expedienteActual.centro || '').includes('Juzgado'))
            ? 'boveda_pro_despacho45_lf_bd_juzgados'
            : 'boveda_pro_despacho45_lf_bd_masc';

          const listaBD = (await localforage.getItem(claveBD)) || [];
          const idxExistente = listaBD.findIndex(e => e.id === this.expedienteActual.id || e.numExpediente === this.expedienteActual.numExpediente);
          if (idxExistente !== -1) {
            listaBD[idxExistente].docs = { ...(listaBD[idxExistente].docs || {}), ...this.expedienteActual.docs };
          } else {
            listaBD.unshift(this.expedienteActual);
          }
          await localforage.setItem(claveBD, listaBD);
        }

        this.expedienteActual.piezasPreCargadas = [];
        await this.procesarYDesglosarExpedienteActivo();
      },

      descargarArchivoOriginalActual() {
        if (this.fojasRenderizadas.length === 0) {
          alert('No hay ningún documento cargado en este expediente para descargar.');
          return;
        }
        const foja = this.fojasRenderizadas[this.fojaIndiceActual] || this.fojasRenderizadas[0];
        if (foja.rawBuffer) {
          const blob = new Blob([foja.rawBuffer], { type: foja.mimeType || 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = foja.fileName || `Expediente_${this.expedienteActual?.numExpediente || 'Original'}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } else if (foja.dataUrl) {
          const a = document.createElement('a');
          a.href = foja.dataUrl;
          a.download = `Foja_${foja.numFoja}_${foja.fileName || 'imagen.jpg'}`;
          a.click();
        }
      },

      // 5. LECTURA OCR PARA DOCUMENTOS ESCANEADOS (CAMSCANNER / ESCÁNER FÍSICO)
      async ejecutarOCRCompletoEnFojas() {
        if (this.fojasRenderizadas.length === 0) {
          alert('Primero sube o abre un documento en el visor.');
          return;
        }
        if (!window.Tesseract) {
          alert('El motor OCR no está disponible en este momento.');
          return;
        }

        const contIA = document.getElementById('ia-results-container');
        const subtitulo = document.getElementById('ia-status-subtitle');

        // Leer hasta las primeras 6 fojas que sean imagen para respuesta rápida
        const fojasImagen = this.fojasRenderizadas.filter(f => f.tipo === 'imagen' && (!f.texto || f.texto.trim().length < 30)).slice(0, 6);

        if (fojasImagen.length === 0) {
          await this.ejecutarReconocimientoIA(false);
          return;
        }

        for (let i = 0; i < fojasImagen.length; i++) {
          const foja = fojasImagen[i];
          if (subtitulo) subtitulo.textContent = `Leyendo OCR Foja ${foja.numFoja} (${i + 1}/${fojasImagen.length})...`;
          if (contIA) {
            contIA.innerHTML = `
              <div style="padding:16px; background:#111a2e; border:1px solid #f59e0b; border-radius:10px; text-align:center; font-size:12px; color:#fde68a;">
                <i class="fa-solid fa-eye fa-bounce" style="font-size:20px; display:block; margin-bottom:8px;"></i>
                Reconociendo texto con IA (OCR) en Foja #${foja.numFoja}... (${i + 1} de ${fojasImagen.length})
              </div>
            `;
          }
          try {
            const res = await Tesseract.recognize(foja.dataUrl, 'spa');
            if (res && res.data && res.data.text) {
              foja.texto = (foja.texto || '') + '\n' + res.data.text;
            }
          } catch (e) {}
        }

        if (subtitulo) subtitulo.textContent = 'Lectura OCR completada';
        await this.ejecutarReconocimientoIA(false);
      },

      // 6. MOTOR PRINCIPAL DEL BOTÓN NARANJA "IA" (JUZGADOS Y MASC)
      async ejecutarReconocimientoIA(forzarOCRSiVacio = false) {
        this.cambiarTabDerecha('alertas');
        const contIA = document.getElementById('ia-results-container');
        const subtitulo = document.getElementById('ia-status-subtitle');
        if (!contIA) return;

        if (this.fojasRenderizadas.length === 0) {
          this.renderizarEstadoVacio();
          return;
        }

        const textoTotal = this.fojasRenderizadas.map(f => f.texto || '').join(' ').trim();

        // Si el documento vino de un escáner/CamScanner como pura imagen sin texto y el usuario pulsó el botón "IA", lanza OCR automático
        if (textoTotal.length < 30 && forzarOCRSiVacio && window.Tesseract) {
          await this.ejecutarOCRCompletoEnFojas();
          return;
        }

        const hallazgos = [];
        const vistos = new Set();

        // Añadir tarjeta resumen de encabezado del expediente
        if (this.expedienteActual) {
          hallazgos.push({
            fojaIndex: 0,
            numFoja: 1,
            categoria: (this.expedienteActual.tipoRegistro === 'juzgado' || (this.expedienteActual.centro || '').includes('Juzgado'))
              ? '⚖️ Ficha Judicial en Bóveda'
              : '🤝 Ficha Convenio MASC',
            color: '#38bdf8',
            termino: `EXP. ${this.expedienteActual.numExpediente}`,
            fragmento: `${this.expedienteActual.centro} • ${this.expedienteActual.categoria} • Partes: ${this.expedienteActual.solicitante}${this.expedienteActual.predial ? ' • ' + this.expedienteActual.predial : ''}`
          });
        }

        // Recorrer cada foja buscando todas las palabras clave de Juzgados y MASC
        this.fojasRenderizadas.forEach((foja, fIdx) => {
          const txtFoja = foja.texto || '';
          if (txtFoja.length < 5) return;

          for (const regla of this.DICCIONARIO_JURIDICO) {
            let match;
            regla.patron.lastIndex = 0;
            while ((match = regla.patron.exec(txtFoja)) !== null) {
              const termino = match[0].trim();
              const pos = match.index;
              const claveUnica = `${fIdx}_${regla.categoria}_${termino.toUpperCase()}_${Math.floor(pos / 90)}`;

              if (!vistos.has(claveUnica)) {
                vistos.add(claveUnica);
                const inicio = Math.max(0, pos - 40);
                const fin = Math.min(txtFoja.length, pos + termino.length + 80);
                const fragmento = txtFoja.substring(inicio, fin).replace(/\s+/g, ' ').trim();

                hallazgos.push({
                  fojaIndex: fIdx,
                  numFoja: foja.numFoja,
                  categoria: regla.categoria,
                  color: regla.color,
                  termino,
                  fragmento
                });
              }
              if (hallazgos.length >= 80) break;
            }
          }
        });

        this.hallazgosIACache = hallazgos;
        if (subtitulo) {
          subtitulo.textContent = `${hallazgos.length} elementos clave reconocidos`;
        }
        this.renderizarTarjetasIA(hallazgos);
      },

      // Buscador en vivo "Buscar palabra en el documento..."
      filtrarPalabrasIA(query) {
        const q = (query || '').trim();
        if (q.length < 2) {
          this.renderizarTarjetasIA(this.hallazgosIACache);
          return;
        }

        const resultadosBusqueda = [];
        const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');

        this.fojasRenderizadas.forEach((foja, fIdx) => {
          const txtFoja = foja.texto || '';
          let m;
          while ((m = rx.exec(txtFoja)) !== null) {
            const pos = m.index;
            const fragmento = txtFoja.substring(Math.max(0, pos - 40), Math.min(txtFoja.length, pos + q.length + 80)).replace(/\s+/g, ' ').trim();
            resultadosBusqueda.push({
              fojaIndex: fIdx,
              numFoja: foja.numFoja,
              categoria: '🔍 Coincidencia en Documento',
              color: '#38bdf8',
              termino: m[0],
              fragmento
            });
            if (resultadosBusqueda.length >= 50) break;
          }
        });

        this.renderizarTarjetasIA(resultadosBusqueda, q);
      },

      renderizarTarjetasIA(listaHallazgos, queryBusqueda = '') {
        const contIA = document.getElementById('ia-results-container');
        if (!contIA) return;

        if (!listaHallazgos || listaHallazgos.length === 0) {
          contIA.innerHTML = `
            <div style="padding:16px; background:#111a2e; border:1px solid rgba(148,163,184,0.2); border-radius:10px; text-align:center; color:#94a3b8; font-size:12px; line-height:1.5;">
              ${queryBusqueda
                ? `No se encontró la palabra <strong>"${queryBusqueda}"</strong> en el texto extraído.`
                : `Este documento es una imagen escaneada sin texto digital. Pulsa el botón azul <strong>"👁️ Leer Escaneo (OCR)"</strong> arriba a la derecha o el botón naranja <strong>"🟠 IA"</strong> para leerlo con reconocimiento óptico.`}
            </div>
          `;
          return;
        }

        contIA.innerHTML = listaHallazgos.map(h => `
          <div
            onclick="VisorApp.irAFoja(${h.fojaIndex}, '${h.termino.replace(/'/g, "\\'")}')"
            class="ia-card-item"
            style="border-left: 3.5px solid ${h.color};"
            title="Clic para ir a la Foja ${h.numFoja} y localizar el texto"
          >
            <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:4px;">
              <span style="font-size:10px; font-weight:800; color:${h.color}; text-transform:uppercase;">${h.categoria}</span>
              <span style="font-size:9.5px; font-family:'JetBrains Mono',monospace; background:rgba(255,255,255,0.08); color:#fde68a; padding:2px 6px; border-radius:4px; font-weight:700;">
                Foja ${h.numFoja}
              </span>
            </div>
            <div style="font-size:11.5px; font-weight:800; color:#ffffff; margin-bottom:3px;">
              ${h.termino}
            </div>
            <div style="font-size:11px; color:#cbd5e1; line-height:1.4;">
              "...${h.fragmento}..."
            </div>
          </div>
        `).join('');
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      VisorApp.inicializar();
    });
  </script>
