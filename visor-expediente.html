<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>45YMÁS Bóveda Inteligente | Visor de Expedientes</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-dark: #070b14;
      --bg-sidebar: #0b1120;
      --bg-card: #111a2e;
      --accent-orange: #ea580c;
      --accent-amber: #f59e0b;
      --accent-blue: #38bdf8;
      --border-line: rgba(148, 163, 184, 0.16);
      --text-light: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050811; }
    ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.4); border-radius: 999px; }

    #pantalla-progreso {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(7, 11, 20, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .progreso-box {
      background: var(--bg-sidebar);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 20px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .barra-fondo {
      width: 100%;
      height: 10px;
      background: #050811;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    #barra-llena {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ea580c, #f59e0b, #38bdf8);
      transition: width 0.2s ease;
    }

    .topbar {
      height: 58px;
      background: #090e1a;
      border-bottom: 1px solid var(--border-line);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      shrink: 0;
    }

    .brand-block {
      display: flex;
       flex-direction: column;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      color: var(--accent-amber);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-sub {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-top {
      background: #131c31;
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.22);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s;
    }

    .btn-top:hover {
      border-color: var(--accent-amber);
      color: #ffffff;
    }

    .pill-exp {
      background: rgba(30, 58, 138, 0.45);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      max-width: 340px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-ia-orange {
      background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
      color: #ffffff;
      border: none;
      font-weight: 800;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 230px 1fr 320px;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar-fojas {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }

    .btn-dashed-orange {
      width: 100%;
      background: rgba(234, 88, 12, 0.08);
      border: 1px dashed rgba(245, 158, 11, 0.6);
      color: #fb923c;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.18s;
    }

    .btn-dashed-orange:hover {
      background: rgba(234, 88, 12, 0.18);
    }

    .btn-dashed-blue {
      width: 100%;
      background: rgba(56, 189, 248, 0.08);
      border: 1px dashed rgba(56, 189, 248, 0.55);
      color: #38bdf8;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #lista-fojas-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .foja-item {
      background: #0d1424;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .foja-item:hover {
      border-color: var(--accent-amber);
    }

    .foja-item.activa {
      border: 2px solid #38bdf8;
      background: rgba(14, 30, 56, 0.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
    }

    .foja-item-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .foja-thumb-box {
      width: 100%;
      height: 118px;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .foja-thumb-box canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .foja-thumb-word-preview {
      width: 100%;
      height: 100%;
      padding: 6px;
      font-size: 5px;
      line-height: 1.25;
      color: #0f172a;
      overflow: hidden;
      text-align: left;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    .foja-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding-top: 2px;
    }

    .foja-ctrl-btn {
      background: #17223b;
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      width: 26px;
      height: 24px;
      font-size: 0.68rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .foja-ctrl-btn:hover {
      background: #253559;
      color: #ffffff;
    }

    .visor-central {
      background: #050811;
      position: relative;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 22px;
    }

    .foja-canvas-container {
      background: #ffffff;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      border-radius: 4px;
      transition: transform 0.18s ease;
      transform-origin: top center;
      position: relative;
    }

    #canvas-principal {
      display: block;
      max-width: 100%;
      height: auto;
    }

    #html-visor {
      width: 820px;
      max-width: 92vw;
      min-height: 1060px;
      background: #ffffff;
      color: #000000;
      padding: 50px 60px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11.5pt;
      line-height: 1.65;
    }

    #html-visor * { color: #000000; }
    #html-visor table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    #html-visor td, #html-visor th { border: 1px solid #000000; padding: 6px 10px; }

    #controles-zoom {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 45;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }

    .zoom-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.25);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .zoom-btn:hover {
      background: #334155;
      border-color: var(--accent-amber);
    }

    .sidebar-herramientas {
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .tabs-right {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border-line);
    }

    .tab-right-btn {
      background: transparent;
      color: var(--text-dim);
      border: none;
      border-bottom: 2px solid transparent;
      padding: 13px 10px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }

    .tab-right-btn.activa {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .keyword-card {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.18s;
    }

    .keyword-card:hover {
      border-color: var(--accent-amber);
    }

    .keyword-word {
      font-size: 0.72rem;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .keyword-snippet {
      font-size: 0.74rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .nota-area {
      width: 100%;
      min-height: 100px;
      background: #060a14;
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 10px;
      color: #ffffff;
      font-size: 0.76rem;
      resize: vertical;
      outline: none;
    }

    .nota-guardada {
      background: var(--bg-card);
      border-left: 3px solid var(--accent-amber);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.74rem;
    }

    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 180px 1fr; }
      .sidebar-herramientas { display: none; }
    }
  </style>
</head>
<body>

  <div id="pantalla-progreso">
    <div class="progreso-box">
      <i class="fa-solid fa-scale-balanced fa-bounce" style="font-size:2.2rem; color:#f59e0b; margin-bottom:12px;"></i>
      <div id="texto-progreso" style="font-size:0.9rem; font-weight:800;">Cargando archivos originales del expediente...</div>
      <div class="barra-fondo">
        <div id="barra-llena"></div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand-block">
      <div class="brand-title"><i class="fa-solid fa-scale-balanced"></i> 45YMÁS</div>
      <div class="brand-sub">BÓVEDA INTELIGENTE</div>
    </div>

    <div class="topbar-right">
      <a href="index.html" class="btn-top"><i class="fa-solid fa-house"></i> Inicio</a>
      <a href="portal-pro.html" class="btn-top"><i class="fa-solid fa-folder-tree"></i> Bóveda</a>
      <div id="titulo-exp" class="pill-exp">Cargando expediente...</div>
      <label class="btn-top" style="cursor:pointer;">
        <i class="fa-solid fa-file-arrow-up text-sky-400"></i> Cargar
        <input type="file" id="pdf-upload" multiple accept=".pdf,.doc,.docx" style="display:none;" onchange="cargarDocumentoManual(this.files)" />
      </label>
      <button id="btn-analizar" onclick="escanearAlertasInfalible()" class="btn-top btn-ia-orange">
        <i class="fa-solid fa-brain"></i> IA
      </button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar-fojas">
      <label class="btn-dashed-orange">
        <i class="fa-solid fa-plus"></i> Insertar Foja
        <input type="file" multiple accept=".pdf,.doc,.docx" style="display:none;" onchange="cargarDocumentoManual(this.files)" />
      </label>
      <button onclick="ordenarFojasPorPrelacion()" class="btn-dashed-blue">
        <i class="fa-solid fa-arrow-down-1-9"></i> Ordenar
      </button>

      <div id="lista-fojas-container"></div>
    </aside>

    <main id="visor-central-scroll" class="visor-central">
      <div id="contenedor-foja-unica" class="foja-canvas-container">
        <canvas id="canvas-principal" style="display:none;"></canvas>
        <div id="html-visor" style="display:none;"></div>
      </div>

      <div id="controles-zoom">
        <button onclick="cambiarZoom(0.15)" class="zoom-btn" title="Acercar"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button onclick="cambiarZoom(-0.15)" class="zoom-btn" title="Alejar"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button onclick="cambiarZoom(0, true)" class="zoom-btn" title="100%" style="font-size:0.7rem; font-weight:800;">1:1</button>
      </div>
    </main>

    <aside class="sidebar-herramientas">
      <div class="tabs-right">
        <button id="tab-palabras" onclick="cambiarTabDerecha('palabras')" class="tab-right-btn activa">Alertas IA</button>
        <button id="tab-notas" onclick="cambiarTabDerecha('notas')" class="tab-right-btn"><i class="fa-regular fa-pen-to-square"></i> Apuntes</button>
      </div>

      <div id="panel-palabras" class="panel-content">
        <p style="font-size:0.74rem; color:#94a3b8; line-height:1.45;">
          La IA buscará alertas de la <strong>Ley de Justicia Alternativa</strong> automáticamente sobre los documentos originales subidos.
        </p>
        <div id="contenedor-alertas-resultados" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>

      <div id="panel-notas" class="panel-content" style="display:none;">
        <textarea id="texto-notas" class="nota-area" placeholder="Escribe un apunte para la foja actual..."></textarea>
        <button onclick="guardarNotas()" class="btn-top btn-ia-orange" style="justify-content:center; width:100%;">
          <i class="fa-solid fa-floppy-disk"></i> Guardar Apunte
        </button>
        <div id="indice-notas-container" style="display:flex; flex-direction:column; gap:8px; margin-top:6px;"></div>
      </div>
    </aside>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let expedienteActual = null;
    let fojasEnMemoria = [];
    let indiceFojaActiva = 0;
    let nivelZoom = 1.0;
    let notasDelExpediente = [];

    function mostrarProgreso(texto, pct = 20) {
      document.getElementById('pantalla-progreso').style.display = 'flex';
      document.getElementById('texto-progreso').textContent = texto;
      document.getElementById('barra-llena').style.width = `${pct}%`;
    }

    function actualizarBarra(pct, texto = '') {
      document.getElementById('barra-llena').style.width = `${pct}%`;
      if (texto) document.getElementById('texto-progreso').textContent = texto;
    }

    function ocultarProgreso() {
      setTimeout(() => {
        document.getElementById('pantalla-progreso').style.display = 'none';
      }, 180);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await inicializarVisorConExpedienteReal();
    });

    async function inicializarVisorConExpedienteReal() {
      mostrarProgreso('Cargando archivos originales del expediente...', 25);

      if (window.localforage) {
        await localforage.removeItem('archivo_actual');
        await localforage.removeItem('ultimo_expediente');
      }

      const params = new URLSearchParams(window.location.search);
      const paramId = params.get('id');
      const paramExp = params.get('exp');

      let expEncontrado = null;

      if (window.localforage) {
        const paqueteActivo = await localforage.getItem('paquete_visor_activo');
        if (paqueteActivo && (!paramId || paqueteActivo.expId === paramId)) {
          expEncontrado = {
            id: paqueteActivo.expId,
            numExpediente: paqueteActivo.numExpediente,
            solicitante: paqueteActivo.solicitante,
            centro: paqueteActivo.centro,
            categoria: paqueteActivo.categoria,
            piezasEmpaquetadas: paqueteActivo.piezas || []
          };
        }
      }

      if (!expEncontrado) {
        for (const ent of ['despacho45', 'aldo_indep']) {
          for (const tabla of ['bd_masc', 'bd_juzgados']) {
            const raw = localStorage.getItem(`boveda_pro_${ent}_${tabla}`);
            if (!raw) continue;
            try {
              const lista = JSON.parse(raw);
              const hallado = lista.find(e => (paramId && String(e.id) === String(paramId)) || (paramExp && e.numExpediente === paramExp));
              if (hallado) { expEncontrado = hallado; break; }
            } catch (e) {}
          }
          if (expEncontrado) break;
        }
      }

      if (!expEncontrado) {
        const rawActive = localStorage.getItem('visor_active_expediente');
        if (rawActive) {
          try { expEncontrado = JSON.parse(rawActive); } catch (e) {}
        }
      }

      if (!expEncontrado) {
        ocultarProgreso();
        document.getElementById('titulo-exp').textContent = 'Sin expediente';
        mostrarMensajeSubirArchivos();
        return;
      }

      expedienteActual = expEncontrado;
      document.getElementById('titulo-exp').textContent = `${expedienteActual.numExpediente} - ${expedienteActual.solicitante}`;

      cargarNotasGuardadas();
      await construirFojasDesdeArchivosReales(expedienteActual);
      ocultarProgreso();
    }

    function mostrarMensajeSubirArchivos() {
      const canvas = document.getElementById('canvas-principal');
      const htmlVisor = document.getElementById('html-visor');
      canvas.style.display = 'none';
      htmlVisor.style.display = 'block';
      htmlVisor.innerHTML = `
        <div style="text-align:center; padding:80px 20px;">
          <i class="fa-solid fa-file-circle-plus" style="font-size:3.2rem; color:#f59e0b; margin-bottom:16px;"></i>
          <h2 style="font-size:1.3rem; font-weight:800; margin-bottom:10px;">Este expediente aún no tiene documentos subidos</h2>
          <p style="font-size:0.95rem; color:#475569; max-width:480px; margin:0 auto 24px auto;">
            Usa el botón <strong>"+ Insertar Foja"</strong> a la izquierda o <strong>"Cargar"</strong> arriba a la derecha para subir el Convenio o los PDFs escaneados y verlos aquí tal cual fueron subidos.
          </p>
        </div>
      `;
    }

    function extraerTextoBinarioDoc(arrayBuffer, fileName) {
      try {
        const bytes = new Uint8Array(arrayBuffer);
        let ascii = [];
        let cur = '';
        for (let i = 0; i < bytes.length; i++) {
          const b = bytes[i];
          if ((b >= 32 && b <= 126) || (b >= 192 && b <= 255) || b === 10 || b === 13) {
            cur += String.fromCharCode(b);
          } else {
            if (cur.trim().length >= 5) ascii.push(cur.trim());
            cur = '';
          }
        }
        if (cur.trim().length >= 5) ascii.push(cur.trim());
        let utf16 = '';
        try {
          utf16 = new TextDecoder('utf-16le', { fatal: false }).decode(bytes).replace(/[^\x20-\x7E\xA0-\xFF\n\r]/g, ' ').replace(/\s+/g, ' ');
        } catch (e) {}
        return (ascii.join('\n') + '\n' + utf16).trim();
      } catch (e) {
        return fileName;
      }
    }

    async function recuperarBlobReal(pieza) {
      if (pieza.blob) return pieza.blob;
      if (window.localforage && pieza.storeKey) {
        const b = await localforage.getItem(pieza.storeKey);
        if (b) return b;
      }
      const token = localStorage.getItem('drive_token');
      if (pieza.driveFileId && token && !token.startsWith('oauth_session_')) {
        try {
          const res = await fetch(`https://www.googleapis.com/drive/v3/files/${pieza.driveFileId}?alt=media`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) return await res.blob();
        } catch (e) {}
      }
      return null;
    }

    async function construirFojasDesdeArchivosReales(exp) {
      fojasEnMemoria = [];

      let listaPiezas = [];
      if (Array.isArray(exp.piezasEmpaquetadas) && exp.piezasEmpaquetadas.length > 0) {
        listaPiezas = exp.piezasEmpaquetadas;
      } else if (exp.docs) {
        listaPiezas = Object.entries(exp.docs).map(([slotKey, item]) => ({
          slotKey,
          ...item,
          fojaOrden: Number(item.fojaOrden) || 50
        })).sort((a, b) => a.fojaOrden - b.fojaOrden);
      }

      let numFojaActual = 1;

      for (let i = 0; i < listaPiezas.length; i++) {
        const pieza = listaPiezas[i];
        actualizarBarra(30 + Math.round(((i + 1) / Math.max(1, listaPiezas.length)) * 60), `Abriendo archivo original: ${pieza.fileName}`);

        const blob = await recuperarBlobReal(pieza);
        if (!blob && !pieza.htmlContent) continue;

        const ext = (pieza.fileName.split('.').pop() || '').toLowerCase();

        if (blob && ext === 'pdf' && window.pdfjsLib) {
          try {
            const ab = await blob.arrayBuffer();
            const pdfDoc = await pdfjsLib.getDocument({ data: ab }).promise;
            for (let p = 1; p <= pdfDoc.numPages; p++) {
              const page = await pdfDoc.getPage(p);
              const tc = await page.getTextContent();
              const texto = tc.items.map(it => it.str).join(' ');
              fojasEnMemoria.push({
                id: `foja_${numFojaActual}`,
                numeroFoja: numFojaActual++,
                fojaOrden: pieza.fojaOrden || 10,
                fileName: pieza.fileName,
                tipo: 'pdf',
                pdfDoc,
                pageNum: p,
                textoPlano: texto
              });
            }
            continue;
          } catch (e) {}
        }

        if (blob && ext === 'docx' && window.mammoth) {
          try {
            const ab = await blob.arrayBuffer();
            const [resHtml, resTxt] = await Promise.all([
              mammoth.convertToHtml({ arrayBuffer: ab.slice(0) }),
              mammoth.extractRawText({ arrayBuffer: ab.slice(0) })
            ]);
            fojasEnMemoria.push({
              id: `foja_${numFojaActual}`,
              numeroFoja: numFojaActual++,
              fojaOrden: pieza.fojaOrden || 4,
              fileName: pieza.fileName,
              tipo: 'html',
              htmlOriginal: resHtml.value,
              textoPlano: resTxt.value || ''
            });
            continue;
          } catch (e) {}
        }

        if (blob && ext === 'doc') {
          const ab = await blob.arrayBuffer();
          const textoDoc = extraerTextoBinarioDoc(ab, pieza.fileName);
          fojasEnMemoria.push({
            id: `foja_${numFojaActual}`,
            numeroFoja: numFojaActual++,
            fojaOrden: pieza.fojaOrden || 4,
            fileName: pieza.fileName,
            tipo: 'html',
            htmlOriginal: `<div style="white-space:pre-wrap; font-family:Arial,sans-serif;">${textoDoc.replace(/</g, '&lt;')}</div>`,
            textoPlano: textoDoc
          });
          continue;
        }

        if (pieza.htmlContent) {
          const tmp = document.createElement('div');
          tmp.innerHTML = pieza.htmlContent;
          fojasEnMemoria.push({
            id: `foja_${numFojaActual}`,
            numeroFoja: numFojaActual++,
            fojaOrden: pieza.fojaOrden || 10,
            fileName: pieza.fileName,
            tipo: 'html',
            htmlOriginal: pieza.htmlContent,
            textoPlano: tmp.innerText || tmp.textContent || ''
          });
        }
      }

      if (fojasEnMemoria.length === 0) {
        document.getElementById('lista-fojas-container').innerHTML = '';
        mostrarMensajeSubirArchivos();
        return;
      }

      indiceFojaActiva = 0;
      await renderizarMiniaturasFojas();
      await renderizarVisorCentral();
    }

    async function renderizarMiniaturasFojas() {
      const cont = document.getElementById('lista-fojas-container');
      cont.innerHTML = '';

      fojasEnMemoria.forEach((f, idx) => { f.numeroFoja = idx + 1; });

      for (let i = 0; i < fojasEnMemoria.length; i++) {
        const f = fojasEnMemoria[i];
        const card = document.createElement('div');
        card.className = `foja-item ${i === indiceFojaActiva ? 'activa' : ''}`;
        card.onclick = () => seleccionarFoja(i);

        card.innerHTML = `
          <div class="foja-item-title">FOJA ${f.numeroFoja}</div>
          <div class="foja-thumb-box" id="thumb-box-${i}"></div>
          <div style="font-size:0.65rem; color:#94a3b8; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${f.fileName}">${f.fileName}</div>
          <div class="foja-controls-row" onclick="event.stopPropagation();">
            <button onclick="moverFoja(${i}, -1)" class="foja-ctrl-btn" title="Subir"><i class="fa-solid fa-arrow-up"></i></button>
            <button onclick="moverFoja(${i}, 1)" class="foja-ctrl-btn" title="Bajar"><i class="fa-solid fa-arrow-down"></i></button>
            <button onclick="eliminarFojaEnMemoria(${i})" class="foja-ctrl-btn" style="color:#fda4af;" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        cont.appendChild(card);

        const thumbBox = document.getElementById(`thumb-box-${i}`);
        if (f.tipo === 'pdf' && f.pdfDoc) {
          const canvasThumb = document.createElement('canvas');
          thumbBox.appendChild(canvasThumb);
          try {
            const page = await f.pdfDoc.getPage(f.pageNum);
            const vp = page.getViewport({ scale: 0.3 });
            canvasThumb.width = vp.width;
            canvasThumb.height = vp.height;
            await page.render({ canvasContext: canvasThumb.getContext('2d'), viewport: vp }).promise;
          } catch (e) {}
        } else {
          const previewDiv = document.createElement('div');
          previewDiv.className = 'foja-thumb-word-preview';
          previewDiv.innerHTML = f.htmlOriginal || '';
          thumbBox.appendChild(previewDiv);
        }
      }
    }

    async function seleccionarFoja(idx) {
      if (idx < 0 || idx >= fojasEnMemoria.length) return;
      indiceFojaActiva = idx;
      document.querySelectorAll('.foja-item').forEach((el, i) => {
        el.classList.toggle('activa', i === indiceFojaActiva);
      });
      await renderizarVisorCentral();
    }

    async function renderizarVisorCentral() {
      const f = fojasEnMemoria[indiceFojaActiva];
      if (!f) {
        mostrarMensajeSubirArchivos();
        return;
      }

      const canvas = document.getElementById('canvas-principal');
      const htmlVisor = document.getElementById('html-visor');
      const contUnico = document.getElementById('contenedor-foja-unica');
      contUnico.style.transform = `scale(${nivelZoom})`;

      if (f.tipo === 'pdf' && f.pdfDoc) {
        htmlVisor.style.display = 'none';
        canvas.style.display = 'block';
        const page = await f.pdfDoc.getPage(f.pageNum);
        const vp = page.getViewport({ scale: 1.45 });
        canvas.width = vp.width;
        canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      } else {
        canvas.style.display = 'none';
        htmlVisor.style.display = 'block';
        htmlVisor.innerHTML = f.htmlOriginal || '';
      }
    }

    function cambiarZoom(delta, reset = false) {
      if (reset) nivelZoom = 1.0;
      else nivelZoom = Math.min(2.2, Math.max(0.55, Number((nivelZoom + delta).toFixed(2))));
      document.getElementById('contenedor-foja-unica').style.transform = `scale(${nivelZoom})`;
    }

    async function moverFoja(idx, delta) {
      const dest = idx + delta;
      if (dest < 0 || dest >= fojasEnMemoria.length) return;
      const tmp = fojasEnMemoria[idx];
      fojasEnMemoria[idx] = fojasEnMemoria[dest];
      fojasEnMemoria[dest] = tmp;
      indiceFojaActiva = dest;
      await renderizarMiniaturasFojas();
      await renderizarVisorCentral();
    }

    async function ordenarFojasPorPrelacion() {
      fojasEnMemoria.sort((a, b) => (a.fojaOrden || 10) - (b.fojaOrden || 10));
      indiceFojaActiva = 0;
      await renderizarMiniaturasFojas();
      await renderizarVisorCentral();
    }

    async function eliminarFojaEnMemoria(idx) {
      if (!confirm(`¿Quitar Foja ${idx + 1} del visor?`)) return;
      fojasEnMemoria.splice(idx, 1);
      if (indiceFojaActiva >= fojasEnMemoria.length) indiceFojaActiva = Math.max(0, fojasEnMemoria.length - 1);
      await renderizarMiniaturasFojas();
      await renderizarVisorCentral();
    }

    async function cargarDocumentoManual(fileList) {
      if (!fileList || fileList.length === 0) return;
      mostrarProgreso('Integrando archivo original tal cual fue subido...', 35);

      if (!expedienteActual) {
        expedienteActual = {
          id: 'exp-' + Date.now(),
          numExpediente: 'S/N',
          solicitante: 'EXPEDIENTE ACTIVO',
          centro: 'Centro 065',
          categoria: 'Preventivo Arrendamiento',
          docs: {}
        };
      }

      for (const file of Array.from(fileList)) {
        const fnUpper = file.name.toUpperCase();
        let slotId = 'anexo_' + Date.now();
        let fojaOrden = 12;

        if (fnUpper.includes('SOLICITUD')) { slotId = 'solicitud'; fojaOrden = 1; }
        else if (fnUpper.includes('DICTAMEN')) { slotId = 'dictamen'; fojaOrden = 2; }
        else if (fnUpper.includes('ACUERDO')) { slotId = 'acuerdo'; fojaOrden = 3; }
        else if (fnUpper.includes('DIGITAL')) { slotId = 'convenio_digital'; fojaOrden = 5; }
        else if (fnUpper.includes('CONVENIO')) { slotId = 'convenio_final'; fojaOrden = 4; }
        else if (fnUpper.includes('INE') || fnUpper.includes('IDENTIFICACION')) { slotId = 'identificaciones'; fojaOrden = 6; }
        else if (fnUpper.includes('CONTRATO')) { slotId = 'contrato_arrendamiento'; fojaOrden = 7; }
        else if (fnUpper.includes('ESCRITURA')) { slotId = 'escritura_publica'; fojaOrden = 9; }
        else if (fnUpper.includes('PREDIAL')) { slotId = 'predial'; fojaOrden = 10; }

        const storeKey = `bin_${(expedienteActual.centro || 'C065').replace(/\W/g, '_')}_${expedienteActual.numExpediente.replace(/\W/g, '_')}_${slotId}`;
        if (window.localforage) await localforage.setItem(storeKey, file);

        if (!expedienteActual.docs) expedienteActual.docs = {};
        expedienteActual.docs[slotId] = {
          fileName: file.name,
          pages: 1,
          date: new Date().toISOString().split('T')[0],
          fojaOrden,
          storeKey,
          realUploaded: true
        };
      }

      localStorage.setItem('visor_active_expediente', JSON.stringify(expedienteActual));
      if (window.localforage) await localforage.setItem('visor_active_expediente_full', expedienteActual);

      ['despacho45', 'aldo_indep'].forEach(ent => {
        ['bd_masc', 'bd_juzgados'].forEach(t => {
          const k = `boveda_pro_${ent}_${t}`;
          const raw = localStorage.getItem(k);
          if (!raw) return;
          try {
            const arr = JSON.parse(raw);
            const i = arr.findIndex(e => e.id === expedienteActual.id);
            if (i !== -1) { arr[i] = expedienteActual; localStorage.setItem(k, JSON.stringify(arr)); }
          } catch (e) {}
        });
      });

      delete expedienteActual.piezasEmpaquetadas;
      await construirFojasDesdeArchivosReales(expedienteActual);
      ocultarProgreso();
    }

    function escanearAlertasInfalible() {
      const cont = document.getElementById('contenedor-alertas-resultados');
      const hallazgos = [];
      const patrones = [
        { titulo: 'Partes / Comparecientes', regex: /(?:celebraron las partes|comparecen|arrendador|arrendatario)[\s:.,]+([A-ZÁÉÍÓÚÑ\s,Y]{10,120})/gi },
        { titulo: 'Vigencia / Plazo', regex: /(?:vigencia|vencimiento|forzoso|plazo|fecha)[^.;\n]{4,90}/gi },
        { titulo: 'Monto / Renta / Pensión', regex: /(?:\$\s*[0-9,]+(?:\.[0-9]{2})?|renta\s+mensual|pensión)[^.;\n]{0,70}/gi },
        { titulo: 'Predial / Escritura / Inmueble', regex: /(?:predial|escritura|inmueble|finca)[^.;\n]{4,90}/gi }
      ];

      fojasEnMemoria.forEach((f, idx) => {
        const txt = f.textoPlano || '';
        patrones.forEach(p => {
          for (const m of txt.matchAll(p.regex)) {
            if (hallazgos.length < 30) {
              hallazgos.push({ titulo: p.titulo, foja: f.numeroFoja, idx, extracto: m[0].trim() });
            }
          }
        });
      });

      if (hallazgos.length === 0) {
        cont.innerHTML = `<div style="font-size:0.74rem; color:#64748b; text-align:center; padding:16px;">Sube un documento y pulsa "IA" para extraer cláusulas y alertas.</div>`;
        return;
      }

      cont.innerHTML = hallazgos.map(h => `
        <div onclick="seleccionarFoja(${h.idx})" class="keyword-card">
          <div class="keyword-word"><span>${h.titulo}</span><span>FOJA ${h.foja}</span></div>
          <div class="keyword-snippet">"${h.extracto}"</div>
        </div>
      `).join('');
    }

    function cambiarTabDerecha(tab) {
      const esPalabras = tab === 'palabras';
      document.getElementById('tab-palabras').classList.toggle('activa', esPalabras);
      document.getElementById('tab-notas').classList.toggle('activa', !esPalabras);
      document.getElementById('panel-palabras').style.display = esPalabras ? 'flex' : 'none';
      document.getElementById('panel-notas').style.display = esPalabras ? 'none' : 'flex';
    }

    function cargarNotasGuardadas() {
      const clave = `notas_visor_${expedienteActual ? expedienteActual.id : 'default'}`;
      const raw = localStorage.getItem(clave);
      notasDelExpediente = raw ? JSON.parse(raw) : [];
      renderizarIndiceNotas();
    }

    function guardarNotas() {
      const txt = (document.getElementById('texto-notas').value || '').trim();
      if (!txt) return;
      const fojaNum = fojasEnMemoria[indiceFojaActiva] ? fojasEnMemoria[indiceFojaActiva].numeroFoja : 1;
      notasDelExpediente.unshift({ id: Date.now(), foja: fojaNum, idx: indiceFojaActiva, texto: txt });
      const clave = `notas_visor_${expedienteActual ? expedienteActual.id : 'default'}`;
      localStorage.setItem(clave, JSON.stringify(notasDelExpediente));
      document.getElementById('texto-notas').value = '';
      renderizarIndiceNotas();
    }

    function renderizarIndiceNotas() {
      const cont = document.getElementById('indice-notas-container');
      cont.innerHTML = notasDelExpediente.map(n => `
        <div onclick="seleccionarFoja(${n.idx})" class="nota-guardada" style="cursor:pointer;">
          <strong style="color:#fbbf24; display:block; margin-bottom:3px;">Foja ${n.foja}</strong>
          <span>${n.texto}</span>
        </div>
      `).join('');
    }
  </script>
