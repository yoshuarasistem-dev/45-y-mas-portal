<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>45YMÁS Bóveda Inteligente | Visor de Expedientes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-dark: #070b14;
      --bg-sidebar: #0b1120;
      --bg-card: #111a2e;
      --accent-orange: #ea580c;
      --accent-amber: #f59e0b;
      --accent-blue: #38bdf8;
      --border-line: rgba(148, 163, 184, 0.18);
      --text-light: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050811; }
    ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.45); border-radius: 999px; }

    #pantalla-progreso {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(7, 11, 20, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .progreso-box {
      background: var(--bg-sidebar);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 20px;
      padding: 28px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }

    .barra-fondo {
      width: 100%;
      height: 10px;
      background: #050811;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    #barra-llena {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ea580c, #f59e0b, #38bdf8);
      transition: width 0.2s ease;
    }

    .topbar {
      height: 58px;
      background: #090e1a;
      border-bottom: 1px solid var(--border-line);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      shrink: 0;
    }

    .brand-block { display: flex; flex-direction: column; }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      color: var(--accent-amber);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-sub {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-top {
      background: #131c31;
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.22);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s;
      white-space: nowrap;
    }

    .btn-top:hover {
      border-color: var(--accent-amber);
      color: #ffffff;
    }

    .pill-exp {
      background: rgba(30, 58, 138, 0.45);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      max-width: 360px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-ia-orange {
      background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
      color: #ffffff;
      border: none;
      font-weight: 800;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 235px 1fr 330px;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar-fojas {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }

    .btn-dashed-orange {
      width: 100%;
      background: rgba(234, 88, 12, 0.08);
      border: 1px dashed rgba(245, 158, 11, 0.6);
      color: #fb923c;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.18s;
    }

    .btn-dashed-orange:hover { background: rgba(234, 88, 12, 0.18); }

    .btn-dashed-blue {
      width: 100%;
      background: rgba(56, 189, 248, 0.08);
      border: 1px dashed rgba(56, 189, 248, 0.55);
      color: #38bdf8;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #lista-fojas-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .foja-item {
      background: #0d1424;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .foja-item:hover { border-color: var(--accent-amber); }

    .foja-item.activa {
      border: 2px solid #38bdf8;
      background: rgba(14, 30, 56, 0.92);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .foja-item-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .foja-thumb-box {
      width: 100%;
      height: 118px;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .foja-thumb-box canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .foja-thumb-word-preview {
      width: 100%;
      height: 100%;
      padding: 6px;
      font-size: 5.5px;
      line-height: 1.3;
      color: #0f172a;
      overflow: hidden;
      text-align: left;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    .foja-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding-top: 2px;
    }

    .foja-ctrl-btn {
      background: #17223b;
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      width: 26px;
      height: 24px;
      font-size: 0.68rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .foja-ctrl-btn:hover { background: #253559; color: #ffffff; }

    .visor-central {
      background: #050811;
      position: relative;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    .foja-canvas-container {
      background: #ffffff;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      border-radius: 6px;
      transition: transform 0.18s ease;
      transform-origin: top center;
      position: relative;
    }

    #canvas-principal {
      display: block;
      max-width: 100%;
      height: auto;
    }

    #canvas-dibujo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      pointer-events: none;
    }

    #canvas-dibujo.activo {
      pointer-events: auto;
      cursor: crosshair;
    }

    #html-visor {
      width: 840px;
      max-width: 94vw;
      min-height: 1060px;
      background: #ffffff;
      color: #000000;
      padding: 52px 64px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11.5pt;
      line-height: 1.65;
    }

    #html-visor * { color: #000000; }
    #html-visor p { margin-bottom: 12px; text-align: justify; }
    #html-visor table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    #html-visor td, #html-visor th { border: 1px solid #000000; padding: 6px 10px; }

    mark.resaltado-ia {
      background-color: #fde047 !important;
      color: #000000 !important;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
    }

    #controles-zoom {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 45;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.75);
    }

    .zoom-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.25);
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .zoom-btn:hover { background: #334155; border-color: var(--accent-amber); }
    .zoom-btn.activo { background: rgba(245, 158, 11, 0.25); border-color: #f59e0b; color: #fde68a; }

    .sidebar-herramientas {
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .tabs-right {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border-line);
    }

    .tab-right-btn {
      background: transparent;
      color: var(--text-dim);
      border: none;
      border-bottom: 2px solid transparent;
      padding: 13px 10px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }

    .tab-right-btn.activa {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .keyword-card {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.18s;
    }

    .keyword-card:hover { border-color: var(--accent-amber); }

    .keyword-word {
      font-size: 0.72rem;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .keyword-snippet {
      font-size: 0.74rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .nota-area {
      width: 100%;
      min-height: 100px;
      background: #060a14;
      border: 1px solid var(--border-line);
      border-radius: 10px;
      padding: 10px;
      color: #ffffff;
      font-size: 0.76rem;
      resize: vertical;
      outline: none;
    }

    .nota-guardada {
      background: var(--bg-card);
      border-left: 3px solid var(--accent-amber);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.74rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    @media print {
      .topbar, .sidebar-fojas, .sidebar-herramientas, #controles-zoom { display: none !important; }
      body, .workspace, .visor-central { height: auto !important; overflow: visible !important; background: #ffffff !important; display: block !important; padding: 0 !important; }
      .foja-canvas-container, #html-visor { box-shadow: none !important; width: 100% !important; max-width: none !important; margin: 0 !important; }
    }

    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 185px 1fr; }
      .sidebar-herramientas { display: none; }
      #html-visor { padding: 24px 18px; }
    }
  </style>
</head>
<body>

  <div id="pantalla-progreso">
    <div class="progreso-box">
      <i class="fa-solid fa-scale-balanced fa-bounce" style="font-size:2.2rem; color:#f59e0b; margin-bottom:12px;"></i>
      <div id="texto-progreso" style="font-size:0.9rem; font-weight:800;">Abriendo documentos originales del expediente...</div>
      <div class="barra-fondo">
        <div id="barra-llena"></div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand-block">
      <div class="brand-title"><i class="fa-solid fa-scale-balanced"></i> 45YMÁS</div>
      <div class="brand-sub">BÓVEDA INTELIGENTE</div>
    </div>

    <div class="topbar-right">
      <a href="index.html" class="btn-top"><i class="fa-solid fa-house"></i> Inicio</a>
      <a href="portal-pro.html" class="btn-top"><i class="fa-solid fa-folder-tree"></i> Bóveda</a>
      <div id="titulo-exp" class="pill-exp">Cargando expediente...</div>
      <label class="btn-top" style="cursor:pointer;">
        <i class="fa-solid fa-file-arrow-up text-sky-400"></i> Cargar
        <input type="file" id="pdf-upload" multiple accept=".pdf,.doc,.docx" style="display:none;" onchange="cargarDocumentoManual(this.files)" />
      </label>
      <button onclick="descargarArchivoOriginalFojaActiva()" class="btn-top" title="Descargar el archivo original de esta foja">
        <i class="fa-solid fa-download text-emerald-400"></i> Original
      </button>
      <button id="btn-analizar" onclick="escanearAlertasInfalible()" class="btn-top btn-ia-orange">
        <i class="fa-solid fa-brain"></i> IA
      </button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar-fojas">
      <label class="btn-dashed-orange">
        <i class="fa-solid fa-plus"></i> Insertar Foja
        <input type="file" multiple accept=".pdf,.doc,.docx" style="display:none;" onchange="cargarDocumentoManual(this.files)" />
      </label>
      <button onclick="ordenarFojasPorPrelacion()" class="btn-dashed-blue">
        <i class="fa-solid fa-arrow-down-1-9"></i> Ordenar
      </button>
      <div id="lista-fojas-container"></div>
    </aside>

    <main id="visor-central-scroll" class="visor-central">
      <div id="contenedor-foja-unica" class="foja-canvas-container">
        <canvas id="canvas-principal" style="display:none;"></canvas>
        <canvas id="canvas-dibujo"></canvas>
        <div id="html-visor" style="display:none;"></div>
      </div>

      <div id="controles-zoom">
        <button onclick="navegarFojaDelta(-1)" class="zoom-btn" title="Foja Anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="label-foja-floating" style="font-size:0.75rem; font-weight:800; padding:0 6px; font-family:'JetBrains Mono',monospace; color:#fde68a;">1/1</span>
        <button onclick="navegarFojaDelta(1)" class="zoom-btn" title="Siguiente Foja"><i class="fa-solid fa-chevron-right"></i></button>
        <button onclick="cambiarZoom(0.15)" class="zoom-btn" title="Acercar"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button onclick="cambiarZoom(-0.15)" class="zoom-btn" title="Alejar"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button onclick="cambiarZoom(0, true)" class="zoom-btn" title="100%">1:1</button>
        <button id="btn-draw-hl" onclick="toggleHerramientaTrazo('hl')" class="zoom-btn" title="Marca-textos amarillo"><i class="fa-solid fa-highlighter" style="color:#facc15;"></i></button>
        <button id="btn-draw-pen" onclick="toggleHerramientaTrazo('pen')" class="zoom-btn" title="Pluma roja"><i class="fa-solid fa-pen" style="color:#f43f5e;"></i></button>
        <button onclick="limpiarTrazoActual()" class="zoom-btn" title="Borrar trazos"><i class="fa-solid fa-eraser"></i></button>
        <button onclick="window.print()" class="zoom-btn" title="Imprimir"><i class="fa-solid fa-print"></i></button>
      </div>
    </main>

    <aside class="sidebar-herramientas">
      <div class="tabs-right">
        <button id="tab-palabras" onclick="cambiarTabDerecha('palabras')" class="tab-right-btn activa">Alertas IA</button>
        <button id="tab-notas" onclick="cambiarTabDerecha('notas')" class="tab-right-btn"><i class="fa-regular fa-pen-to-square"></i> Apuntes</button>
      </div>

      <div id="panel-palabras" class="panel-content">
        <div style="display:flex; gap:6px;">
          <input type="text" id="input-buscar-texto" oninput="filtrarTextoEnFoja(this.value)" placeholder="Buscar palabra en el documento..." style="width:100%; background:#060a14; border:1px solid var(--border-line); color:#fff; border-radius:8px; padding:7px 10px; font-size:0.74rem; outline:none;" />
        </div>
        <p style="font-size:0.72rem; color:#94a3b8; line-height:1.45;">
          La IA analiza las cláusulas, partes, montos y vigencia sobre los documentos originales subidos.
        </p>
        <div id="contenedor-alertas-resultados" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>

      <div id="panel-notas" class="panel-content" style="display:none;">
        <textarea id="texto-notas" class="nota-area" placeholder="Escribe un apunte jurídico para la foja actual..."></textarea>
        <button onclick="guardarNotas()" class="btn-top btn-ia-orange" style="justify-content:center; width:100%;">
          <i class="fa-solid fa-floppy-disk"></i> Guardar Apunte en Foja
        </button>
        <div id="indice-notas-container" style="display:flex; flex-direction:column; gap:8px; margin-top:6px;"></div>
      </div>
    </aside>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let expedienteActual = null;
    let fojasEnMemoria = [];
    let indiceFojaActiva = 0;
    let nivelZoom = 1.0;
    let notasDelExpediente = [];
    let modoTrazo = null;
    let trazando = false;
    let mapaTrazos = {};
    let palabraResaltada = '';

    function mostrarProgreso(texto, pct = 20) {
      document.getElementById('pantalla-progreso').style.display = 'flex';
      document.getElementById('texto-progreso').textContent = texto;
      document.getElementById('barra-llena').style.width = `${pct}%`;
    }

    function actualizarBarra(pct, texto = '') {
      document.getElementById('barra-llena').style.width = `${pct}%`;
      if (texto) document.getElementById('texto-progreso').textContent = texto;
    }

    function ocultarProgreso() {
      setTimeout(() => {
        document.getElementById('pantalla-progreso').style.display = 'none';
      }, 180);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      configurarEventosDibujo();
      await inicializarVisorConExpedienteReal();
    });

    function base64ToUint8Array(base64Str) {
      try {
        const clean = base64Str.includes(',') ? base64Str.split(',')[1] : base64Str;
        const binStr = atob(clean);
        const len = binStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = binStr.charCodeAt(i);
        return bytes;
      } catch (e) {
        return null;
      }
    }

    function decodificarDocBinarioWord97(arrayBuffer, fileName) {
      try {
        const bytes = new Uint8Array(arrayBuffer);
        let bloquesUnicode = [];
        let actualU = '';
        let cerosSeguidos = 0;

        for (let i = 0; i < bytes.length - 1; i += 2) {
          const low = bytes[i];
          const high = bytes[i + 1];
          if (high === 0 && ((low >= 32 && low <= 126) || (low >= 160 && low <= 255) || low === 10 || low === 13 || low === 9)) {
            const ch = (low === 13 || low === 10) ? '\n' : String.fromCharCode(low);
            actualU += ch;
          } else {
            if (actualU.trim().length >= 18) {
              bloquesUnicode.push(actualU.trim());
            }
            actualU = '';
          }
        }
        if (actualU.trim().length >= 18) bloquesUnicode.push(actualU.trim());

        let bloquesAnsi = [];
        let actualA = '';
        for (let i = 0; i < bytes.length; i++) {
          const b = bytes[i];
          if ((b >= 32 && b <= 126) || (b >= 160 && b <= 255) || b === 10 || b === 13 || b === 9) {
            actualA += (b === 13 || b === 10) ? '\n' : String.fromCharCode(b);
          } else {
            const limpio = actualA.trim();
            if (limpio.length >= 24 && /[AEIOUÁÉÍÓÚaeiouáéíóú]{2,}/.test(limpio) && !/^(Root Entry|WordDocument|CompObj|SummaryInformation|Microsoft Word|Normal\.dot|Times New Roman|Arial|Calibri)/i.test(limpio)) {
              bloquesAnsi.push(limpio);
            }
            actualA = '';
          }
        }
        if (actualA.trim().length >= 24) bloquesAnsi.push(actualA.trim());

        const mejorTexto = (bloquesUnicode.join('\n\n').length > bloquesAnsi.join('\n\n').length)
          ? bloquesUnicode.join('\n\n')
          : bloquesAnsi.join('\n\n');

        const filtrado = mejorTexto
          .split(/\n+/)
          .map(linea => linea.trim())
          .filter(linea => linea.length >= 3 && !/^(PAGE|MERGEFORMAT|HYPERLINK|TOC|PAGEREF|Normal|Default Paragraph Font|bjbj)/i.test(linea))
          .join('\n\n');

        if (filtrado.length > 40) {
          const parrafosHtml = filtrado
            .split(/\n{2,}/)
            .map(p => `<p>${p.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br/>')}</p>`)
            .join('');
          return { html: parrafosHtml, texto: filtrado };
        }
      } catch (e) {}
      return { html: `<p>Documento: <strong>${fileName}</strong></p>`, texto: fileName };
    }

    async function inicializarVisorConExpedienteReal() {

      const paramId = params.get('id');
      const paramExp = params.get('exp');

              } else {

    async function recuperarArrayBufferDePieza(pieza, exp) {
      if (pieza.arrayBuffer && pieza.arrayBuffer.byteLength > 0) return pieza.arrayBuffer;
      if (pieza.blob && pieza.blob.size > 0) return await pieza.blob.arrayBuffer();
      if (pieza.base64Data) {
        const bytes = base64ToUint8Array(pieza.base64Data);
        if (bytes && bytes.byteLength > 0) return bytes.buffer;
      }

      if (window.localforage) {
        if (pieza.storeKey) {
          const guardado = await localforage.getItem(pieza.storeKey);
          if (guardado) {
            if (guardado instanceof ArrayBuffer) return guardado;
            if (ArrayBuffer.isView(guardado)) return guardado.buffer;
            if (guardado instanceof Blob) return await guardado.arrayBuffer();
            if (typeof guardado === 'string') {
              const b = base64ToUint8Array(guardado);
              if (b) return b.buffer;
            }
            if (guardado.arrayBuffer && guardado.arrayBuffer instanceof ArrayBuffer) return guardado.arrayBuffer;
            if (guardado.base64Data) {
              const b = base64ToUint8Array(guardado.base64Data);
              if (b) return b.buffer;
            }
          }
        }

        const numLimpio = (exp.numExpediente || '').replace(/\W/g, '_');
        const todasLasLlaves = await localforage.keys();
        const llaveCoincidente = todasLasLlaves.find(k =>
          (pieza.storeKey && k.startsWith(pieza.storeKey)) ||
          (numLimpio && k.includes(numLimpio) && (!pieza.slotKey || k.includes(pieza.slotKey)))
        );

        if (llaveCoincidente) {
          const item = await localforage.getItem(llaveCoincidente);
          if (item) {
            if (item instanceof ArrayBuffer) return item;
            if (ArrayBuffer.isView(item)) return item.buffer;
            if (item instanceof Blob) return await item.arrayBuffer();
            if (typeof item === 'string') {
              const b = base64ToUint8Array(item);
              if (b) return b.buffer;
            }
            if (item.base64Data) {
              const b = base64ToUint8Array(item.base64Data);
              if (b) return b.buffer;
            }
          }
        }
      }

      const token = localStorage.getItem('drive_token');
      if (token && !token.startsWith('oauth_session_') && !token.startsWith('token_activo_')) {
        try {
          let targetDriveId = pieza.driveFileId;
          if (!targetDriveId && pieza.fileName) {
            const q = encodeURIComponent(`name contains '${pieza.fileName.replace(/'/g, '')}' and trashed = false`);
            const resSearch = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=3`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (resSearch.ok) {
              const dataS = await resSearch.json();
              if (dataS.files && dataS.files.length > 0) targetDriveId = dataS.files[0].id;
            }
          }

          if (targetDriveId) {
            const res = await fetch(`https://www.googleapis.com/drive/v3/files/${targetDriveId}?alt=media`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (res.ok) {
              const ab = await res.arrayBuffer();
              if (window.localforage && pieza.storeKey) await localforage.setItem(pieza.storeKey, ab);
              return ab;
            }
          }
        } catch (e) {}
      }

      return null;
    }

    async function construirFojasDesdeArchivosReales(exp) {
      fojasEnMemoria = [];

      const mapaPiezas = new Map();
      if (Array.isArray(exp.piezasEmpaquetadas)) {
        exp.piezasEmpaquetadas.forEach(p => {
          if (p && p.fileName) mapaPiezas.set(p.slotKey || p.fileName, p);
        });
      }
      if (exp.docs) {
        Object.entries(exp.docs).forEach(([slotKey, item]) => {
          if (item && item.fileName) {
            const prev = mapaPiezas.get(slotKey) || {};
            mapaPiezas.set(slotKey, { ...prev, ...item, slotKey, fojaOrden: Number(item.fojaOrden) || 50 });
          }
        });
      }

      const listaPiezas = Array.from(mapaPiezas.values()).sort((a, b) => (Number(a.fojaOrden) || 50) - (Number(b.fojaOrden) || 50));
      let numFojaActual = 1;

      for (let i = 0; i < listaPiezas.length; i++) {
        const pieza = listaPiezas[i];
        actualizarBarra(30 + Math.round(((i + 1) / Math.max(1, listaPiezas.length)) * 60), `Abriendo archivo original: ${pieza.fileName}`);

        const ab = await recuperarArrayBufferDePieza(pieza, exp);
        const ext = (pieza.fileName.split('.').pop() || '').toLowerCase();

        if (ab && ext === 'pdf' && window.pdfjsLib) {
          try {
            const pdfDoc = await pdfjsLib.getDocument({ data: ab.slice(0) }).promise;
            for (let p = 1; p <= pdfDoc.numPages; p++) {
              const page = await pdfDoc.getPage(p);
              const tc = await page.getTextContent();
              const texto = tc.items.map(it => it.str).join(' ');
              fojasEnMemoria.push({
                id: `foja_${exp.id}_${pieza.slotKey || i}_p${p}`,
                numeroFoja: numFojaActual++,
                fojaOrden: pieza.fojaOrden || 10,
                fileName: pieza.fileName,
                tipo: 'pdf',
                pdfDoc,
                pageNum: p,
                arrayBufferOriginal: ab,
                textoPlano: texto
              });
            }
            continue;
          } catch (e) {}
        }

        if (ab && ext === 'docx' && window.mammoth) {
          try {
            const [resHtml, resTxt] = await Promise.all([
              mammoth.convertToHtml({ arrayBuffer: ab.slice(0) }),
              mammoth.extractRawText({ arrayBuffer: ab.slice(0) })
            ]);
            if (resHtml && resHtml.value && resHtml.value.trim().length > 0) {
              fojasEnMemoria.push({
                id: `foja_${exp.id}_${pieza.slotKey || i}_docx`,
                numeroFoja: numFojaActual++,
                fojaOrden: pieza.fojaOrden || 4,
                fileName: pieza.fileName,
                tipo: 'html',
                htmlOriginal: resHtml.value,
                arrayBufferOriginal: ab,
                textoPlano: resTxt.value || ''
              });
              continue;
            }
          } catch (e) {}
        }

        if (ab && (ext === 'doc' || ext === 'docx')) {
          const { html, texto } = decodificarDocBinarioWord97(ab, pieza.fileName);
          fojasEnMemoria.push({
            id: `foja_${exp.id}_${pieza.slotKey || i}_doc`,
            numeroFoja: numFojaActual++,
            fojaOrden: pieza.fojaOrden || 4,
            fileName: pieza.fileName,
            tipo: 'html',
            htmlOriginal: html,
            arrayBufferOriginal: ab,
            textoPlano: texto
          });
          continue;
        }

        if (pieza.htmlContent && pieza.htmlContent.trim().length > 10) {
          const tmp = document.createElement('div');
          tmp.innerHTML = pieza.htmlContent;
          fojasEnMemoria.push({
            id: `foja_${exp.id}_${pieza.slotKey || i}_html`,
            numeroFoja: numFojaActual++,
            fojaOrden: pieza.fojaOrden || 10,
            fileName: pieza.fileName,
            tipo: 'html',
            htmlOriginal: pieza.htmlContent,
            textoPlano: tmp.innerText || tmp.textContent || ''
          });
        }
      }

      if (fojasEnMemoria.length === 0) {
        document.getElementById('lista-fojas-container').innerHTML = '';
        mostrarMensajeSubirArchivos();
        return;
      }

      indiceFojaActiva = 0;
      await renderizarMiniaturasFojas();
      await renderizarVisorCentral();
    }

        setTimeout(() => {

          canvasDib.height = htmlVisor.offsetHeight || 1060;
          restaurarTrazoFojaActual();
        }, 40);
      }
    }

    function configurarEventosDibujo() {
      const canvas = document.getElementById('canvas-dibujo');
      const ctx = canvas.getContext('2d');

      const pos = (e) => {
        const r = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) };
      };

      const start = (e) => {
        if (!modoTrazo) return;
        trazando = true;
        const p = pos(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      };

      const move = (e) => {
        if (!trazando || !modoTrazo) return;
        e.preventDefault();
        const p = pos(e);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (modoTrazo === 'hl') {
          ctx.strokeStyle = 'rgba(250, 204, 21, 0.35)';
          ctx.lineWidth = 20;
        } else {
          ctx.strokeStyle = 'rgba(244, 63, 94, 0.9)';
          ctx.lineWidth = 3;
        }
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      };

      const end = () => {
        if (!trazando) return;
        trazando = false;
        ctx.closePath();
        guardarTrazoFojaActual();
      };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('touchend', end);
    }

    function toggleHerramientaTrazo(tipo) {

      document.getElementById('btn-draw-hl').classList.toggle('activo', modoTrazo === 'hl');
      document.getElementById('btn-draw-pen').classList.toggle('activo', modoTrazo === 'pen');
      document.getElementById('canvas-dibujo').classList.toggle('activo', !!modoTrazo);
    }

    function guardarTrazoFojaActual() {
      const f = fojasEnMemoria[indiceFojaActiva];
      if (!f) return;
      const c = document.getElementById('canvas-dibujo');
      if (c.width > 0 && c.height > 0) mapaTrazos[f.id] = c.toDataURL('image/png');
    }

    function restaurarTrazoFojaActual() {
      const f = fojasEnMemoria[indiceFojaActiva];
      const c = document.getElementById('canvas-dibujo');
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);

        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = mapaTrazos[f.id];

      const f = fojasEnMemoria[indiceFojaActiva];

    function descargarArchivoOriginalFojaActiva() {
      const f = fojasEnMemoria[indiceFojaActiva];
      if (!f) return;
      if (f.arrayBufferOriginal) {
        const blob = new Blob([f.arrayBufferOriginal]);

        URL.revokeObjectURL(url);

        window.print();
      }
    }

    function cambiarZoom(delta, reset = false) {
      if (reset) nivelZoom = 1.0;
      else nivelZoom = Math.min(2.2, Math.max(0.55, Number((nivelZoom + delta).toFixed(2))));

    async function moverFoja(idx, delta) {
      const dest = idx + delta;
      if (dest < 0 || dest >= fojasEnMemoria.length) return;
      const tmp = fojasEnMemoria[idx];
      fojasEnMemoria[idx] = fojasEnMemoria[dest];
      fojasEnMemoria[dest] = tmp;
      indiceFojaActiva = dest;
      await renderizarMiniaturasFojas();
      await renderizarVisorCentral();
    }

    async function ordenarFojasPorPrelacion() {
      fojasEnMemoria.sort((a, b) => (a.fojaOrden || 10) - (b.fojaOrden || 10));
      indiceFojaActiva = 0;
      await renderizarMiniaturasFojas();
      await renderizarVisorCentral();
    }

    async function eliminarFojaEnMemoria(idx) {
      if (!confirm(`¿Quitar Foja ${idx + 1} del visor?`)) return;
      fojasEnMemoria.splice(idx, 1);
      if (indiceFojaActiva >= fojasEnMemoria.length) indiceFojaActiva = Math.max(0, fojasEnMemoria.length - 1);
      await renderizarMiniaturasFojas();
      await renderizarVisorCentral();
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    async function cargarDocumentoManual(fileList) {
      if (!fileList || fileList.length === 0) return;
      mostrarProgreso('Guardando e integrando archivo original...', 35);

      if (!expedienteActual) {
        expedienteActual = {
          id: 'exp-' + Date.now(),
          numExpediente: 'S/N',
          solicitante: 'EXPEDIENTE ACTIVO',
          centro: 'Centro 065',
          categoria: 'Preventivo Arrendamiento',
          docs: {}
        };
      }

      for (const file of Array.from(fileList)) {
        const ab = await file.arrayBuffer();
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        const fnUpper = file.name.toUpperCase();
        let slotId = 'convenio_final';
        let fojaOrden = 4;

        if (fnUpper.includes('SOLICITUD')) { slotId = 'solicitud'; fojaOrden = 1; }
        else if (fnUpper.includes('DICTAMEN')) { slotId = 'dictamen'; fojaOrden = 2; }
        else if (fnUpper.includes('ACUERDO')) { slotId = 'acuerdo'; fojaOrden = 3; }
        else if (fnUpper.includes('DIGITAL')) { slotId = 'convenio_digital'; fojaOrden = 5; }
        else if (fnUpper.includes('CONVENIO')) { slotId = 'convenio_final'; fojaOrden = 4; }
        else if (fnUpper.includes('INE') || fnUpper.includes('IDENTIFICACION')) { slotId = 'identificaciones'; fojaOrden = 6; }
        else if (fnUpper.includes('CONTRATO')) { slotId = 'contrato_arrendamiento'; fojaOrden = 7; }
        else if (fnUpper.includes('ESCRITURA')) { slotId = 'escritura_publica'; fojaOrden = 9; }
        else if (fnUpper.includes('PREDIAL')) { slotId = 'predial'; fojaOrden = 10; }
        else { slotId = 'anexo_' + Date.now(); fojaOrden = 12; }

        let htmlExtraido = '';
        if (ext === 'docx' && window.mammoth) {
          try {
            const resH = await mammoth.convertToHtml({ arrayBuffer: ab.slice(0) });
            htmlExtraido = resH.value || '';
          } catch (e) {}
        } else if (ext === 'doc') {
          htmlExtraido = decodificarDocBinarioWord97(ab, file.name).html;
        }

        const storeKey = `bin_${(expedienteActual.centro || 'C065').replace(/\W/g, '_')}_${expedienteActual.numExpediente.replace(/\W/g, '_')}_${slotId}`;
        if (window.localforage) {
          await localforage.setItem(storeKey, ab);
        }

        const base64Small = ab.byteLength <= 1500000 ? arrayBufferToBase64(ab) : '';

        if (!expedienteActual.docs) expedienteActual.docs = {};
        expedienteActual.docs[slotId] = {
          fileName: file.name,
          pages: 1,
          date: new Date().toISOString().split('T')[0],
          fojaOrden,
          storeKey,
          realUploaded: true,
          htmlContent: htmlExtraido,
          base64Data: base64Small
        };
      }

      localStorage.setItem('visor_active_expediente', JSON.stringify(expedienteActual));
      if (window.localforage) await localforage.setItem('visor_active_expediente_full', expedienteActual);

      ['despacho45', 'aldo_indep'].forEach(ent => {
        ['bd_masc', 'bd_juzgados'].forEach(t => {
          const k = `boveda_pro_${ent}_${t}`;
          const raw = localStorage.getItem(k);
          if (!raw) return;
          try {
            const arr = JSON.parse(raw);
            const i = arr.findIndex(e => e.id === expedienteActual.id || e.numExpediente === expedienteActual.numExpediente);
            if (i !== -1) {
              arr[i].docs = { ...(arr[i].docs || {}), ...(expedienteActual.docs || {}) };
              localStorage.setItem(k, JSON.stringify(arr));
            }
          } catch (e) {}
        });
      });

      delete expedienteActual.piezasEmpaquetadas;
      await construirFojasDesdeArchivosReales(expedienteActual);
      escanearAlertasInfalible();
      ocultarProgreso();
    }

    function filtrarTextoEnFoja(q) {
      palabraResaltada = (q || '').trim();
      renderizarVisorCentral();
    }

    function escanearAlertasInfalible() {
      const cont = document.getElementById('contenedor-alertas-resultados');
      const hallazgos = [];
      const patrones = [
        { titulo: 'Partes / Comparecientes', regex: /(?:celebraron las partes|comparecen|arrendador|arrendatario|cónyuges)[\s:.,]+([A-ZÁÉÍÓÚÑ\s,Y]{10,120})/gi },
        { titulo: 'Vigencia / Plazo', regex: /(?:vigencia|vencimiento|forzoso|plazo|fecha)[^.;\n]{4,90}/gi },
        { titulo: 'Monto / Renta / Pensión', regex: /(?:\$\s*[0-9,]+(?:\.[0-9]{2})?|renta\s+mensual|pensión)[^.;\n]{0,70}/gi },
        { titulo: 'Predial / Escritura / Inmueble', regex: /(?:predial|escritura|inmueble|finca)[^.;\n]{4,90}/gi },
        { titulo: 'Cláusula / Obligación LJA', regex: /(?:cláusula\s+[a-záéíóú]+|cosa\s+juzgada|sentencia\s+ejecutoriada|justicia\s+alternativa)[^.;\n]{4,90}/gi }
      ];

      fojasEnMemoria.forEach((f, idx) => {
        const txt = f.textoPlano || '';
        patrones.forEach(p => {
          for (const m of txt.matchAll(p.regex)) {
            if (hallazgos.length < 35) {
              hallazgos.push({ titulo: p.titulo, foja: f.numeroFoja, idx, extracto: m[0].trim() });
            }
          }
        });
      });

      if (hallazgos.length === 0) {
        cont.innerHTML = `<div style="font-size:0.74rem; color:#64748b; text-align:center; padding:16px;">Sube un documento y pulsa "IA" para listar cláusulas y alertas.</div>`;
        return;
      }

      cont.innerHTML = hallazgos.map(h => `
        <div onclick="seleccionarFoja(${h.idx})" class="keyword-card">
          <div class="keyword-word"><span>${h.titulo}</span><span>FOJA ${h.foja}</span></div>
          <div class="keyword-snippet">"${h.extracto}"</div>
        </div>
      `).join('');
    }

    function cambiarTabDerecha(tab) {
      const esPalabras = tab === 'palabras';
      document.getElementById('tab-palabras').classList.toggle('activa', esPalabras);
      document.getElementById('tab-notas').classList.toggle('activa', !esPalabras);
      document.getElementById('panel-palabras').style.display = esPalabras ? 'flex' : 'none';
      document.getElementById('panel-notas').style.display = esPalabras ? 'none' : 'flex';
    }

    function cargarNotasGuardadas() {
      const clave = `notas_visor_${expedienteActual ? expedienteActual.id : 'default'}`;
      const raw = localStorage.getItem(clave);
      notasDelExpediente = raw ? JSON.parse(raw) : [];
      renderizarIndiceNotas();
    }

    function guardarNotas() {
      const txt = (document.getElementById('texto-notas').value || '').trim();
      if (!txt) return;
      const fojaNum = fojasEnMemoria[indiceFojaActiva] ? fojasEnMemoria[indiceFojaActiva].numeroFoja : 1;
      notasDelExpediente.unshift({ id: Date.now(), foja: fojaNum, idx: indiceFojaActiva, texto: txt });
      const clave = `notas_visor_${expedienteActual ? expedienteActual.id : 'default'}`;
      localStorage.setItem(clave, JSON.stringify(notasDelExpediente));
      document.getElementById('texto-notas').value = '';
      renderizarIndiceNotas();
    }

    function eliminarNota(id) {
      notasDelExpediente = notasDelExpediente.filter(n => n.id !== id);
      const clave = `notas_visor_${expedienteActual ? expedienteActual.id : 'default'}`;
      localStorage.setItem(clave, JSON.stringify(notasDelExpediente));
      renderizarIndiceNotas();
    }

    function renderizarIndiceNotas() {
      const cont = document.getElementById('indice-notas-container');
      cont.innerHTML = notasDelExpediente.map(n => `
        <div class="nota-guardada">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong onclick="seleccionarFoja(${n.idx})" style="color:#fbbf24; cursor:pointer;">Foja ${n.foja}</strong>
            <button onclick="eliminarNota(${n.id})" style="background:none; border:none; color:#fda4af; cursor:pointer; font-size:0.7rem;"><i class="fa-solid fa-trash"></i></button>
          </div>
          <span>${n.texto}</span>
        </div>
      `).join('');
    }
  </script>
</body>
