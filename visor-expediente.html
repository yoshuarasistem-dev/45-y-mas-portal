<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expediente Inteligente IA | 45 y Más</title>
    
    <!-- Librerías de Visualización y OCR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- Librerías para Guardado Persistente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-deep: #050810; --bg-panel: #0f172a; --glass-bg: rgba(15, 23, 42, 0.95); --brand-orange: #ff7315; --neon-blue: #38bdf8; --border-glass: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-muted: #94a3b8; --danger: #ef4444; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: var(--bg-deep); } 
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        /* HEADER (Top Bar) */
        .topbar { background: var(--bg-panel); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); z-index: 100; position: relative; }
        .logo-oficial { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
        .logo-oficial .sub-brand { font-size: 0.6rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .expediente-title { background: rgba(56, 189, 248, 0.1); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; color: var(--neon-blue); font-weight: bold; border: 1px solid rgba(56, 189, 248, 0.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        
        .btn { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-glass); font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.3s ease; color: var(--text-main); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; justify-content: center; background: var(--glass-bg); }
        .btn:hover { background: var(--border-glass); }
        .btn-accion { border-color: rgba(56, 189, 248, 0.3); color: var(--neon-blue); } .btn-accion:hover { background: var(--neon-blue); color: #000; }

        /* ÁREA DE TRABAJO PRINCIPAL */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; width: 100%; }

        /* PANELES LATERALES (Estilos Base para PC) */
        .sidebar-fojas { width: 250px; background: var(--bg-panel); border-right: 1px solid var(--border-glass); display: flex; flex-direction: column; z-index: 50; flex-shrink: 0; }
        .sidebar-herramientas { width: 320px; background: var(--bg-panel); border-left: 1px solid var(--border-glass); display: flex; flex-direction: column; z-index: 50; flex-shrink: 0; }
        
        /* Contenido de Fojas */
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-glass); text-align: center; }
        .btn-add-foja { width: 100%; background: transparent; border: 1px dashed var(--brand-orange); color: var(--brand-orange); padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s; margin-bottom: 8px;}
        .btn-add-foja:hover { background: rgba(255, 115, 21, 0.1); }
        .fojas-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .foja-item { background: var(--bg-deep); border: 1px solid var(--border-glass); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; position: relative;}
        .foja-item.activa { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .foja-canvas-container { height: 120px; background: #fff; margin-bottom: 8px; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #000;}
        .foja-canvas-container canvas { width: 100%; height: auto; display: block; }
        .foja-label { font-size: 0.8rem; font-weight: bold; color: var(--text-main); }
        .foja-controls { display: flex; justify-content: center; gap: 4px; margin-top: 5px; }
        .btn-mini { background: rgba(255,255,255,0.1); border: none; color: white; width: 25px; height: 25px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center;}
        .btn-mini:hover { background: var(--brand-orange); }

        /* Contenido de Herramientas (IA y Notas) */
        .tabs { display: flex; border-bottom: 1px solid var(--border-glass); }
        .tab { flex: 1; text-align: center; padding: 15px 10px; cursor: pointer; font-weight: bold; font-size: 0.85rem; color: var(--text-muted); border-bottom: 2px solid transparent; transition: 0.3s; }
        .tab.active { color: var(--neon-blue); border-bottom-color: var(--neon-blue); }
        .panel-content { flex: 1; overflow-y: auto; padding: 20px; display: none; flex-direction: column;}
        .panel-content.active { display: flex; }
        
        .keyword-card { background: var(--bg-deep); border: 1px solid var(--border-glass); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .keyword-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .keyword-word { font-weight: 800; color: var(--text-main); font-size: 0.9rem; text-transform: uppercase; }
        .keyword-count { background: rgba(56, 189, 248, 0.2); color: var(--neon-blue); padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .keyword-fojas { font-size: 0.75rem; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 5px; }
        .badge-foja { background: rgba(255, 255, 255, 0.1); padding: 3px 6px; border-radius: 4px; cursor: pointer; font-weight: 600;}
        .badge-foja:hover { background: var(--brand-orange); color: white; }

        .nota-area { width: 100%; flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); color: var(--text-main); padding: 15px; border-radius: 8px; resize: none; font-size: 0.9rem; outline: none; margin-bottom: 10px; min-height: 120px;}
        .nota-area:focus { border-color: var(--brand-orange); }
        #indice-notas-container { max-height: 150px; overflow-y: auto; border-bottom: 1px solid var(--border-glass); margin-bottom: 15px; padding-bottom: 10px; }
        .nota-preview { background: rgba(255,255,255,0.03); border-left: 3px solid var(--brand-orange); padding: 10px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: 0.2s;}

        /* VISOR CENTRAL */
        .visor-central { flex: 1; position: relative; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; background: var(--bg-deep); width: 100%; }
        #canvas-principal { background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 100%; height: auto; position: absolute; transform-origin: top center; transition: transform 0.2s ease;}
        #canvas-dibujo { position: absolute; pointer-events: none; z-index: 5; transform-origin: top center; transition: transform 0.2s ease;} 
        #html-visor { background: white; color: black; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 850px; min-height: 100%; padding: 20px; font-family: 'Arial', sans-serif; display: none; line-height: 1.6; position: absolute; overflow-wrap: break-word;}
        
        .zoom-controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--glass-bg); padding: 8px; border-radius: 8px; border: 1px solid var(--border-glass); display: flex; gap: 6px; z-index: 40; backdrop-filter: blur(5px);}

        /* PANTALLAS DE CARGA */
        #pantalla-progreso { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; padding: 20px;}
        .progreso-card { background: var(--bg-panel); border: 1px solid var(--neon-blue); padding: 30px; border-radius: 12px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);}
        .barra-fondo { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; margin: 20px 0; overflow: hidden; }
        .barra-llena { width: 0%; height: 100%; background: var(--neon-blue); transition: width 0.3s ease; }

        /* OVERLAY OSCURO PARA MÓVILES */
        .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 45; }

        /* RESPONSIVE DESIGN (MÓVILES Y TABLETS) */
        .mobile-only { display: none; }
        .desktop-only { display: flex; }

        @media (max-width: 992px) {
            .mobile-only { display: flex; }
            .desktop-only { display: none; }
            
            .topbar { padding: 10px; flex-wrap: wrap; }
            .topbar-branding { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
            .topbar-actions { width: 100%; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
            
            .expediente-title { max-width: 100px; font-size: 0.7rem; }
            .btn { font-size: 0.75rem; padding: 8px 10px; }

            /* Paneles flotantes sobre el contenido */
            .sidebar-fojas { position: absolute; left: 0; top: 0; height: 100%; transform: translateX(-100%); background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); width: 280px; max-width: 80vw; }
            .sidebar-fojas.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.7); }
            
            .sidebar-herramientas { position: absolute; right: 0; top: 0; height: 100%; transform: translateX(100%); background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); width: 300px; max-width: 85vw; }
            .sidebar-herramientas.open { transform: translateX(0); box-shadow: -10px 0 30px rgba(0,0,0,0.7); }

            .mobile-overlay.active { display: block; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <!-- Parte Superior: Logo y Botones de Menú Móvil -->
        <div class="topbar-branding">
            <button class="btn mobile-only" onclick="togglePanel('fojas')"><i class="fa-solid fa-bars"></i> Fojas</button>
            
            <div class="logo-oficial" style="align-items: center; text-align: center; flex: 1;">
                <div style="font-weight:900; font-size:1rem; color:var(--brand-orange); letter-spacing:-1px;"><i class="fa-solid fa-scale-balanced"></i> 45<span style="color:var(--text-main);">YMÁS</span></div>
                <div class="sub-brand" id="etiqueta-almacenamiento" style="font-size: 0.55rem;">Bóveda Local</div>
            </div>
            
            <button class="btn mobile-only" onclick="togglePanel('herramientas')"><i class="fa-solid fa-toolbox"></i></button>
        </div>

        <!-- Botones de Acción -->
        <div class="topbar-actions">
            <a href="index.html" class="btn"><i class="fa-solid fa-house"></i> <span class="desktop-only">Inicio</span></a>
            <a href="portal-pro.html" class="btn"><i class="fa-solid fa-vault"></i> <span class="desktop-only">Bóveda</span></a>
            
            <span class="expediente-title desktop-only" id="titulo-exp">EXP/000/00</span>
            
            <input type="file" id="pdf-upload" accept=".pdf, .doc, .docx" style="display:none;" onchange="cargarDocumentoManual(event)">
            <button class="btn btn-accion" onclick="document.getElementById('pdf-upload').click()"><i class="fa-solid fa-file-arrow-up"></i> Cargar</button>
            <button id="btn-analizar" class="btn btn-accion" style="display:none; background: var(--brand-orange); border-color: var(--brand-orange); color:white;" onclick="escanearAlertasInfalible()"><i class="fa-solid fa-brain"></i> IA</button>
        </div>
    </div>

    <div class="workspace">
        <!-- Fondo oscuro semitransparente cuando se abre un menú en móvil -->
        <div class="mobile-overlay" id="mobile-overlay" onclick="cerrarPaneles()"></div>

        <!-- PANEL IZQUIERDO: FOJAS -->
        <div class="sidebar-fojas" id="panel-fojas">
            <div class="sidebar-header">
                <button class="btn-add-foja mobile-only" style="border-color:var(--danger); color:var(--danger); margin-bottom: 15px;" onclick="cerrarPaneles()"><i class="fa-solid fa-xmark"></i> Cerrar Panel</button>
                <input type="file" id="add-foja-input" accept=".pdf, .doc, .docx, image/*" style="display:none;" onchange="agregarFojaFaltante(event)">
                <button class="btn-add-foja" onclick="document.getElementById('add-foja-input').click()"><i class="fa-solid fa-plus"></i> Insertar Foja</button>
                <button class="btn-add-foja" style="border-color:var(--neon-blue); color:var(--neon-blue);" onclick="autoOrdenarFojas()"><i class="fa-solid fa-arrow-down-1-9"></i> Ordenar</button>
            </div>
            <div class="fojas-list" id="lista-fojas-container">
                <p style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 20px;">Sube un archivo para comenzar.</p>
            </div>
        </div>

        <!-- VISOR CENTRAL -->
        <div class="visor-central" id="contenedor-visor-zoom">
            <canvas id="canvas-principal" style="display:none;"></canvas>
            <canvas id="canvas-dibujo" style="display:none;"></canvas>
            
            <div id="html-visor"></div>
            
            <div style="text-align:center; color:var(--text-muted); margin-top: 30%;" id="msg-vacio">
                <i class="fa-solid fa-folder-open" style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;"></i>
                <h4>Visor Inactivo</h4>
                <p style="font-size: 0.8rem;">Carga o selecciona una foja.</p>
            </div>

            <div class="zoom-controls" id="controles-zoom" style="display: none;">
                <button class="btn btn-mini" style="width:35px; height:35px; font-size: 1rem;" onclick="cambiarZoom(0.2)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button class="btn btn-mini" style="width:35px; height:35px; font-size: 1rem;" onclick="cambiarZoom(-0.2)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            </div>
        </div>

        <!-- PANEL DERECHO: HERRAMIENTAS -->
        <div class="sidebar-herramientas" id="panel-herramientas">
            <div class="sidebar-header mobile-only" style="padding-bottom: 0;">
                <button class="btn-add-foja" style="border-color:var(--danger); color:var(--danger); margin-bottom: 10px;" onclick="cerrarPaneles()"><i class="fa-solid fa-xmark"></i> Cerrar Herramientas</button>
            </div>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('tab-palabras', this)"><i class="fa-solid fa-radar"></i> Alertas IA</div>
                <div class="tab" onclick="switchTab('tab-notas', this)"><i class="fa-solid fa-pen-to-square"></i> Apuntes</div>
            </div>

            <div class="panel-content active" id="tab-palabras">
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4;">La IA buscará alertas de la <strong>Ley de Justicia Alternativa</strong> automáticamente.</p>
                <div id="contenedor-keywords"></div>
            </div>

            <div class="panel-content" id="tab-notas">
                <div id="indice-notas-container">
                    <h5 style="color:var(--text-muted); margin-bottom:10px; font-size: 0.75rem; text-transform: uppercase;"><i class="fa-solid fa-list"></i> Anotaciones</h5>
                    <div id="lista-resumen-notas"></div>
                </div>
                <h4 style="color: var(--neon-blue); margin-bottom: 5px; font-size: 0.85rem;" id="titulo-nota-foja">Apunte Foja</h4>
                <p id="info-nota-fecha" style="font-size:0.65rem; color:var(--text-muted); margin-bottom:10px;"></p>
                <textarea class="nota-area" id="texto-notas" placeholder="Escribe aquí..."></textarea>
                <button class="btn btn-accion" style="width: 100%; justify-content: center;" onclick="guardarNotas()"><i class="fa-solid fa-save"></i> Guardar</button>
                <p id="nota-guardada" style="color: var(--success); font-size: 0.75rem; text-align: center; margin-top: 10px; display: none;"><i class="fa-solid fa-check"></i> Guardado</p>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE PROGRESO -->
    <div id="pantalla-progreso">
        <div class="progreso-card">
            <i class="fa-solid fa-hdd fa-fade" id="icono-progreso" style="font-size: 3rem; color: var(--neon-blue); margin-bottom: 15px;"></i>
            <h3 style="color: white; margin-bottom: 5px; font-size: 1.1rem;" id="titulo-progreso">Procesando Bóveda</h3>
            <p id="texto-progreso" style="color: var(--text-muted); font-size: 0.8rem;">Verificando archivos...</p>
            <p id="texto-subprogreso" style="color: var(--brand-orange); font-size: 0.7rem; margin-top: 8px; font-weight: bold;"></p>
            <div class="barra-fondo"><div class="barra-llena" id="barra-llena"></div></div>
            <button class="btn btn-accion" id="btn-cancelar-ia" style="margin-top: 15px; font-size: 0.75rem; padding: 8px 15px; display:none;" onclick="cancelarProcesos()">Detener</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        let nombreExpediente = localStorage.getItem('expediente_abierto') || 'EXP_NUEVO';
        document.getElementById('titulo-exp').innerText = nombreExpediente;

        let arrayFojas = []; 
        let fojaSeleccionadaIndex = 0;
        let zoomGlobal = 1.0; 
        let detenerEjecucion = false;
        let pdfGlobal = null; 
        
        const categoriasIA = [
            { nombre: "Resolución", palabras: ['sentencia', 'resuelve', 'resolutivo', 'acuerdo', 'convenio'], colorFondo: 'rgba(231, 76, 60, 0.4)', colorBorde: '#e74c3c' },
            { nombre: "Requerimiento", palabras: ['prevéngase', 'aclarar', 'apercibimiento', 'requiérase', 'omiso'], colorFondo: 'rgba(230, 126, 34, 0.4)', colorBorde: '#e67e22' },
            { nombre: "Término", palabras: ['admite', 'término', 'días', 'improrrogable', 'caducidad', 'mediación'], colorFondo: 'rgba(52, 152, 219, 0.4)', colorBorde: '#3498db' },
            { nombre: "Familiar / MASC", palabras: ['alimentos', 'pensión', 'divorcio', 'custodia'], colorFondo: 'rgba(255, 105, 180, 0.4)', colorBorde: '#ff69b4' }
        ];

        let resultadosKeywords = {}; window.mapaAlertasPorFoja = {}; 

        // CONTROLES DE PANELES MÓVILES
        function togglePanel(panelName) {
            const fojas = document.getElementById('panel-fojas');
            const herr = document.getElementById('panel-herramientas');
            const overlay = document.getElementById('mobile-overlay');

            if(panelName === 'fojas') {
                herr.classList.remove('open');
                fojas.classList.toggle('open');
            } else if (panelName === 'herramientas') {
                fojas.classList.remove('open');
                herr.classList.toggle('open');
            }
            overlay.classList.toggle('active', fojas.classList.contains('open') || herr.classList.contains('open'));
        }

        function cerrarPaneles() {
            document.getElementById('panel-fojas').classList.remove('open');
            document.getElementById('panel-herramientas').classList.remove('open');
            document.getElementById('mobile-overlay').classList.remove('active');
        }

        // ==========================================
        // SISTEMA DE GUARDADO (PERSISTENTE Y ROBUSTO)
        // ==========================================
        window.onload = async () => {
            mostrarProgreso("fa-hdd", "Buscando en Bóveda", "Revisando disco duro local...");
            try {
                let archivo = await localforage.getItem('archivo_' + nombreExpediente);
                if (archivo) {
                    await procesarArchivoInterno(archivo);
                } else {
                    ocultarProgreso();
                }
            } catch (error) {
                console.error("Error al cargar:", error);
                ocultarProgreso();
            }
        };

        async function cargarDocumentoManual(event) {
            const file = event.target.files[0];
            if (!file) return;

            mostrarProgreso("fa-save", "Guardando Documento", "Asegurando archivo...");
            // Guardar con metadata para no perder tipo
            const archivoData = { blob: file, name: file.name, type: file.type };
            await localforage.setItem('archivo_' + nombreExpediente, archivoData);
            await procesarArchivoInterno(archivoData);
        }

        async function procesarArchivoInterno(archivoData) {
            detenerEjecucion = false;
            document.getElementById('texto-progreso').innerText = "Generando índice...";
            document.getElementById('texto-subprogreso').innerText = "";
            document.getElementById('btn-cancelar-ia').style.display = 'none';
            
            arrayFojas = []; window.mapaAlertasPorFoja = {}; 
            categoriasIA.forEach(c => { c.palabras.forEach(p => resultadosKeywords[p] = []); });
            
            // Compatibilidad por si guardó como Blob puro o como Objeto
            let blobReal = archivoData.blob || archivoData;
            let nombreArchivo = archivoData.name || '';
            let isWord = nombreArchivo.endsWith('.docx') || nombreArchivo.endsWith('.doc');

            try {
                if(isWord) {
                    const arrayBuffer = await blobReal.arrayBuffer();
                    const result = await mammoth.convertToHtml({arrayBuffer: arrayBuffer});
                    const rawText = await mammoth.extractRawText({arrayBuffer: arrayBuffer});
                    arrayFojas.push({ id: Date.now(), numeroLogico: 1, isHtml: true, htmlContent: result.value, rawText: rawText.value, rotacion: 0 });
                    actualizarBarra(100);
                } else {
                    const bytes = new Uint8Array(await blobReal.arrayBuffer());
                    pdfGlobal = await pdfjsLib.getDocument(bytes).promise;
                    for (let i = 1; i <= pdfGlobal.numPages; i++) {
                        arrayFojas.push({ id: Date.now() + i, numeroLogico: i, isHtml: false, numPaginaPdf: i, rotacion: 0 });
                    }
                    actualizarBarra(100);
                }

                setTimeout(() => {
                    ocultarProgreso();
                    document.getElementById('btn-analizar').style.display = 'inline-flex';
                    renderizarBarraLateralFojas();
                    renderizarIndiceNotas(); 
                    if(arrayFojas.length > 0) seleccionarFoja(0);
                }, 500);
            } catch (error) {
                console.error("Error al procesar el archivo guardado:", error);
                ocultarProgreso();
                alert("El archivo guardado está dañado o no es válido. Súbelo nuevamente.");
                localforage.removeItem('archivo_' + nombreExpediente);
            }
        }

        async function obtenerCanvasFoja(fojaInfo, scale = 1.0) {
            if(fojaInfo.isHtml) return null;
            const page = await pdfGlobal.getPage(fojaInfo.numPaginaPdf);
            const viewport = page.getViewport({ scale: scale });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            return canvas;
        }

        // ==========================================
        // LA INTELIGENCIA ARTIFICIAL (Tesseract v5 Infalible)
        // ==========================================
        async function escanearAlertasInfalible() {
            if(arrayFojas.length === 0) return;
            detenerEjecucion = false;
            cerrarPaneles(); // Cerrar paneles en móvil para que se vea el progreso
            mostrarProgreso("fa-brain", "IA Analizando", "Iniciando Motor de Lectura...");
            document.getElementById('btn-cancelar-ia').style.display = 'inline-block';
            
            resultadosKeywords = {}; window.mapaAlertasPorFoja = {}; 
            categoriasIA.forEach(c => { c.palabras.forEach(p => resultadosKeywords[p] = []); });

            try {
                for (let i = 0; i < arrayFojas.length; i++) {
                    if (detenerEjecucion) break;
                    let f = arrayFojas[i];
                    actualizarBarra(Math.round(((i) / arrayFojas.length) * 100));
                    document.getElementById('texto-progreso').innerText = `Leyendo Foja ${f.numeroLogico} de ${arrayFojas.length}`;
                    
                    if (!window.mapaAlertasPorFoja[f.numeroLogico]) window.mapaAlertasPorFoja[f.numeroLogico] = [];

                    if(f.isHtml) {
                        let textoWord = f.rawText.toLowerCase();
                        categoriasIA.forEach(cat => { cat.palabras.forEach(p => { if(textoWord.includes(p)) { if(!resultadosKeywords[p].includes(f.numeroLogico)) resultadosKeywords[p].push(f.numeroLogico); } }); });
                    } else {
                        try {
                            const canvasOCR = await obtenerCanvasFoja(f, 1.0); 
                            const { data } = await Tesseract.recognize(canvasOCR, 'spa');
                            data.words.forEach(palabra => {
                                let txtLimpio = palabra.text.toLowerCase().replace(/[^a-záéíóúñ]/g, '');
                                if (txtLimpio.length < 3) return;
                                for (let cat of categoriasIA) {
                                    if (cat.palabras.includes(txtLimpio)) {
                                        if(!resultadosKeywords[txtLimpio].includes(f.numeroLogico)) resultadosKeywords[txtLimpio].push(f.numeroLogico);
                                        window.mapaAlertasPorFoja[f.numeroLogico].push({ bbox: palabra.bbox, colorFondo: cat.colorFondo, colorBorde: cat.colorBorde });
                                    }
                                }
                            });
                            canvasOCR.width = 0; canvasOCR.height = 0; 
                        } catch (e) { console.warn("Error OCR", e); }
                    }
                }
            } catch (error) { console.error("Error IA", error); }

            ocultarProgreso();
            if(!detenerEjecucion) {
                switchTab('tab-palabras', document.querySelectorAll('.tab')[0]);
                mostrarResultadosKeywords();
                renderizarVisorCentral(); 
                if(window.innerWidth <= 992) togglePanel('herramientas');
            }
        }

        function cancelarProcesos() { detenerEjecucion = true; ocultarProgreso(); }

        // ==========================================
        // FUNCIONES DE INTERFAZ Y RENDERIZADO
        // ==========================================
        function mostrarResultadosKeywords() {
            const cont = document.getElementById('contenedor-keywords'); cont.innerHTML = ''; let encontroAlgo = false;
            for(let key in resultadosKeywords) {
                let fojas = resultadosKeywords[key];
                if(fojas.length > 0) {
                    encontroAlgo = true;
                    let badges = fojas.map(num => `<span class="badge-foja" onclick="buscarFojaPorNumero(${num})">F-${num}</span>`).join('');
                    cont.innerHTML += `<div class="keyword-card"><div class="keyword-header"><span class="keyword-word">${key}</span><span class="keyword-count">${fojas.length}</span></div><div class="keyword-fojas">En: ${badges}</div></div>`;
                }
            }
            if(!encontroAlgo) cont.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:0.8rem; margin-top:20px;">No se detectaron alertas.</p>`;
        }

        async function renderizarBarraLateralFojas() {
            const container = document.getElementById('lista-fojas-container');
            container.innerHTML = '';
            for (let i = 0; i < arrayFojas.length; i++) {
                const f = arrayFojas[i];
                const div = document.createElement('div');
                div.className = 'foja-item'; div.id = 'thumb-' + i; div.onclick = () => seleccionarFoja(i);

                let badge = JSON.parse(localStorage.getItem(`notas_${nombreExpediente}_f${f.numeroLogico}`)) ? `<div style="color:var(--brand-orange); font-size:0.75rem; margin-top:6px; font-weight:bold;"><i class="fa-solid fa-pen-to-square"></i></div>` : '';
                div.innerHTML = `<div class="foja-label">FOJA ${f.numeroLogico}</div><div class="foja-canvas-container" id="cont-canvas-${i}">...</div><div class="foja-controls"><button class="btn-mini" onclick="event.stopPropagation(); moverFoja(${i}, -1)"><i class="fa-solid fa-arrow-up"></i></button><button class="btn-mini" onclick="event.stopPropagation(); moverFoja(${i}, 1)"><i class="fa-solid fa-arrow-down"></i></button><button class="btn-mini" onclick="event.stopPropagation(); eliminarFojaEnMemoria(${i})"><i class="fa-solid fa-trash"></i></button></div>${badge}`;
                container.appendChild(div);

                if(!f.isHtml && pdfGlobal) {
                    obtenerCanvasFoja(f, 0.2).then(canvasMini => {
                        const contCanvas = document.getElementById('cont-canvas-'+i);
                        if(contCanvas) { contCanvas.innerHTML = ''; contCanvas.appendChild(canvasMini); }
                    });
                }
            }
        }

        async function renderizarVisorCentral() {
            if(arrayFojas.length === 0) return;
            const foja = arrayFojas[fojaSeleccionadaIndex];
            const canvasP = document.getElementById('canvas-principal');
            const canvasD = document.getElementById('canvas-dibujo'); 
            const divHtml = document.getElementById('html-visor');

            if(foja.isHtml) {
                canvasP.style.display = 'none'; canvasD.style.display = 'none'; divHtml.style.display = 'block';
                divHtml.innerHTML = foja.htmlContent; divHtml.style.transform = `scale(${zoomGlobal})`;
            } else {
                divHtml.style.display = 'none'; canvasP.style.display = 'block'; canvasD.style.display = 'block';
                const canvasAltaRes = await obtenerCanvasFoja(foja, zoomGlobal);
                const ctxP = canvasP.getContext('2d'); const ctxD = canvasD.getContext('2d');
                canvasP.width = canvasAltaRes.width; canvasP.height = canvasAltaRes.height;
                canvasD.width = canvasAltaRes.width; canvasD.height = canvasAltaRes.height;
                ctxP.drawImage(canvasAltaRes, 0, 0);

                ctxD.clearRect(0, 0, canvasD.width, canvasD.height);
                const alertas = window.mapaAlertasPorFoja ? window.mapaAlertasPorFoja[foja.numeroLogico] : [];
                if (alertas && alertas.length > 0) {
                    alertas.forEach(a => {
                        const b = a.bbox;
                        ctxD.fillStyle = a.colorFondo; ctxD.fillRect(b.x0 * zoomGlobal, b.y0 * zoomGlobal, (b.x1 - b.x0) * zoomGlobal, (b.y1 - b.y0) * zoomGlobal);
                        ctxD.strokeStyle = a.colorBorde; ctxD.lineWidth = 2; ctxD.strokeRect(b.x0 * zoomGlobal, b.y0 * zoomGlobal, (b.x1 - b.x0) * zoomGlobal, (b.y1 - b.y0) * zoomGlobal);
                    });
                }
            }
        }

        function seleccionarFoja(index) { 
            fojaSeleccionadaIndex = index; 
            document.querySelectorAll('.foja-item').forEach(el => el.classList.remove('activa')); 
            document.getElementById('thumb-' + index).classList.add('activa'); 
            document.getElementById('msg-vacio').style.display = 'none'; 
            document.getElementById('controles-zoom').style.display = 'flex'; 
            cargarNotasDeFojaActual(); renderizarVisorCentral(); 
            cerrarPaneles(); // Se esconde el menu lateral al escoger una foja en movil
        }

        function cambiarZoom(delta) { zoomGlobal = Math.max(0.3, Math.min(3, zoomGlobal + delta)); renderizarVisorCentral(); }
        async function eliminarFojaEnMemoria(index) { if(confirm("¿Eliminar foja?")) { arrayFojas.splice(index, 1); for(let i=index; i<arrayFojas.length; i++) arrayFojas[i].numeroLogico--; renderizarBarraLateralFojas(); if(arrayFojas.length > 0) seleccionarFoja(Math.max(0, index-1)); else { document.getElementById('canvas-principal').style.display='none'; document.getElementById('canvas-dibujo').style.display='none'; document.getElementById('msg-vacio').style.display='block'; await localforage.removeItem('archivo_' + nombreExpediente); } } }
        function moverFoja(index, dir) { if(index + dir < 0 || index + dir >= arrayFojas.length) return; let temp = arrayFojas[index]; arrayFojas[index] = arrayFojas[index + dir]; arrayFojas[index + dir] = temp; renderizarBarraLateralFojas(); if(fojaSeleccionadaIndex === index) seleccionarFoja(index + dir); else if(fojaSeleccionadaIndex === index + dir) seleccionarFoja(index); }
        function buscarFojaPorNumero(num) { let index = arrayFojas.findIndex(f => f.numeroLogico === parseInt(num)); if(index !== -1) seleccionarFoja(index); }
        function switchTab(tabId, element) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); element.classList.add('active'); document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active')); document.getElementById(tabId).classList.add('active'); }

        function cargarNotasDeFojaActual() { if(arrayFojas.length === 0) return; let num = arrayFojas[fojaSeleccionadaIndex].numeroLogico; document.getElementById('titulo-nota-foja').innerText = `Apunte Foja ${num}`; let dataNota = JSON.parse(localStorage.getItem(`notas_${nombreExpediente}_f${num}`)) || {texto: '', fecha: ''}; document.getElementById('texto-notas').value = dataNota.texto; document.getElementById('info-nota-fecha').innerText = dataNota.fecha ? `Modificado: ${dataNota.fecha}` : ''; }
        function guardarNotas() { if(arrayFojas.length === 0) return; let num = arrayFojas[fojaSeleccionadaIndex].numeroLogico; let texto = document.getElementById('texto-notas').value; let fechaActual = new Date().toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }); if(texto.trim() === '') localStorage.removeItem(`notas_${nombreExpediente}_f${num}`); else localStorage.setItem(`notas_${nombreExpediente}_f${num}`, JSON.stringify({ texto: texto, fecha: fechaActual })); document.getElementById('info-nota-fecha').innerText = `Modificado: ${fechaActual}`; const msg = document.getElementById('nota-guardada'); msg.style.display = 'block'; setTimeout(() => { msg.style.display = 'none'; }, 3000); renderizarBarraLateralFojas(); renderizarIndiceNotas(); }
        function renderizarIndiceNotas() { const list = document.getElementById('lista-resumen-notas'); list.innerHTML = ''; let hayNotas = false; let notasArray = []; for(let i=0; i<localStorage.length; i++) { let key = localStorage.key(i); if(key.startsWith(`notas_${nombreExpediente}_f`)) { let numFoja = parseInt(key.split('_f')[1]); let dataNota = JSON.parse(localStorage.getItem(key)); notasArray.push({ foja: numFoja, texto: dataNota.texto }); } } notasArray.sort((a,b) => a.foja - b.foja); notasArray.forEach(nota => { hayNotas = true; let extracto = nota.texto.substring(0, 35) + (nota.texto.length > 35 ? '...' : ''); list.innerHTML += `<div class="nota-preview" onclick="buscarFojaPorNumero(${nota.foja})"><strong style="color:var(--neon-blue); font-size:0.75rem;">Foja ${nota.foja}</strong><p style="font-size:0.7rem; color:var(--text-main); margin:3px 0;">"${extracto}"</p></div>`; }); if(!hayNotas) list.innerHTML = `<p style="font-size:0.7rem; color:var(--text-muted); text-align:center;">No hay notas.</p>`; }

        function mostrarProgreso(icono, titulo, texto) { document.getElementById('icono-progreso').className = `fa-solid ${icono} fa-fade`; document.getElementById('titulo-progreso').innerText = titulo; document.getElementById('texto-progreso').innerText = texto; document.getElementById('barra-llena').style.width = '0%'; document.getElementById('btn-cancelar-ia').style.display = 'none'; document.getElementById('pantalla-progreso').style.display = 'flex'; }
        function actualizarBarra(porcentaje) { document.getElementById('barra-llena').style.width = `${porcentaje}%`; }
        function ocultarProgreso() { document.getElementById('pantalla-progreso').style.display = 'none'; }
    </script>
</body>
