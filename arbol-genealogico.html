<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol Sucesorio Legal | 45 y Más Pro</title>
    <!-- Librería para Exportar a Imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* BASE OSCURA NUEVA ERA */
        :root {
            --bg-deep: #050810; --bg-panel: #0a0f1d; --glass-bg: rgba(15, 23, 42, 0.7);
            --brand-orange: #ff7315; --neon-blue: #38bdf8; --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at 50% 50%, #0f172a 0%, var(--bg-deep) 100%); }

        /* TOPBAR CONTROLES */
        .topbar { background: rgba(5, 8, 16, 0.85); backdrop-filter: blur(15px); padding: 15px 25px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid var(--border-glass); z-index: 10; }
        .logo-visor { font-weight: 800; font-size: 1.2rem; color: #fff; margin-right: auto; display: flex; align-items: center; gap: 10px; }
        .logo-visor i { color: #22c55e; }
        
        .btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border-glass); font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease; color: white; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-volver { background: transparent; color: var(--text-muted); }
        .btn-volver:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .btn-vip { background: linear-gradient(135deg, var(--brand-orange), #d95d0b); border: none; box-shadow: 0 5px 15px rgba(255, 115, 21, 0.3); }
        .btn-vip:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 115, 21, 0.5); }
        
        /* ESTADO VIP */
        .status-badge { background: rgba(255, 255, 255, 0.1); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; }
        .status-demo { color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
        .status-pro { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }

        /* WORKSPACE Y ÁRBOL CSS */
        .workspace { flex: 1; overflow: auto; padding: 50px; display: flex; justify-content: center; align-items: flex-start; }
        .tree-container { margin-top: 20px; padding: 20px; border-radius: 16px; transition: transform 0.3s; }
        
        .tree ul { padding-top: 30px; position: relative; transition: all 0.5s; display: flex; justify-content: center; }
        .tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 30px 10px 0 10px; transition: all 0.5s; }
        
        /* Líneas conectoras neón */
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid var(--neon-blue); width: 50%; height: 30px; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--neon-blue); }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid var(--neon-blue); border-radius: 0 8px 0 0; }
        .tree li:first-child::after { border-radius: 8px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid var(--neon-blue); width: 0; height: 30px; }
        
        /* Tarjetas de Nodos (Glassmorphism) */
        .node-card { text-decoration: none; display: inline-flex; flex-direction: column; align-items: center; padding: 20px; border-radius: 12px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-glass); color: white; min-width: 160px; cursor: pointer; transition: all 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; }
        .node-card:hover { border-color: var(--brand-orange); box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 15px rgba(255, 115, 21, 0.2); transform: translateY(-5px); }
        .node-card i { font-size: 2rem; color: var(--neon-blue); margin-bottom: 10px; }
        .node-card .nombre { font-weight: 800; font-size: 1.1rem; margin-bottom: 5px; }
        .node-card .rol { font-size: 0.8rem; color: var(--brand-orange); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        
        /* Botones de acción flotantes en el nodo */
        .node-actions { position: absolute; top: -15px; right: -15px; display: none; gap: 5px; }
        .node-card:hover .node-actions { display: flex; }
        .btn-node { background: var(--brand-orange); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s; }
        .btn-node.add { background: #10b981; }
        .btn-node.delete { background: #ef4444; }
        .btn-node:hover { transform: scale(1.15); }

        /* GLASS MODAL VIP */
        #modalVIP { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-card { background: var(--bg-panel); border: 1px solid var(--border-glass); padding: 40px; border-radius: 20px; text-align: center; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); position: relative; overflow: hidden; }
        .modal-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, #22c55e, var(--brand-orange)); }
        .modal-card h2 { color: #fff; margin-bottom: 15px; font-size: 1.5rem; }
        .modal-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }
        .input-vip { background: rgba(0,0,0,0.3); border: 1px solid #1e293b; color: #fff; padding: 15px; width: 100%; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; outline: none; }
        .input-vip:focus { border-color: var(--brand-orange); box-shadow: 0 0 15px rgba(255, 115, 21, 0.2); }

        /* HERRAMIENTAS LATERALES */
        .floating-tools { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; }
        .tool-btn { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-glass); color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .tool-btn:hover { background: rgba(255,255,255,0.1); color: var(--neon-blue); transform: scale(1.1); }

    </style>
</head>
<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <a href="index.html" class="btn btn-volver"><i class="fa-solid fa-arrow-left"></i> Portal</a>
        <div class="logo-visor">
            <i class="fa-solid fa-network-wired"></i> Árbol Sucesorio Legal
            <span class="status-badge status-demo" id="status-badge">VERSIÓN DEMO</span>
        </div>
        
        <button id="btn-exportar" class="btn btn-vip" onclick="intentarExportar()"><i class="fa-solid fa-lock"></i> Exportar Mapeo VIP</button>
    </div>

    <!-- WORKSPACE (LIENZO DEL ÁRBOL) -->
    <div class="workspace" id="lienzo-arbol">
        <div class="tree-container tree" id="tree-root">
            <!-- El árbol se generará aquí por JavaScript -->
        </div>
    </div>

    <!-- HERRAMIENTAS FLOTANTES (ZOOM) -->
    <div class="floating-tools">
        <button class="tool-btn" onclick="zoomTree(0.1)" title="Acercar"><i class="fa-solid fa-plus"></i></button>
        <button class="tool-btn" onclick="zoomTree(-0.1)" title="Alejar"><i class="fa-solid fa-minus"></i></button>
        <button class="tool-btn" onclick="resetZoom()" title="Restaurar"><i class="fa-solid fa-expand"></i></button>
    </div>

    <!-- GLASS MODAL VIP -->
    <div id="modalVIP">
        <div class="modal-card">
            <h2><i class="fa-solid fa-gem" style="color: var(--brand-orange);"></i> Funciones VIP Bloqueadas</h2>
            <p>La versión Demo permite un máximo de 3 nodos. Ingresa tu token institucional para agregar nodos ilimitados y exportar en Alta Resolución.</p>
            <input type="text" id="tokenInput" class="input-vip" placeholder="EJ: 45YMAS" autocomplete="off">
            <button class="btn btn-vip" style="width: 100%; justify-content: center;" onclick="validarTokenVIP()">DESBLOQUEAR AHORA</button>
            <div style="margin-top: 20px;">
                <a href="https://wa.me/523321870711?text=Hola,%20quiero%20mi%20token%20VIP%20para%20el%20Arbol%20Sucesorio" target="_blank" style="color: var(--neon-blue); font-size: 0.8rem; text-decoration: none; font-weight: bold;"><i class="fa-brands fa-whatsapp"></i> Solicitar Token (SPEI)</a>
            </div>
            <button style="background:none; border:none; color: var(--text-muted); margin-top: 15px; cursor:pointer; font-size: 0.8rem;" onclick="cerrarModalVIP()">Cancelar</button>
        </div>
    </div>

    <script>
        // ESTADO GLOBAL
        let esProActivado = false;
        let nodeCount = 1;
        let scale = 1;

        // ESTRUCTURA INICIAL DE DATOS
        let treeData = {
            id: 1,
            nombre: "Autor de la Sucesión",
            rol: "De Cujus",
            icon: "fa-user-tie",
            children: []
        };

        // RENDERIZAR EL ÁRBOL
        function renderTree() {
            const rootContainer = document.getElementById('tree-root');
            rootContainer.innerHTML = '';
            const ul = document.createElement('ul');
            ul.appendChild(createNodeElement(treeData));
            rootContainer.appendChild(ul);
        }

        // CREAR NODO HTML RECURSIVAMENTE
        function createNodeElement(nodeData) {
            const li = document.createElement('li');
            
            // Tarjeta del Nodo
            const card = document.createElement('div');
            card.className = 'node-card';
            card.innerHTML = `
                <div class="node-actions">
                    <button class="btn-node add" title="Agregar Heredero" onclick="intentarAgregarHijo(${nodeData.id}, event)"><i class="fa-solid fa-plus"></i></button>
                    ${nodeData.id !== 1 ? `<button class="btn-node delete" title="Eliminar" onclick="eliminarNodo(${nodeData.id}, event)"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
                <i class="fa-solid ${nodeData.icon}"></i>
                <div class="nombre">${nodeData.nombre}</div>
                <div class="rol">${nodeData.rol}</div>
            `;
            li.appendChild(card);

            // Si tiene hijos, renderizarlos
            if (nodeData.children && nodeData.children.length > 0) {
                const ul = document.createElement('ul');
                nodeData.children.forEach(child => {
                    ul.appendChild(createNodeElement(child));
                });
                li.appendChild(ul);
            }
            return li;
        }

        // LÓGICA DE AGREGAR (CON BLOQUEO VIP)
        function intentarAgregarHijo(parentId, event) {
            event.stopPropagation();
            if (!esProActivado && nodeCount >= 3) {
                verificarVIP(); // Límite de la Demo alcanzado
                return;
            }

            const nombre = prompt("Nombre del familiar / heredero:", "Familiar");
            if (!nombre) return;
            const rol = prompt("Parentesco (Ej. Hijo, Cónyuge, Sobrino):", "Heredero");
            if (!rol) return;

            const icon = rol.toLowerCase().includes('cónyuge') ? "fa-rings-wedding" : "fa-user";

            const newNode = {
                id: Date.now(), // ID único
                nombre: nombre,
                rol: rol,
                icon: icon,
                children: []
            };

            addChildToNode(treeData, parentId, newNode);
            nodeCount++;
            renderTree();
        }

        function addChildToNode(currentNode, parentId, newNode) {
            if (currentNode.id === parentId) {
                currentNode.children.push(newNode);
                return true;
            }
            if (currentNode.children) {
                for (let child of currentNode.children) {
                    if (addChildToNode(child, parentId, newNode)) return true;
                }
            }
            return false;
        }

        // ELIMINAR NODO
        function eliminarNodo(nodeId, event) {
            event.stopPropagation();
            if(confirm("¿Seguro que deseas eliminar este familiar y toda su descendencia?")) {
                removeChild(treeData, nodeId);
                nodeCount--;
                renderTree();
            }
        }

        function removeChild(currentNode, idToRemove) {
            if (currentNode.children) {
                const index = currentNode.children.findIndex(c => c.id === idToRemove);
                if (index > -1) {
                    currentNode.children.splice(index, 1);
                    return true;
                }
                for (let child of currentNode.children) {
                    if (removeChild(child, idToRemove)) return true;
                }
            }
            return false;
        }

        // CONTROLES DE ZOOM
        function zoomTree(delta) {
            scale = Math.max(0.5, Math.min(2, scale + delta));
            document.getElementById('tree-root').style.transform = `scale(${scale})`;
            document.getElementById('tree-root').style.transformOrigin = "top center";
        }
        function resetZoom() {
            scale = 1;
            document.getElementById('tree-root').style.transform = `scale(1)`;
        }

        // LÓGICA VIP Y EXPORTACIÓN
        function verificarVIP() { document.getElementById('modalVIP').style.display = 'flex'; }
        function cerrarModalVIP() { document.getElementById('modalVIP').style.display = 'none'; }
        
        function validarTokenVIP() {
            if(document.getElementById('tokenInput').value.trim().toUpperCase() === "45YMAS") {
                esProActivado = true;
                cerrarModalVIP();
                const badge = document.getElementById('status-badge');
                badge.className = 'status-badge status-pro';
                badge.innerText = 'VERSIÓN PRO ACTIVA (ILIMITADO)';
                
                const btnExp = document.getElementById('btn-exportar');
                btnExp.innerHTML = '<i class="fa-solid fa-download"></i> Guardar Imagen Legal';
                btnExp.className = 'btn btn-accion';
            } else {
                alert("Acceso Denegado. Token inválido.");
            }
        }

        function intentarExportar() {
            if(!esProActivado) { verificarVIP(); return; }
            
            // html2canvas para tomar foto del árbol
            html2canvas(document.getElementById('tree-root'), {
                backgroundColor: "#050810", // Fondo oscuro en la exportación
                scale: 2 // Alta resolución
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Arbol_Sucesorio_45yMas.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // Inicializar
        window.onload = renderTree;
    </script>
</body>
</html>
