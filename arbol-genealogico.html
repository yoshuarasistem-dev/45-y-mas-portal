<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Súper Árbol Legal Multidireccional | 45 y Más Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-deep: #050810; --bg-panel: #0a0f1d; --glass-bg: rgba(15, 23, 42, 0.7); --brand-orange: #ff7315; --neon-blue: #38bdf8; --border-glass: rgba(255, 255, 255, 0.08); --text-main: #f8fafc; --text-muted: #94a3b8; --color-familiar: #ec4899; }
        body.light-mode { --bg-deep: #f8fafc; --bg-panel: #ffffff; --glass-bg: rgba(255, 255, 255, 0.9); --border-glass: rgba(0, 0, 0, 0.1); --text-main: #0f172a; --text-muted: #475569; }
        body.light-mode .topbar { background: rgba(255, 255, 255, 0.95); }
        body.light-mode .node-card { background: #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 0%, var(--bg-deep) 100%); transition: background 0.3s, color 0.3s; }

        .topbar { background: rgba(5, 8, 16, 0.85); backdrop-filter: blur(15px); padding: 15px 25px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid var(--border-glass); z-index: 10; transition: background 0.3s; flex-wrap: wrap; }
        .logo-visor { font-weight: 800; font-size: 1.2rem; color: var(--text-main); margin-right: auto; display: flex; align-items: center; gap: 10px; transition: color 0.3s; }
        .logo-visor i { color: #22c55e; }
        
        .btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border-glass); font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease; color: var(--text-main); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-volver { background: transparent; color: var(--text-muted); border: none; } .btn-volver:hover { color: var(--brand-orange); }
        .btn-accion { background: var(--glass-bg); border-color: rgba(56, 189, 248, 0.3); color: var(--neon-blue); } .btn-accion:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--neon-blue); }
        .btn-vip { background: linear-gradient(135deg, var(--brand-orange), #d95d0b); border: none; color: white; box-shadow: 0 5px 15px rgba(255, 115, 21, 0.3); } .btn-vip:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 115, 21, 0.5); }
        .btn-camaleon { background: transparent; border: 1px solid var(--brand-orange); color: var(--brand-orange); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.8rem; transition: all 0.3s; margin-left: 10px; } .btn-camaleon:hover { background: var(--brand-orange); color: white; }

        .status-badge { background: rgba(250, 204, 21, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
        .status-pro { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: rgba(16, 185, 129, 0.3); }

        .workspace { flex: 1; overflow: auto; padding: 40px; display: flex; justify-content: center; align-items: flex-start; position: relative; width: 100%; cursor: grab; }
        .workspace:active { cursor: grabbing; }
        
        .export-wrapper { padding: 40px; border-radius: 12px; transition: background 0.3s; display: inline-block; min-width: 100%; text-align: center; }
        .tree-container { transition: transform 0.3s; transform-origin: center center; display: inline-block; }
        
        /* MAGIA CSS DEL ÁRBOL MULTIDIRECCIONAL */
        .tree ul { padding-top: 30px; position: relative; transition: all 0.5s; display: flex; justify-content: center; }
        .tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 30px 10px 0 10px; transition: all 0.5s; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid var(--neon-blue); width: 50%; height: 30px; transition: border-color 0.4s; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--neon-blue); }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid var(--neon-blue); border-radius: 0 8px 0 0; }
        .tree li:first-child::after { border-radius: 8px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid var(--neon-blue); width: 0; height: 30px; transition: border-color 0.4s; }

        /* Contenedores para direcciones */
        .node-container { display: flex; flex-direction: column; align-items: center; position: relative; }
        .parents-group { display: flex; justify-content: center; margin-bottom: 20px; position: relative; }
        .parents-group::after { content: ''; position: absolute; bottom: -20px; left: 50%; border-left: 2px solid var(--neon-blue); height: 20px; }
        .parents-group:empty::after { display: none; }
        
        .horizontal-group { display: flex; justify-content: center; align-items: center; gap: 30px; position: relative; }
        .horizontal-group::before { content: ''; position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; background: var(--neon-blue); z-index: 1; transition: background 0.4s; }

        .node-card { text-decoration: none; display: inline-flex; flex-direction: column; align-items: center; padding: 15px 20px; border-radius: 12px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-glass); color: var(--text-main); min-width: 180px; transition: all 0.3s; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; z-index: 2; }
        .node-card:hover { border-color: var(--brand-orange); transform: translateY(-5px); box-shadow: 0 15px 35px rgba(255, 115, 21, 0.15); z-index: 10; }
        
        .node-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .node-photo { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; border: 1px solid var(--border-glass); overflow: hidden;}
        .node-photo img { width: 100%; height: 100%; object-fit: cover; }
        .node-photo i { font-size: 1.5rem; color: var(--neon-blue); }
        .gender-icon { font-size: 1rem; color: var(--text-muted); }
        .gender-m { color: #3b82f6; }
        .gender-f { color: #ec4899; }
        
        .node-card .nombre { font-weight: 800; font-size: 1rem; margin-bottom: 5px; }
        .node-card .rol { font-size: 0.75rem; color: var(--brand-orange); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 5px; }
        .node-card .info-extra { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px; display: flex; gap: 5px; align-items: center;}
        .node-card .fecha { font-size: 0.7rem; color: var(--text-main); background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; gap: 5px; margin-top: 5px;}

        /* MODO FAMILIAR */
        .tree.modo-familiar li::before, .tree.modo-familiar li::after, .tree.modo-familiar ul ul::before,
        .tree.modo-familiar li:last-child::before, .tree.modo-familiar li:first-child::after, .tree.modo-familiar .parents-group::after { border-color: var(--color-familiar); }
        .tree.modo-familiar .horizontal-group::before { background: var(--color-familiar); }
        .tree.modo-familiar .node-card { border-radius: 30px; border-color: rgba(236, 72, 153, 0.3); }
        .tree.modo-familiar .node-card:hover { border-color: var(--color-familiar); box-shadow: 0 10px 20px rgba(236, 72, 153, 0.2); }
        .tree.modo-familiar .node-photo i { color: var(--color-familiar); }

        .node-actions { position: absolute; top: -15px; right: -15px; display: none; gap: 5px; z-index: 15; }
        .node-card:hover .node-actions { display: flex; }
        .btn-node { background: var(--brand-orange); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s; }
        .btn-node.add { background: #10b981; } .btn-node.delete { background: #ef4444; }
        .btn-node:hover { transform: scale(1.15); }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; overflow-y: auto;}
        .modal-card { background: var(--bg-panel); border: 1px solid var(--border-glass); padding: 35px; border-radius: 20px; width: 90%; max-width: 500px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative; margin: 20px 0;}
        
        .input-form, .select-form { background: rgba(0,0,0,0.1); border: 1px solid #1e293b; color: var(--text-main); padding: 12px 15px; width: 100%; border-radius: 8px; font-size: 0.9rem; margin-bottom: 15px; outline: none; transition: border 0.3s; }
        .select-form { appearance: none; cursor: pointer; }
        body.light-mode .input-form, body.light-mode .select-form { background: #f8fafc; border-color: #cbd5e1; }
        .input-form:focus, .select-form:focus { border-color: var(--neon-blue); }
        .form-label { display: block; text-align: left; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }

        .radio-group { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .radio-btn { flex: 1; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid #1e293b; border-radius: 8px; color: var(--text-muted); cursor: pointer; transition: 0.3s; font-size: 0.75rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 80px; text-align: center;}
        .radio-btn i { font-size: 1.2rem; }
        .radio-btn.active { background: rgba(56, 189, 248, 0.1); border-color: var(--neon-blue); color: var(--neon-blue); }
        body.light-mode .radio-btn { background: #f1f5f9; border-color: #cbd5e1; }
        body.light-mode .radio-btn.active { background: #e0f2fe; border-color: var(--neon-blue); }

        .row-inputs { display: flex; gap: 15px; }
        .row-inputs > div { flex: 1; }

        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 15px;}
        .upload-btn-wrapper .btn-upload { border: 1px dashed var(--neon-blue); color: var(--neon-blue); background-color: transparent; padding: 10px 20px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s;}
        .upload-btn-wrapper:hover .btn-upload { background-color: rgba(56, 189, 248, 0.1); }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%;}

        .floating-tools { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; z-index: 100;}
        .tool-btn { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-glass); color: var(--text-main); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .tool-btn:hover { color: var(--brand-orange); transform: scale(1.1); }

        @media (max-width: 768px) {
            .topbar { justify-content: center; }
            .node-card { min-width: 140px; padding: 10px; }
            .row-inputs { flex-direction: column; gap: 0;}
        }
    </style>
</head>
<body>

    <div class="topbar">
        <button onclick="window.close()" class="btn btn-volver" id="btnCerrar"><i class="fa-solid fa-arrow-left"></i> Volver al Visor</button>
        <div class="logo-visor">
            <i class="fa-solid fa-network-wired" id="logo-icono"></i> <span id="titulo-herramienta">Árbol Sucesorio</span>
            <span class="status-badge status-demo" id="status-badge">VERSIÓN DEMO</span>
        </div>
        
        <button id="btn-modo-arbol" class="btn btn-accion" onclick="toggleModoArbol()" style="border-color: #ec4899; color: #ec4899;">
            <i class="fa-solid fa-users"></i> Cambiar a Familiar
        </button>
        <button id="btn-exportar" class="btn btn-vip" onclick="intentarExportar()"><i class="fa-solid fa-download"></i> Exportar Alta Res</button>
        <button onclick="toggleTheme()" class="btn-camaleon" id="btnTheme">
            <i class="fa-solid fa-circle-half-stroke"></i> <span id="text-theme">Modo Claro</span>
        </button>
    </div>

    <!-- WRAPPER DE EXPORTACIÓN (Para evitar fondo negro) -->
    <div class="workspace" id="workspace-area">
        <div class="export-wrapper" id="lienzo-exportar">
            <div class="tree-container tree modo-sucesorio" id="tree-root">
                <!-- El árbol dinámico se genera aquí -->
            </div>
        </div>
    </div>

    <div class="floating-tools">
        <button class="tool-btn" onclick="zoomTree(0.1)" title="Acercar"><i class="fa-solid fa-plus"></i></button>
        <button class="tool-btn" onclick="zoomTree(-0.1)" title="Alejar"><i class="fa-solid fa-minus"></i></button>
        <button class="tool-btn" onclick="resetZoom()" title="Restaurar Vista"><i class="fa-solid fa-expand"></i></button>
    </div>

    <!-- SÚPER MODAL PARA AGREGAR FAMILIARES (Con 4 Direcciones y Detalles) -->
    <div class="modal-overlay" id="modalAgregar">
        <div class="modal-card">
            <div style="position: absolute; top:0; left:0; width:100%; height:5px; background: linear-gradient(90deg, var(--neon-blue), var(--brand-orange));"></div>
            <h2 style="color: var(--text-main); margin-bottom: 20px; font-size: 1.3rem; text-align: center;"><i class="fa-solid fa-user-plus" style="color: var(--neon-blue);"></i> Añadir al Árbol</h2>
            
            <div class="upload-btn-wrapper">
                <button class="btn-upload"><i class="fa-solid fa-camera"></i> Subir Foto (Opcional)</button>
                <input type="file" name="myfile" accept="image/*" id="inputFoto" onchange="previewFoto(event)"/>
            </div>
            
            <label class="form-label">Nombre Completo</label>
            <input type="text" id="inputNombre" class="input-form" placeholder="Ej. Juan Pérez">
            
            <div class="row-inputs">
                <div>
                    <label class="form-label">Parentesco / Rol Legal</label>
                    <input type="text" id="inputRol" class="input-form" placeholder="Ej. Heredero, Cónyuge">
                </div>
                <div>
                    <label class="form-label">Estado Civil</label>
                    <select id="inputEstadoCivil" class="select-form">
                        <option value="Soltero(a)">Soltero(a)</option>
                        <option value="Casado(a)">Casado(a)</option>
                        <option value="Divorciado(a)">Divorciado(a)</option>
                        <option value="Viudo(a)">Viudo(a)</option>
                        <option value="Concubinato">Concubinato</option>
                    </select>
                </div>
            </div>

            <div class="row-inputs">
                <div>
                    <label class="form-label">Fechas (Nac / Def)</label>
                    <input type="text" id="inputFecha" class="input-form" placeholder="Ej. 1980 - 2024">
                </div>
                <div>
                    <label class="form-label">Género</label>
                    <select id="inputGenero" class="select-form">
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                        <option value="O">Otro</option>
                    </select>
                </div>
            </div>

            <label class="form-label" style="text-align: center; margin-top: 10px;">Dirección de la Rama (Dónde Ubicarlo)</label>
            <div class="radio-group">
                <div class="radio-btn" id="btnDirArriba" onclick="seleccionarDireccion('arriba')">
                    <i class="fa-solid fa-arrow-up"></i> Ascendiente (Padre/Madre)
                </div>
                <div class="radio-btn active" id="btnDirAbajo" onclick="seleccionarDireccion('abajo')">
                    <i class="fa-solid fa-arrow-down"></i> Descendiente (Hijo/Hija)
                </div>
                <div class="radio-btn" id="btnDirIzq" onclick="seleccionarDireccion('izq')">
                    <i class="fa-solid fa-arrow-left"></i> Lado Izq (Hermano/a)
                </div>
                <div class="radio-btn" id="btnDirDer" onclick="seleccionarDireccion('der')">
                    <i class="fa-solid fa-arrow-right"></i> Lado Der (Cónyuge)
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn btn-volver" style="flex: 1; justify-content: center; background: rgba(0,0,0,0.1);" onclick="cerrarModalAgregar()">Cancelar</button>
                <button class="btn btn-vip" style="flex: 1; justify-content: center;" onclick="confirmarAgregar()">Dibujar Rama</button>
            </div>
        </div>
    </div>

    <!-- MODAL VIP -->
    <div class="modal-overlay" id="modalVIP">
        <div class="modal-card" style="text-align: center;">
            <div style="position: absolute; top:0; left:0; width:100%; height:5px; background: linear-gradient(90deg, #facc15, var(--brand-orange));"></div>
            <h2 style="color: var(--text-main); margin-bottom: 15px;"><i class="fa-solid fa-gem" style="color: var(--brand-orange);"></i> Funciones Pro</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">La versión Demo solo permite 3 nodos en total. Ingresa tu token institucional para añadir ramas ilimitadas y habilitar la exportación completa.</p>
            <input type="text" id="tokenInput" class="input-form" style="text-transform: uppercase; text-align: center; font-weight: bold; font-size: 1.2rem;" placeholder="TOKEN VIP" autocomplete="off">
            <button class="btn btn-vip" style="width: 100%; justify-content: center; padding: 12px;" onclick="validarTokenVIP()">DESBLOQUEAR ILIMITADO</button>
            <button class="btn btn-volver" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="cerrarModalVIP()">Cancelar</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('text-theme').innerText = isLight ? "Modo Oscuro" : "Modo Claro";
            document.querySelector('#btnTheme i').className = isLight ? "fa-solid fa-moon" : "fa-solid fa-circle-half-stroke";
            localStorage.setItem('tema', isLight ? 'light' : 'dark');
        }

        // Estructura de Nodo Multidireccional: parents (arriba), spousesIzq (lado izq), spousesDer (lado der), children (abajo)
        let treeSucesorio = { id: 1, nombre: "Expediente / Caso", rol: "Raíz Principal", fecha: "", genero: "M", estadoCivil: "N/A", icon: "fa-folder-open", fotoUrl: null, parents: [], spousesIzq: [], spousesDer: [], children: [] };
        let treeFamiliar = { id: 2, nombre: "Raíz Familiar", rol: "Origen", fecha: "", genero: "O", estadoCivil: "N/A", icon: "fa-house-chimney", fotoUrl: null, parents: [], spousesIzq: [], spousesDer: [], children: [] };
        
        let esModoFamiliar = false;
        let esProActivado = localStorage.getItem('pro_activo') === 'true'; 
        let scale = 1;
        let direccionSeleccionada = 'abajo';
        let fotoTemporalUrl = null;

        window.onload = () => { 
            if(localStorage.getItem('tema') === 'light') toggleTheme(); 
            if(esProActivado) {
                const badge = document.getElementById('status-badge');
                badge.className = 'status-badge status-pro'; badge.innerText = 'PRO ACTIVA';
            }
            const datosArbolIA = localStorage.getItem('datos_arbol_45ymas');
            if(datosArbolIA) {
                const infoExtraida = JSON.parse(datosArbolIA);
                treeSucesorio.nombre = infoExtraida.nombre;
                treeSucesorio.rol = infoExtraida.rol;
                treeSucesorio.fecha = infoExtraida.fecha;
            }
            renderTree(); 
            if(window.history.length <= 1) {
                document.getElementById('btnCerrar').innerHTML = '<i class="fa-solid fa-times"></i> Cerrar Pestaña';
            } else {
                document.getElementById('btnCerrar').onclick = () => { window.location.href = 'iurisvisor.html'; };
            }
        };

        function toggleModoArbol() {
            esModoFamiliar = !esModoFamiliar;
            const treeRoot = document.getElementById('tree-root');
            const btnModo = document.getElementById('btn-modo-arbol');
            
            if(esModoFamiliar) {
                treeRoot.classList.replace('modo-sucesorio', 'modo-familiar');
                btnModo.innerHTML = '<i class="fa-solid fa-scale-balanced"></i> Cambiar a Sucesorio';
                btnModo.style.borderColor = "var(--neon-blue)"; btnModo.style.color = "var(--neon-blue)";
                document.getElementById('titulo-herramienta').innerText = "Árbol Genealógico";
                document.getElementById('logo-icono').className = "fa-solid fa-people-group"; document.getElementById('logo-icono').style.color = "var(--color-familiar)";
            } else {
                treeRoot.classList.replace('modo-familiar', 'modo-sucesorio');
                btnModo.innerHTML = '<i class="fa-solid fa-users"></i> Cambiar a Familiar';
                btnModo.style.borderColor = "#ec4899"; btnModo.style.color = "#ec4899";
                document.getElementById('titulo-herramienta').innerText = "Árbol Sucesorio";
                document.getElementById('logo-icono').className = "fa-solid fa-network-wired"; document.getElementById('logo-icono').style.color = "#22c55e";
            }
            renderTree(); 
        }

        // ====== RENDERIZADO DEL SÚPER ÁRBOL ======
        function renderTree() {
            const rootContainer = document.getElementById('tree-root');
            rootContainer.innerHTML = '';
            const ul = document.createElement('ul');
            const currentData = esModoFamiliar ? treeFamiliar : treeSucesorio;
            ul.appendChild(createNodeElement(currentData));
            rootContainer.appendChild(ul);
        }

        function createNodeElement(node) {
            const li = document.createElement('li');
            const nodeContainer = document.createElement('div');
            nodeContainer.className = 'node-container';
            
            // 1. DIBUJAR PADRES (Arriba)
            if(node.parents && node.parents.length > 0) {
                const parentsGroup = document.createElement('div');
                parentsGroup.className = 'parents-group horizontal-group';
                node.parents.forEach(parent => {
                    parentsGroup.appendChild(crearTarjetaHTML(parent, 'arriba', node.id));
                });
                nodeContainer.appendChild(parentsGroup);
            }

            // 2. DIBUJAR EL GRUPO HORIZONTAL (Lado Izq + Nodo Central + Lado Der)
            const horizontalGroup = document.createElement('div');
            horizontalGroup.className = 'horizontal-group';
            
            // Hermanos / Parejas Izquierda
            if(node.spousesIzq && node.spousesIzq.length > 0) {
                node.spousesIzq.forEach(spouse => {
                    horizontalGroup.appendChild(crearTarjetaHTML(spouse, 'izq', node.id));
                });
            }

            // Nodo Central
            horizontalGroup.appendChild(crearTarjetaHTML(node, 'central'));

            // Parejas Derecha
            if(node.spousesDer && node.spousesDer.length > 0) {
                node.spousesDer.forEach(spouse => {
                    horizontalGroup.appendChild(crearTarjetaHTML(spouse, 'der', node.id));
                });
            }
            
            nodeContainer.appendChild(horizontalGroup);
            li.appendChild(nodeContainer);

            // 3. DIBUJAR DESCENDIENTES (Abajo)
            if (node.children && node.children.length > 0) {
                const ul = document.createElement('ul');
                node.children.forEach(child => ul.appendChild(createNodeElement(child)) );
                li.appendChild(ul);
            }
            return li;
        }

        function crearTarjetaHTML(data, tipoRelacion, parentIdOriginal = null) {
            const card = document.createElement('div');
            card.className = 'node-card';
            
            // Botones
            let btnAgregarHTML = (tipoRelacion === 'central') ? `<button class="btn-node add" title="Agregar Rama" onclick="abrirModalAgregar(${data.id}, event)"><i class="fa-solid fa-plus"></i></button>` : '';
            let btnEliminarHTML = (data.id !== 1 && data.id !== 2) ? `<button class="btn-node delete" title="Eliminar" onclick="eliminarNodo(${data.id}, '${tipoRelacion}', ${parentIdOriginal}, event)"><i class="fa-solid fa-trash"></i></button>` : '';

            // Icono de Género
            let genderClass = 'fa-genderless';
            let genderColorClass = '';
            if(data.genero === 'M') { genderClass = 'fa-mars'; genderColorClass = 'gender-m'; }
            if(data.genero === 'F') { genderClass = 'fa-venus'; genderColorClass = 'gender-f'; }

            // Foto o Icono
            let visualHTML = data.fotoUrl 
                ? `<div class="node-photo"><img src="${data.fotoUrl}" alt="foto"></div>`
                : `<div class="node-photo"><i class="fa-solid ${data.icon}"></i></div>`;

            let fechaHTML = data.fecha ? `<div class="fecha"><i class="fa-regular fa-calendar"></i> ${data.fecha}</div>` : '';

            card.innerHTML = `
                <div class="node-actions">${btnAgregarHTML}${btnEliminarHTML}</div>
                <div class="node-header">
                    ${visualHTML}
                    <i class="fa-solid ${genderClass} gender-icon ${genderColorClass}" title="Género"></i>
                </div>
                <div class="nombre">${data.nombre}</div>
                <div class="rol">${data.rol}</div>
                <div class="info-extra"><i class="fa-solid fa-ring"></i> ${data.estadoCivil}</div>
                ${fechaHTML}
            `;
            return card;
        }

        // ====== LÓGICA DEL FORMULARIO ======
        function seleccionarDireccion(dir) {
            direccionSeleccionada = dir;
            document.querySelectorAll('.radio-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btnDir${dir.charAt(0).toUpperCase() + dir.slice(1)}`).classList.add('active');
        }

        function previewFoto(event) {
            const file = event.target.files[0];
            if(file) {
                fotoTemporalUrl = URL.createObjectURL(file);
                document.querySelector('.btn-upload').innerHTML = '<i class="fa-solid fa-check"></i> Foto Lista';
            }
        }

        function contarNodos(tree) {
            let count = 1; 
            if(tree.spousesIzq) count += tree.spousesIzq.length;
            if(tree.spousesDer) count += tree.spousesDer.length;
            if(tree.parents) count += tree.parents.length;
            if(tree.children) { tree.children.forEach(c => count += contarNodos(c)); }
            return count;
        }

        function abrirModalAgregar(parentId, event) {
            event.stopPropagation();
            const currentTree = esModoFamiliar ? treeFamiliar : treeSucesorio;
            
            if (!esProActivado && contarNodos(currentTree) >= 3) { verificarVIP(); return; }
            
            parentIdTemp = parentId;
            document.getElementById('inputNombre').value = '';
            document.getElementById('inputRol').value = '';
            document.getElementById('inputFecha').value = '';
            document.getElementById('inputEstadoCivil').value = 'Soltero(a)';
            document.getElementById('inputGenero').value = 'M';
            document.querySelector('.btn-upload').innerHTML = '<i class="fa-solid fa-camera"></i> Subir Foto (Opcional)';
            document.getElementById('inputFoto').value = '';
            fotoTemporalUrl = null;
            
            seleccionarDireccion('abajo'); 
            document.getElementById('modalAgregar').style.display = 'flex';
            document.getElementById('inputNombre').focus();
        }

        function cerrarModalAgregar() { document.getElementById('modalAgregar').style.display = 'none'; parentIdTemp = null; }

        function confirmarAgregar() {
            const nombre = document.getElementById('inputNombre').value.trim();
            const rol = document.getElementById('inputRol').value.trim();
            const fecha = document.getElementById('inputFecha').value.trim();
            const civil = document.getElementById('inputEstadoCivil').value;
            const genero = document.getElementById('inputGenero').value;
            
            if(!nombre || !rol) { alert("Nombre y Rol son obligatorios."); return; }
            
            let icon = "fa-user";
            if(rol.toLowerCase().includes('cónyuge') || rol.toLowerCase().includes('espos')) icon = "fa-rings-wedding";
            if(rol.toLowerCase().includes('hijo') || rol.toLowerCase().includes('niet')) icon = "fa-child";
            
            const newNode = { 
                id: Date.now(), nombre: nombre, rol: rol, fecha: fecha, genero: genero, estadoCivil: civil, 
                icon: icon, fotoUrl: fotoTemporalUrl, parents: [], spousesIzq: [], spousesDer: [], children: [] 
            };
            
            const currentTree = esModoFamiliar ? treeFamiliar : treeSucesorio;
            
            if(direccionSeleccionada === 'abajo') addChildToNode(currentTree, parentIdTemp, newNode);
            else if(direccionSeleccionada === 'arriba') agregarLateral(currentTree, parentIdTemp, newNode, 'parents');
            else if(direccionSeleccionada === 'izq') agregarLateral(currentTree, parentIdTemp, newNode, 'spousesIzq');
            else if(direccionSeleccionada === 'der') agregarLateral(currentTree, parentIdTemp, newNode, 'spousesDer');
            
            cerrarModalAgregar();
            renderTree();
        }

        function addChildToNode(currentNode, parentId, newNode) {
            if (currentNode.id === parentId) { currentNode.children.push(newNode); return true; }
            if (currentNode.children) { for (let child of currentNode.children) { if (addChildToNode(child, parentId, newNode)) return true; } }
            return false;
        }

        function agregarLateral(currentNode, parentId, newNode, arrayName) {
            if (currentNode.id === parentId) { 
                if(!currentNode[arrayName]) currentNode[arrayName] = [];
                currentNode[arrayName].push(newNode); return true; 
            }
            if (currentNode.children) { for (let child of currentNode.children) { if (agregarLateral(child, parentId, newNode, arrayName)) return true; } }
            return false;
        }

        function eliminarNodo(nodeId, tipoRelacion, parentIdOriginal, event) {
            event.stopPropagation();
            if(confirm("¿Eliminar este registro y su descendencia?")) { 
                const currentTree = esModoFamiliar ? treeFamiliar : treeSucesorio;
                if(tipoRelacion === 'central') removeChild(currentTree, nodeId);
                else eliminarLateral(currentTree, parentIdOriginal, nodeId, tipoRelacion); 
                renderTree(); 
            }
        }

        function removeChild(currentNode, idToRemove) {
            if (currentNode.children) {
                const index = currentNode.children.findIndex(c => c.id === idToRemove);
                if (index > -1) { currentNode.children.splice(index, 1); return true; }
                for (let child of currentNode.children) { if (removeChild(child, idToRemove)) return true; }
            }
            return false;
        }

        function eliminarLateral(currentNode, parentId, idToRemove, arrayName) {
            // Mapeamos el tipoRelacion al nombre del array en el objeto
            let propName = arrayName;
            if(arrayName === 'arriba') propName = 'parents';
            if(arrayName === 'izq') propName = 'spousesIzq';
            if(arrayName === 'der') propName = 'spousesDer';

            if (currentNode.id === parentId && currentNode[propName]) {
                const index = currentNode[propName].findIndex(s => s.id === idToRemove);
                if(index > -1) { currentNode[propName].splice(index, 1); return true; }
            }
            if (currentNode.children) { for (let child of currentNode.children) { if (eliminarLateral(child, parentId, idToRemove, propName)) return true; } }
            return false;
        }

        // ====== ZOOM Y ARRASTRE ======
        function zoomTree(delta) { scale = Math.max(0.3, Math.min(2.5, scale + delta)); document.getElementById('tree-root').style.transform = `scale(${scale})`; }
        function resetZoom() { scale = 1; document.getElementById('tree-root').style.transform = `scale(1)`; }

        // ====== VIP Y EXPORTACIÓN ULTRA RESISTENTE ======
        function verificarVIP() { document.getElementById('modalVIP').style.display = 'flex'; }
        function cerrarModalVIP() { document.getElementById('modalVIP').style.display = 'none'; }
        
        function validarTokenVIP() {
            if(document.getElementById('tokenInput').value.trim().toUpperCase() === "45YMAS") {
                esProActivado = true; localStorage.setItem('pro_activo', 'true'); cerrarModalVIP();
                const badge = document.getElementById('status-badge');
                badge.className = 'status-badge status-pro'; badge.innerText = 'PRO ACTIVA';
            } else { alert("Acceso Denegado. Token inválido."); }
        }

        function intentarExportar() {
            if(!esProActivado) { verificarVIP(); return; }
            const btnExp = document.getElementById('btn-exportar');
            btnExp.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Guardando...';
            
            window.scrollTo(0,0); 
            const zoomOriginal = scale;
            resetZoom(); 

            const wrapper = document.getElementById('lienzo-exportar');
            const treeRoot = document.getElementById('tree-root');
            const themeBg = document.body.classList.contains('light-mode') ? "#f8fafc" : "#050810";
            
            wrapper.style.background = themeBg;
            wrapper.style.width = 'max-content'; // Forzar que abarque ramas grandes horizontales

            setTimeout(() => {
                html2canvas(wrapper, { 
                    backgroundColor: themeBg, 
                    scale: 2, 
                    useCORS: true,
                    logging: false,
                    windowWidth: wrapper.scrollWidth,
                    windowHeight: wrapper.scrollHeight
                }).then(canvas => {
                    const link = document.createElement('a'); 
                    link.download = esModoFamiliar ? 'Arbol_Familiar_45yMas.png' : 'Arbol_Sucesorio_45yMas.png'; 
                    link.href = canvas.toDataURL("image/png"); 
                    link.click();
                    
                    wrapper.style.background = 'transparent'; 
                    wrapper.style.width = '100%';
                    btnExp.innerHTML = '<i class="fa-solid fa-download"></i> Exportar Alta Res';
                    if(zoomOriginal !== 1) zoomTree(zoomOriginal - 1); 
                }).catch(err => {
                    wrapper.style.background = 'transparent'; wrapper.style.width = '100%';
                    btnExp.innerHTML = '<i class="fa-solid fa-download"></i> Exportar Alta Res';
                    alert("Error en la captura de pantalla.");
                });
            }, 500);
        }
    </script>
</body>
