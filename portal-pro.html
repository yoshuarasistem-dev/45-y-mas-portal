<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bóveda Pro | Gestión MASC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-deep: #050810; --bg-panel: #0f172a; --glass-bg: rgba(15, 23, 42, 0.85); --brand-orange: #ff7315; --neon-blue: #38bdf8; --border-glass: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-muted: #94a3b8; --success: #10b981; --danger: #ef4444; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .logo-oficial { display: flex; flex-direction: column; align-items: flex-start;}
        .logo-oficial img { max-height: 45px; object-fit: contain; margin-bottom: 2px; display:block;}
        .logo-oficial .sub-brand { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; z-index: 50; position: absolute; background: var(--bg-deep); }
        .login-box { background: var(--glass-bg); padding: 50px 40px; border-radius: 16px; border: 1px solid var(--border-glass); text-align: center; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .input-login, .select-login { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 1rem; outline: none; }
        .input-login:focus, .select-login:focus { border-color: var(--brand-orange); }
        .btn-login { width: 100%; background: linear-gradient(135deg, var(--brand-orange), #d95d0b); border: none; color: white; padding: 15px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: transform 0.2s; margin-top: 10px; }
        .btn-login:hover { transform: translateY(-2px); }
        
        #dashboard-screen { display: none; height: 100vh; flex-direction: column; }
        .topbar { background: rgba(15, 23, 42, 0.9); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); }
        .btn-logout { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 8px;}
        .btn-logout:hover { background: rgba(239, 68, 68, 0.1); }
        .btn-home { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; text-decoration: none; display: flex; align-items: center; gap: 8px;}
        .btn-home:hover { background: rgba(56, 189, 248, 0.1); }

        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border-glass); display: flex; flex-direction: column; padding: 20px 0; }
        .menu-item { padding: 15px 25px; color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.3s; border-left: 3px solid transparent; }
        .menu-item:hover, .menu-item.active { background: rgba(56, 189, 248, 0.1); color: var(--neon-blue); border-left-color: var(--neon-blue); }
        
        .folder-area { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg-deep); display: flex; flex-direction: column;}
        .section-header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-glass); padding-bottom: 15px;}
        .section-title { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; margin: 0; }
        
        .grid-carpetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 30px;}
        .carpeta-card { background: var(--glass-bg); border: 1px solid var(--border-glass); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;}
        .carpeta-card:hover { transform: translateY(-5px); border-color: var(--brand-orange); box-shadow: 0 10px 20px rgba(255, 115, 21, 0.1); }
        .carpeta-card i.folder-icon { font-size: 3rem; color: var(--neon-blue); margin-bottom: 15px; }
        .carpeta-card img.center-logo { height: 50px; margin-bottom: 10px; object-fit: contain; border-radius: 4px; }
        .carpeta-card .titulo { font-weight: 700; color: var(--text-main); margin-bottom: 5px; font-size: 1rem;}
        .carpeta-card .subtitulo { font-size: 0.75rem; color: var(--text-muted); }
        
        /* PANEL DE GESTIÓN MASC ESTRICTO MANUAL */
        .gestion-box { background: var(--bg-panel); border: 1px solid var(--border-glass); border-radius: 12px; padding: 30px; margin-bottom: 30px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media(max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .form-group label { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
        .form-input { background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); color: white; padding: 12px; border-radius: 8px; font-size: 0.95rem; outline: none; }
        .form-input:focus { border-color: var(--brand-orange); }

        .docs-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .docs-table th, .docs-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-glass); font-size: 0.9rem; }
        .docs-table th { color: var(--brand-orange); background: rgba(0,0,0,0.2); }
        
        .btn-upload { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.3s; display: inline-flex; align-items: center; gap: 6px;}
        .btn-upload:hover { background: var(--neon-blue); color: #000; }
        .btn-view { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); color: var(--success); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.3s; }
        .btn-view:hover { background: var(--success); color: #fff; }

        /* MODAL VISOR INDIVIDUAL DE PDF */
        .modal { display: none; position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-visor-content { background: var(--bg-panel); border: 1px solid var(--border-glass); width: 85vw; height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-visor-header { padding: 15px 25px; background: rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); }
        .modal-visor-body { flex: 1; background: #1e293b; display: flex; justify-content: center; align-items: center; overflow: auto; padding: 20px; }
        .modal-visor-body iframe { width: 100%; height: 100%; border: none; border-radius: 6px; background: white; }

        .actividad-container { margin-top: auto; background: var(--bg-panel); border: 1px solid var(--border-glass); border-radius: 12px; padding: 20px; }
        .actividad-header { font-size: 1rem; font-weight: bold; color: var(--brand-orange); margin-bottom: 15px; border-bottom: 1px solid var(--border-glass); padding-bottom: 10px;}
        .actividad-item { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.02); padding: 10px 15px; border-radius: 8px; border-left: 3px solid var(--neon-blue); font-size: 0.85rem;}
        .actividad-item i { color: var(--text-muted); font-size: 1.2rem; width: 25px; text-align: center;}
        .actividad-item .detalles { flex: 1; }
        .actividad-item .titulo-act { color: var(--text-main); font-weight: 600; }
        .actividad-item .fecha-act { color: var(--text-muted); font-size: 0.75rem; }

        .breadcrumb { display: flex; gap: 10px; color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .breadcrumb span:hover { color: var(--brand-orange); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <div class="logo-oficial" style="align-items: center; margin-bottom: 25px;">
                <img src="assets/LOGO.png" onerror="this.outerHTML='<h1 style=\\\'color:var(--brand-orange); font-size:2rem;\\\'>45 Y MÁS</h1>'" alt="45 Y MÁS">
                <div class="sub-brand">Acreditación 065 • IJA Jalisco</div>
            </div>
            <p style="color:var(--brand-orange); font-weight:bold; margin-bottom: 20px;">Bóveda Confidencial</p>
            <input type="text" id="user" class="input-login" placeholder="Usuario (admin)">
            <input type="password" id="pass" class="input-login" placeholder="Contraseña (45ymas)">
            <button class="btn-login" onclick="iniciarSesion()">INGRESAR</button>
            <p id="error-msg" style="color: #ef4444; margin-top: 15px; display: none; font-weight: bold;">Credenciales incorrectas.</p>
        </div>
    </div>

    <div id="dashboard-screen">
        <div class="topbar">
            <div class="logo-oficial" style="flex-direction: row; align-items: center; gap:15px;">
                <img src="assets/LOGO.png" onerror="this.outerHTML='<h1 style=\\\'font-weight:900; font-size:1.2rem; color:var(--brand-orange); margin:0;\\\'>45 Y MÁS</h1>'" alt="45 Y MÁS" style="max-height: 40px; margin:0;">
                <span style="font-size: 0.9rem; font-weight: 500; color: var(--text-muted); border-left: 1px solid var(--border-glass); padding-left: 15px;">Gestor MASC Manual</span>
            </div>
            <div style="display:flex; gap: 15px;">
                <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> Volver a Inicio</a>
                <button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="menu-item active" id="menu-masc" onclick="mostrarSeccion('masc')"><i class="fa-solid fa-handshake"></i> Convenios MASC</div>
            </div>
            <div class="folder-area" id="area-trabajo"></div>
        </div>
    </div>

    <!-- MODAL VISOR INDIVIDUAL DE PDF -->
    <div class="modal" id="modal-visor-pdf">
        <div class="modal-visor-content">
            <div class="modal-visor-header">
                <h3 id="visor-titulo-doc" style="color: var(--neon-blue); font-size: 1.1rem;">Visualizando Documento</h3>
                <button class="btn-logout" onclick="cerrarVisorPDF()"><i class="fa-solid fa-xmark"></i> Cerrar</button>
            </div>
            <div class="modal-visor-body">
                <iframe id="iframe-pdf-visor" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        let nivelActual = 0;
        let pathMasc = { centro: '', anio: '', tipo: '', indexExp: null };
        const tiposMascObj = { "ARRENDAMIENTO": "Preventivo Arrendamiento", "ALIMENTOS": "Alimentos y Convivencia", "DIVORCIO": "Divorcio Admtvo. y Mutuo" };

        function registrarActividad(accion, detalle) {
            let act = JSON.parse(localStorage.getItem('actividad_reciente')) || [];
            let fecha = new Date().toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });
            act.unshift({ accion: accion, detalle: detalle, fecha: fecha, icon: 'fa-folder-open' });
            if(act.length > 5) act.pop(); 
            localStorage.setItem('actividad_reciente', JSON.stringify(act));
        }

        function generarHTMLActividad() {
            let act = JSON.parse(localStorage.getItem('actividad_reciente')) || [];
            if(act.length === 0) return '';
            let htmlList = act.map(a => `
                <div class="actividad-item"><i class="fa-solid ${a.icon}"></i><div class="detalles"><div class="titulo-act">${a.accion}</div><div class="fecha-act">${a.detalle} - ${a.fecha}</div></div></div>
            `).join('');
            return `<div class="actividad-container" style="margin-top:40px;"><div class="actividad-header"><i class="fa-solid fa-clock-rotate-left"></i> Actividad Reciente</div><div class="actividad-list">${htmlList}</div></div>`;
        }

        function iniciarSesion() {
            const u = document.getElementById('user').value; const p = document.getElementById('pass').value;
            if(u === 'admin' && p === '45ymas') {
                document.getElementById('login-screen').style.display = 'none'; document.getElementById('dashboard-screen').style.display = 'flex'; mostrarSeccion('masc');
            } else { document.getElementById('error-msg').style.display = 'block'; }
        }
        function cerrarSesion() { location.reload(); }
        function mostrarSeccion(seccion) { nivelActual = 0; renderizarVista(); }

        function renderizarVista() {
            const area = document.getElementById('area-trabajo');
            let html = '';

            if (nivelActual === 0) {
                html += `<div class="section-header-box"><div class="section-title"><i class="fa-solid fa-handshake"></i> Centros de Mediación MASC</div></div><div class="grid-carpetas">`;
                let centros = ["Centro 065", "Centro 353"];
                centros.forEach(c => { 
                    html += `<div class="carpeta-card" onclick="entrarNivel(1, '${c}')"><img src="assets/logo45.jpeg" class="center-logo" onerror="this.outerHTML='<i class=\\\'fa-solid fa-building folder-icon\\\' style=\\\'color:var(--brand-orange);\\\'></i>'"><div class="titulo">${c}</div><div class="subtitulo">Sede Activa</div></div>`;
                });
                html += `</div>${generarHTMLActividad()}`;
            }
            else if (nivelActual === 1) {
                html += `<div class="breadcrumb" onclick="entrarNivel(0)"><i class="fa-solid fa-arrow-left"></i> Volver a Centros</div>`;
                html += `<div class="section-title" style="margin-bottom:20px;">${pathMasc.centro} > Años</div><div class="grid-carpetas">`;
                ["2026", "2025", "2024", "2023", "2022", "2021", "2020"].forEach(a => { html += `<div class="carpeta-card" onclick="entrarNivel(2, '${a}')"><i class="fa-solid fa-calendar folder-icon" style="color:var(--brand-orange);"></i><div class="titulo">${a}</div><div class="subtitulo">Año Judicial</div></div>`; });
                html += `</div>`;
            }
            else if (nivelActual === 2) {
                html += `<div class="breadcrumb" onclick="entrarNivel(1)"><i class="fa-solid fa-arrow-left"></i> Volver a Años</div>`;
                html += `<div class="section-title" style="margin-bottom:20px;">${pathMasc.centro} > ${pathMasc.anio} > Tipos de Convenio</div><div class="grid-carpetas">`;
                for(let key in tiposMascObj) { html += `<div class="carpeta-card" onclick="entrarNivel(3, '${key}')"><i class="fa-solid fa-folder-open folder-icon" style="color:var(--brand-orange);"></i><div class="titulo">${tiposMascObj[key]}</div><div class="subtitulo">Categoría MASC</div></div>`; }
                html += `</div>`;
            }
            else if (nivelActual === 3) {
                html += `<div class="breadcrumb" onclick="entrarNivel(2)"><i class="fa-solid fa-arrow-left"></i> Volver a Tipos</div>`;
                html += `<div class="section-header-box"><div class="section-title">${pathMasc.centro} > ${pathMasc.anio} > ${tiposMascObj[pathMasc.tipo]}</div><button class="btn-upload" onclick="crearNuevoExpedienteMASC()"><i class="fa-solid fa-plus"></i> Nuevo Expediente</button></div>`;
                html += `<div class="grid-carpetas">`;
                
                let mascs = JSON.parse(localStorage.getItem('masc_list_manual')) || [];
                mascs.forEach((m, i) => { 
                    if(m.centro === pathMasc.centro && m.anio === pathMasc.anio && m.tipo === pathMasc.tipo) {
                        html += `<div class="carpeta-card" onclick="abrirGestionExpediente(${i})"><i class="fa-solid fa-file-contract folder-icon" style="color:var(--success);"></i><div class="titulo">${m.numero}</div><div class="subtitulo">${m.solicitante || 'Sin Solicitante'}</div></div>`; 
                    }
                });
                html += `</div>`;
            }
            else if (nivelActual === 4) {
                // PANEL DE GESTIÓN ESTRICTO MANUAL
                let mascs = JSON.parse(localStorage.getItem('masc_list_manual')) || [];
                let m = mascs[pathMasc.indexExp];

                html += `
                <div class="breadcrumb" onclick="entrarNivel(3)"><i class="fa-solid fa-arrow-left"></i> Volver a Expedientes</div>
                <div class="section-header-box"><div class="section-title"><i class="fa-solid fa-folder-tree"></i> Expediente: ${m.numero}</div></div>
                
                <div class="gestion-box">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre del Solicitante:</label>
                            <input type="text" class="form-input" id="input-solicitante" value="${m.solicitante || ''}" onchange="guardarCampoExpediente(${pathMasc.indexExp}, 'solicitante', this.value)" placeholder="Nombre completo">
                        </div>
                        <div class="form-group">
                            <label>Recomendado o Patrocinado por:</label>
                            <input type="text" class="form-input" id="input-patrocinado" value="${m.patrocinado || ''}" onchange="guardarCampoExpediente(${pathMasc.indexExp}, 'patrocinado', this.value)" placeholder="Ej. Eduviges">
                        </div>
                    </div>

                    <h4 style="color:var(--brand-orange); margin: 20px 0 10px 0; font-size:1rem;"><i class="fa-solid fa-file-pdf"></i> Documentación Obligatoria MASC</h4>
                    
                    <table class="docs-table">
                        <tr>
                            <th>Documento Requerido</th>
                            <th>Estado / Archivo</th>
                            <th>Acción Manual</th>
                        </tr>
                        <tr>
                            <td><strong>1. Solicitud firmada</strong></td>
                            <td>${m.docs && m.docs.solicitud ? '✅ Cargado' : '❌ Pendiente'}</td>
                            <td>
                                <input type="file" id="file-solicitud" accept="application/pdf" style="display:none" onchange="subirDocManual(${pathMasc.indexExp}, 'solicitud', event)">
                                <button class="btn-upload" onclick="document.getElementById('file-solicitud').click()">Súbela</button>
                                ${m.docs && m.docs.solicitud ? `<button class="btn-view" onclick="verDocumento('${m.docs.solicitud}', 'Solicitud Firmada')">Ver</button>` : ''}
                            </td>
                        </tr>
                        <tr>
                            <td><strong>2. Dictamen de viabilidad</strong></td>
                            <td>${m.docs && m.docs.dictamen ? '✅ Cargado' : '❌ Pendiente'}</td>
                            <td>
                                <input type="file" id="file-dictamen" accept="application/pdf" style="display:none" onchange="subirDocManual(${pathMasc.indexExp}, 'dictamen', event)">
                                <button class="btn-upload" onclick="document.getElementById('file-dictamen').click()">Cargue el PDF</button>
                                ${m.docs && m.docs.dictamen ? `<button class="btn-view" onclick="verDocumento('${m.docs.dictamen}', 'Dictamen de Viabilidad')">Ver</button>` : ''}
                            </td>
                        </tr>
                        <tr>
                            <td><strong>3. Acuerdo de confidencialidad</strong></td>
                            <td>${m.docs && m.docs.acuerdo ? '✅ Cargado' : '❌ Pendiente'}</td>
                            <td>
                                <input type="file" id="file-acuerdo" accept="application/pdf" style="display:none" onchange="subirDocManual(${pathMasc.indexExp}, 'acuerdo', event)">
                                <button class="btn-upload" onclick="document.getElementById('file-acuerdo').click()">Cargar PDF</button>
                                ${m.docs && m.docs.acuerdo ? `<button class="btn-view" onclick="verDocumento('${m.docs.acuerdo}', 'Acuerdo de Confidencialidad')">Ver</button>` : ''}
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <strong>4. Convenio final</strong><br>
                                <label style="font-size:0.75rem; color:var(--text-muted); cursor:pointer;"><input type="checkbox" ${m.firmadoPartes ? 'checked' : ''} onchange="toggleFirmado(${pathMasc.indexExp}, this.checked)"> Firmado por las partes</label>
                            </td>
                            <td>${m.docs && m.docs.convenio ? '✅ Cargado' : '❌ Pendiente'}</td>
                            <td>
                                <input type="file" id="file-convenio" accept="application/pdf" style="display:none" onchange="subirDocManual(${pathMasc.indexExp}, 'convenio', event)">
                                <button class="btn-upload" onclick="document.getElementById('file-convenio').click()">Cargar PDF</button>
                                ${m.docs && m.docs.convenio ? `<button class="btn-view" onclick="verDocumento('${m.docs.convenio}', 'Convenio Final')">Ver</button>` : ''}
                            </td>
                        </tr>
                        <tr>
                            <td><strong>5. Convenio digital (Word exclusivo almacenamiento)</strong></td>
                            <td>${m.docs && m.docs.word ? '✅ Almacenado' : '❌ Pendiente'}</td>
                            <td>
                                <input type="file" id="file-word" accept=".doc, .docx" style="display:none" onchange="subirDocManual(${pathMasc.indexExp}, 'word', event)">
                                <button class="btn-upload" onclick="document.getElementById('file-word').click()">Cargar Word</button>
                            </td>
                        </tr>
                        <tr>
                            <td><strong>6. Identificaciones</strong></td>
                            <td>${m.docs && m.docs.identificaciones ? '✅ Cargado' : '❌ Pendiente'}</td>
                            <td>
                                <input type="file" id="file-ident" accept="application/pdf" style="display:none" onchange="subirDocManual(${pathMasc.indexExp}, 'identificaciones', event)">
                                <button class="btn-upload" onclick="document.getElementById('file-ident').click()">Cárgalas</button>
                                ${m.docs && m.docs.identificaciones ? `<button class="btn-view" onclick="verDocumento('${m.docs.identificaciones}', 'Identificaciones')">Ver</button>` : ''}
                            </td>
                        </tr>
                        <tr>
                            <td><strong>7. Actas de nacimiento</strong></td>
                            <td>${m.docs && m.docs.actas ? '✅ Cargado' : '❌ Pendiente'}</td>
                            <td>
                                <input type="file" id="file-actas" accept="application/pdf" style="display:none" onchange="subirDocManual(${pathMasc.indexExp}, 'actas', event)">
                                <button class="btn-upload" onclick="document.getElementById('file-actas').click()">Cárgalas</button>
                                ${m.docs && m.docs.actas ? `<button class="btn-view" onclick="verDocumento('${m.docs.actas}', 'Actas de Nacimiento')">Ver</button>` : ''}
                            </td>
                        </tr>
                    </table>

                    <h4 style="color:var(--brand-orange); margin: 30px 0 10px 0; font-size:1rem;"><i class="fa-solid fa-gavel"></i> Resoluciones y Tiempos del IJA</h4>
                    
                    <div class="form-row">
                        <div class="form-group" style="background:rgba(0,0,0,0.2); padding:15px; border-radius:8px;">
                            <label><input type="checkbox" ${m.prevencionActiva ? 'checked' : ''} onchange="toggleResolucion(${pathMasc.indexExp}, 'prevencion', this.checked)"> Marcar Prevención</label>
                            ${m.prevencionActiva ? `
                                <p style="font-size:0.8rem; color:var(--text-muted); margin-top:5px;">Contestación cargada: ${m.docs && m.docs.contestacionPrevencion ? '✅ Sí' : '❌ No'}</p>
                                <input type="file" id="file-contestacion" accept="application/pdf" style="display:none" onchange="subirDocManual(${pathMasc.indexExp}, 'contestacionPrevencion', event)">
                                <button class="btn-upload" style="margin-top:8px;" onclick="document.getElementById('file-contestacion').click()">Cárgala en PDF</button>
                                ${m.docs && m.docs.contestacionPrevencion ? `<button class="btn-view" style="margin-top:8px;" onclick="verDocumento('${m.docs.contestacionPrevencion}', 'Contestación de Prevención')">Ver</button>` : ''}
                            ` : ''}
                        </div>

                        <div class="form-group" style="background:rgba(0,0,0,0.2); padding:15px; border-radius:8px;">
                            <label><input type="checkbox" ${m.validacionActiva ? 'checked' : ''} onchange="toggleResolucion(${pathMasc.indexExp}, 'validacion', this.checked)"> Validado / No Hubo Sanción</label>
                            ${m.validacionActiva ? `
                                <p style="font-size:0.8rem; color:var(--text-muted); margin-top:5px;">Documento de validación: ${m.docs && m.docs.documentoValidacion ? '✅ Sí' : '❌ No'}</p>
                                <input type="file" id="file-validacion" accept="application/pdf" style="display:none" onchange="subirDocManual(${pathMasc.indexExp}, 'documentoValidacion', event)">
                                <button class="btn-upload" style="margin-top:8px;" onclick="document.getElementById('file-validacion').click()">Cárgala en PDF</button>
                                ${m.docs && m.docs.documentoValidacion ? `<button class="btn-view" style="margin-top:8px;" onclick="verDocumento('${m.docs.documentoValidacion}', 'Documento de Validación IJA')">Ver</button>` : ''}
                            ` : ''}
                        </div>
                    </div>

                </div>`;
            }
            area.innerHTML = html;
        }

        function entrarNivel(nivel, valor='') {
            nivelActual = nivel;
            if(nivel === 1) pathMasc.centro = valor;
            if(nivel === 2) pathMasc.anio = valor;
            if(nivel === 3) pathMasc.tipo = valor;
            renderizarVista();
        }

        function crearNuevoExpedienteMASC() {
            let solicitante = prompt("Ingrese el Nombre del Solicitante:");
            if(!solicitante) return;
            let patrocinado = prompt("¿Recomendado o patrocinado por? (Opcional):", "");

            let mascs = JSON.parse(localStorage.getItem('masc_list_manual')) || [];
            let filtrados = mascs.filter(m => m.centro === pathMasc.centro && m.anio === pathMasc.anio);
            let anioCorto = pathMasc.anio.slice(-2);
            let consecutivo = (filtrados.length + 1).toString().padStart(3, '0');
            let numFinal = `${consecutivo}/${anioCorto}`;

            mascs.push({
                numero: numFinal,
                centro: pathMasc.centro,
                anio: pathMasc.anio,
                tipo: pathMasc.tipo,
                solicitante: solicitante,
                patrocinado: patrocinado || "",
                firmadoPartes: false,
                prevencionActiva: false,
                validacionActiva: false,
                docs: {}
            });

            localStorage.setItem('masc_list_manual', JSON.stringify(mascs));
            registrarActividad("Nuevo MASC", `Apertura manual de expediente ${numFinal}`);
            renderizarVista();
        }

        function abrirGestionExpediente(index) {
            pathMasc.indexExp = index;
            nivelActual = 4;
            renderizarVista();
        }

        function guardarCampoExpediente(index, campo, valor) {
            let mascs = JSON.parse(localStorage.getItem('masc_list_manual')) || [];
            mascs[index][campo] = valor;
            localStorage.setItem('masc_list_manual', JSON.stringify(mascs));
        }

        function toggleFirmado(index, valor) {
            let mascs = JSON.parse(localStorage.getItem('masc_list_manual')) || [];
            mascs[index].firmadoPartes = valor;
            localStorage.setItem('masc_list_manual', JSON.stringify(mascs));
        }

        function toggleResolucion(index, tipo, valor) {
            let mascs = JSON.parse(localStorage.getItem('masc_list_manual')) || [];
            if(tipo === 'prevencion') mascs[index].prevencionActiva = valor;
            if(tipo === 'validacion') mascs[index].validacionActiva = valor;
            localStorage.setItem('masc_list_manual', JSON.stringify(mascs));
            renderizarVista();
        }

        function subirDocManual(index, tipoDoc, event) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let mascs = JSON.parse(localStorage.getItem('masc_list_manual')) || [];
                if(!mascs[index].docs) mascs[index].docs = {};
                mascs[index].docs[tipoDoc] = e.target.result; // Guarda en base64 en localStorage
                localStorage.setItem('masc_list_manual', JSON.stringify(mascs));
                
                registrarActividad("Documento MASC", `Se adjuntó ${tipoDoc} en ${mascs[index].numero}`);
                renderizarVista();
                alert(`¡${tipoDoc} cargado exitosamente!`);
            };
            reader.readAsDataURL(file);
        }

        // VISOR INDIVIDUAL DE PDF AISLADO
        function verDocumento(base64Data, titulo) {
            document.getElementById('visor-titulo-doc').innerText = "Visualizando: " + titulo;
            document.getElementById('iframe-pdf-visor').src = base64Data;
            document.getElementById('modal-visor-pdf').style.display = 'flex';
        }

        function cerrarVisorPDF() {
            document.getElementById('modal-visor-pdf').style.display = 'none';
            document.getElementById('iframe-pdf-visor').src = '';
        }
    </script>
</body>
</html>
