<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bóveda Pro | Sistema Jurídico y MASC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <style>
        :root { --bg-deep: #050810; --bg-panel: #0f172a; --glass-bg: rgba(15, 23, 42, 0.85); --brand-orange: #ff7315; --neon-blue: #38bdf8; --border-glass: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-muted: #94a3b8; --success: #10b981; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: var(--bg-deep); } ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .logo-oficial { display: flex; flex-direction: column; align-items: flex-start;}
        .logo-oficial img { max-height: 45px; object-fit: contain; margin-bottom: 2px; display:block;}
        .logo-oficial .sub-brand { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; z-index: 50; position: absolute; background: var(--bg-deep); }
        .login-box { background: var(--glass-bg); padding: 40px 30px; border-radius: 16px; border: 1px solid var(--border-glass); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .input-login { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 1rem; outline: none; }
        .input-login:focus { border-color: var(--brand-orange); }
        .btn-login { width: 100%; background: linear-gradient(135deg, var(--brand-orange), #d95d0b); border: none; color: white; padding: 15px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: transform 0.2s; margin-top: 10px; }
        .btn-login:hover { transform: translateY(-2px); }
        
        #dashboard-screen { display: none; height: 100vh; flex-direction: column; }
        .topbar { background: rgba(15, 23, 42, 0.9); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); z-index: 10; }
        .btn-logout { background: transparent; border: 1px solid var(--danger); color: #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem;}
        .btn-logout:hover { background: rgba(239, 68, 68, 0.1); }
        .btn-home { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem;}
        .btn-home:hover { background: rgba(56, 189, 248, 0.1); }

        .main-content { display: flex; flex: 1; overflow: hidden; flex-direction: row; }
        .sidebar { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border-glass); display: flex; flex-direction: column; padding: 15px 0; flex-shrink: 0;}
        .menu-item { padding: 15px 20px; color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.3s; border-left: 3px solid transparent; font-size: 0.9rem;}
        .menu-item:hover, .menu-item.active { background: rgba(56, 189, 248, 0.1); color: var(--neon-blue); border-left-color: var(--neon-blue); }
        
        .folder-area { flex: 1; padding: 30px; overflow-y: auto; background: var(--bg-deep); display: flex; flex-direction: column; width: 100%;}
        .section-header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-glass); padding-bottom: 15px; flex-wrap: wrap; gap: 10px;}
        .section-title { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 10px; margin: 0; }
        
        .materia-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;}
        .materia-tab { background: var(--glass-bg); border: 1px solid var(--border-glass); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: 0.3s; }
        .materia-tab.active { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); }

        .grid-carpetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px;}
        .carpeta-card { background: var(--glass-bg); border: 1px solid var(--border-glass); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; text-align: center;}
        .carpeta-card:hover { transform: translateY(-3px); border-color: var(--brand-orange); box-shadow: 0 5px 15px rgba(255, 115, 21, 0.1); }
        .carpeta-card i.folder-icon { font-size: 2.5rem; color: var(--neon-blue); margin-bottom: 12px; }
        .carpeta-card img.center-logo { height: 40px; margin-bottom: 10px; object-fit: contain; border-radius: 4px; }
        .carpeta-card .titulo { font-weight: 700; color: var(--text-main); margin-bottom: 5px; font-size: 0.95rem;}
        .carpeta-card .subtitulo { font-size: 0.7rem; color: var(--text-muted); }
        
        .gestion-box { background: var(--bg-panel); border: 1px solid var(--border-glass); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .form-group label { font-size: 0.8rem; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
        .form-input { background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
        .form-input:focus { border-color: var(--brand-orange); }

        .docs-table { width: 100%; border-collapse: collapse; margin-top: 15px; display: block; overflow-x: auto; white-space: nowrap; }
        .docs-table th, .docs-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-glass); font-size: 0.85rem; }
        .docs-table th { color: var(--brand-orange); background: rgba(0,0,0,0.2); }
        
        .btn-upload { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px;}
        .btn-upload:hover { background: var(--neon-blue); color: #000; }
        .btn-view { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); color: var(--success); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: 0.3s; }
        .btn-view:hover { background: var(--success); color: #fff; }

        .modal { display: none; position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px;}
        .modal-content { background: var(--bg-panel); padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--border-glass); text-align: center; }
        .btn-crear { background: var(--neon-blue); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.3s;}
        
        .modal-visor-content { background: var(--bg-panel); border: 1px solid var(--border-glass); width: 95vw; height: 90vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-visor-header { padding: 12px 20px; background: rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); }
        .modal-visor-body { flex: 1; background: #1e293b; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .modal-visor-body iframe { width: 100%; height: 100%; border: none; border-radius: 6px; background: white; }

        .breadcrumb { display: flex; gap: 8px; color: var(--text-muted); margin-bottom: 15px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .breadcrumb span:hover { color: var(--brand-orange); }

        @media (max-width: 768px) {
            .topbar { padding: 10px 15px; flex-wrap: wrap; }
            .logo-oficial { width: 100%; flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 10px; }
            #badge-modo-sesion { font-size: 0.65rem; border: none; padding: 0; }
            .main-content { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-glass); flex-direction: row; padding: 0; overflow-x: auto; white-space: nowrap; }
            .menu-item { padding: 12px 15px; border-left: none; border-bottom: 3px solid transparent; font-size: 0.85rem; }
            .menu-item.active { border-left: none; border-bottom-color: var(--neon-blue); }
            .folder-area { padding: 15px; width: 100%; }
            .grid-carpetas { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
            .carpeta-card { padding: 15px; }
            .section-header-box { flex-direction: column; align-items: flex-start; }
            .btn-upload { margin-top: 10px; width: 100%; justify-content: center; }
            .form-row { grid-template-columns: 1fr; gap: 10px; }
            .gestion-box { padding: 15px; }
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <div class="logo-oficial" style="align-items: center; margin-bottom: 25px;">
                <img src="./assets/LOGO.png" onerror="this.outerHTML='<h1 style=\\\'color:var(--brand-orange); font-size:2rem;\\\'>45 Y MÁS</h1>'" alt="45 Y MÁS">
                <div class="sub-brand">Acreditación 065 • IJA Jalisco</div>
            </div>
            <p style="color:var(--brand-orange); font-weight:bold; margin-bottom: 10px;">Bóveda Institucional</p>
            <p style="font-size: 0.75rem; color:var(--text-muted); margin-bottom: 20px;">Ingresa tus credenciales autorizadas por el administrador de red.</p>
            <input type="text" id="user" class="input-login" placeholder="Usuario" onkeypress="detectarEnter(event)">
            <input type="password" id="pass" class="input-login" placeholder="Contraseña" onkeypress="detectarEnter(event)">
            <button type="button" class="btn-login" onclick="iniciarSesion()">INGRESAR</button>
            <p id="error-msg" style="color: #ef4444; margin-top: 15px; display: none; font-weight: bold; font-size: 0.85rem;">Credenciales incorrectas.</p>
        </div>
    </div>

    <div id="dashboard-screen">
        <div class="topbar">
            <div class="logo-oficial">
                <img src="./assets/LOGO.png" onerror="this.outerHTML='<h1 style=\\\'font-weight:900; font-size:1.1rem; color:var(--brand-orange); margin:0;\\\'>45 Y MÁS</h1>'" alt="45 Y MÁS" style="max-height: 35px; margin:0;">
                <span id="badge-modo-sesion" style="font-size: 0.75rem; font-weight: bold; color: var(--success); padding-left: 10px;">Modo Privado</span>
            </div>
            <div style="display:flex; gap: 8px;">
                <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i></a>
                <button type="button" class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="menu-item active" id="menu-juridico" onclick="mostrarMenu('juridico')"><i class="fa-solid fa-gavel"></i> Expedientes Jurídicos</div>
                <div class="menu-item" id="menu-masc" onclick="mostrarMenu('masc')"><i class="fa-solid fa-handshake"></i> Convenios MASC</div>
                <div class="menu-item" id="menu-usuarios" onclick="mostrarMenu('usuarios')" style="display:none;"><i class="fa-solid fa-users-cog"></i> Gestión de Equipo</div>
            </div>
            <div class="folder-area" id="area-trabajo"></div>
        </div>
    </div>

    <!-- Modales -->
    <div class="modal" id="modal-crear">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; color: var(--neon-blue); font-size: 1.1rem;">Nuevo Expediente Jurídico</h3>
            <div style="text-align:left;">
                <label style="color:var(--text-muted); font-size:0.75rem; font-weight:bold; margin-bottom:5px; display:block;">NÚMERO DE EXPEDIENTE:</label>
                <input type="text" id="input-nuevo-juridico" class="input-login" placeholder="Ej. EXP/340/26">
            </div>
            <button type="button" class="btn-crear" onclick="guardarExpedienteJuridico()">Crear Carpeta Segura</button>
            <button type="button" class="btn-logout" style="width: 100%; margin-top: 10px; justify-content: center;" onclick="document.getElementById('modal-crear').style.display='none'">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-crear-masc">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; color: var(--brand-orange); font-size: 1.1rem;">Apertura Convenio MASC</h3>
            <div style="text-align:left;">
                <label style="color:var(--text-muted); font-size:0.75rem; font-weight:bold; margin-bottom:5px; display:block;">NOMBRE DEL SOLICITANTE:</label>
                <input type="text" id="input-solicitante-masc" class="input-login" placeholder="Nombre completo">
                
                <label style="color:var(--text-muted); font-size:0.75rem; font-weight:bold; margin-bottom:5px; display:block;">RECOMENDADO POR (OPCIONAL):</label>
                <input type="text" id="input-patrocinado-masc" class="input-login" placeholder="Ej. Eduviges">
            </div>
            <button type="button" class="btn-crear" style="background: var(--brand-orange);" onclick="procesarNuevoMASC()">Guardar Convenio</button>
            <button type="button" class="btn-logout" style="width: 100%; margin-top: 10px; justify-content: center;" onclick="document.getElementById('modal-crear-masc').style.display='none'">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modal-visor-pdf">
        <div class="modal-visor-content">
            <div class="modal-visor-header">
                <h3 id="visor-titulo-doc" style="color: var(--neon-blue); font-size: 1rem;">Visualizando Doc</h3>
                <button type="button" class="btn-logout" onclick="cerrarVisorPDF()"><i class="fa-solid fa-xmark"></i> Cerrar</button>
            </div>
            <div class="modal-visor-body">
                <iframe id="iframe-pdf-visor" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "TU_API_KEY", authDomain: "tu-proyecto.firebaseapp.com", projectId: "tu-proyecto", storageBucket: "tu-proyecto.appspot.com", messagingSenderId: "123456789", appId: "1:123:web:abc" };
        let db = null; 

        try { if(firebaseConfig.apiKey !== "TU_API_KEY") { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } } catch(e) { console.log("Firebase inactivo"); }

        const catJuzgados = {
            "Civil": ["Juzgado 1° de lo Civil", "Juzgado 2° de lo Civil", "Juzgado 3° de lo Civil", "Juzgado 4° de lo Civil", "Juzgado 5° de lo Civil", "Juzgado 6° de lo Civil", "Juzgado 7° de lo Civil", "Juzgado 8° de lo Civil", "Juzgado 9° de lo Civil", "Juzgado 10° de lo Civil", "Juzgado 11° de lo Civil", "Juzgado 12° de lo Civil", "Juzgado 13° de lo Civil"],
            "Familiar": ["Juzgado 1° de lo Familiar", "Juzgado 2° de lo Familiar", "Juzgado 3° de lo Familiar", "Juzgado 4° de lo Familiar", "Juzgado 5° de lo Familiar", "Juzgado 6° de lo Familiar", "Juzgado 7° de lo Familiar", "Juzgado 8° de lo Familiar", "Juzgado 9° de lo Familiar", "Juzgado 10° de lo Familiar", "Juzgado 11° de lo Familiar", "Juzgado 12° de lo Familiar", "Juzgado 13° de lo Familiar", "Juzgado 14° de lo Familiar", "Juzgado 15° de lo Familiar", "Juzgado 16° de lo Familiar", "Juzgado 17° de lo Familiar", "Especializado Niños", "Violencia Mujeres"],
            "Mercantil": ["Juzgado 1° de lo Mercantil", "Juzgado 2° de lo Mercantil", "Juzgado 3° de lo Mercantil", "Juzgado 4° de lo Mercantil", "Juzgado 5° de lo Mercantil", "Juzgado 6° de lo Mercantil", "Juzgado 7° de lo Mercantil", "Juzgado 8° de lo Mercantil", "Juzgado 9° de lo Mercantil", "Juzgado 10° de lo Mercantil", "Juzgado 11° Mercantil", "Juzgado 12° Mercantil", "Juzgado 13° Mercantil", "Juzgado 14° Mercantil", "Juzgado 15° Mercantil", "Juzgado 16° Mercantil", "Juzgado 17° Mercantil", "Juzgado 18° Mercantil", "Juzgado 19° Mercantil"]
        };
        const anios = ["2026", "2025", "2024", "2023", "2022"];
        const tiposMascObj = { "ARRENDAMIENTO": "Preventivo Arrendamiento", "ALIMENTOS": "Alimentos y Convivencia", "DIVORCIO": "Divorcio Admtvo. y Mutuo" };
        
        let vistaActual = 'juridico'; let materiaActiva = "Civil";
        let nivelJuridico = 0; let pathJuridico = { juzgado: '', anio: '' };
        let nivelMasc = 0; let pathMasc = { centro: '', anio: '', tipo: '', indexExp: null };
        
        // --- NÚCLEO DE ROLES Y MULTI-TENANT ---
        const usuariosDefecto = [
            { user: "admin", pass: "45ymas", centro: "Despacho 45yMas", cloud: true, addUsers: true, isMaster: true },
            { user: "chava", pass: "45ymas", centro: "Despacho 45yMas", cloud: true, addUsers: false, isMaster: false },
            { user: "ceci", pass: "45ymas", centro: "Despacho 45yMas", cloud: true, addUsers: false, isMaster: false },
            { user: "aldo", pass: "45ymas", centro: "Centro 353", cloud: false, addUsers: true, isMaster: false }
        ];

        let bovedaUsers = JSON.parse(localStorage.getItem('boveda_usuarios_sistema'));
        if(!bovedaUsers) { bovedaUsers = usuariosDefecto; localStorage.setItem('boveda_usuarios_sistema', JSON.stringify(bovedaUsers)); }

        let usuarioActivoObj = null;
        let esAdmin = false; 
        let storageMascKey = ''; 
        let centrosMASC = []; 
        let listaExpedientesMasc = [];

        // Detección de sesión persistente (no te saca si actualizas o vuelves de un PDF)
        window.onload = () => {
            let sessionUser = localStorage.getItem('sesion_activa_user');
            if(sessionUser) {
                let found = bovedaUsers.find(x => x.user === sessionUser);
                if(found) { document.getElementById('user').value = found.user; document.getElementById('pass').value = found.pass; iniciarSesion(); }
            }
        };

        function detectarEnter(event) { if(event.key === 'Enter') { iniciarSesion(); } }

        async function iniciarSesion() {
            try {
                const u = document.getElementById('user').value.trim().toLowerCase();
                const p = document.getElementById('pass').value;
                const errorMsg = document.getElementById('error-msg');
                
                const foundUser = bovedaUsers.find(x => x.user.toLowerCase() === u && x.pass === p);

                if(foundUser) {
                    errorMsg.style.display = 'none'; 
                    usuarioActivoObj = foundUser;
                    localStorage.setItem('sesion_activa_user', foundUser.user);
                    
                    esAdmin = foundUser.cloud; // Define si sincroniza a Firebase
                    
                    // Asignación de entorno Aislado por Centro
                    let centroClave = foundUser.centro.replace(/[^a-zA-Z0-9]/g, '');
                    storageMascKey = 'boveda_db_' + centroClave;

                    // Recupera las carpetas/centros visibles en el entorno
                    let centrosGuardados = localStorage.getItem('carpetas_' + storageMascKey);
                    centrosMASC = centrosGuardados ? JSON.parse(centrosGuardados) : [foundUser.centro];

                    document.getElementById('login-screen').style.display = 'none'; 
                    document.getElementById('dashboard-screen').style.display = 'flex';
                    
                    document.getElementById('badge-modo-sesion').innerHTML = foundUser.isMaster ? "👑 Admin Master" : `👤 ${foundUser.user.toUpperCase()}`;
                    document.getElementById('badge-modo-sesion').style.color = foundUser.isMaster ? "var(--brand-orange)" : (foundUser.cloud ? "var(--neon-blue)" : "var(--success)");
                    
                    // Muestra botón de gestión si el usuario tiene privilegios
                    if(foundUser.addUsers) document.getElementById('menu-usuarios').style.display = 'flex';
                    else document.getElementById('menu-usuarios').style.display = 'none';

                    if(esAdmin && db) { await sincronizarDesdeNube(); } else { cargarLocalesSeguro(); }
                    mostrarMenu('juridico');
                } else { 
                    errorMsg.style.display = 'block'; 
                }
            } catch (error) { console.error("Error en inicio de sesión:", error); }
        }

        function cerrarSesion() { localStorage.removeItem('sesion_activa_user'); location.reload(); }

        function cargarLocalesSeguro() {
            try { let data = localStorage.getItem(storageMascKey); listaExpedientesMasc = data ? JSON.parse(data) : []; } catch (error) { listaExpedientesMasc = []; }
        }

        async function sincronizarDesdeNube() { 
            try { 
                const snapshot = await db.collection('expedientes_masc').get(); 
                listaExpedientesMasc = []; 
                snapshot.forEach(doc => { 
                    let data = doc.data();
                    // Solo descargamos expedientes que pertenezcan al entorno del usuario, o todos si es Master
                    if(usuarioActivoObj.isMaster || centrosMASC.includes(data.centro)) {
                        listaExpedientesMasc.push(data); 
                    }
                }); 
            } catch(e) { cargarLocalesSeguro(); } 
        }

        async function guardarEnBDMasc() { 
            if(esAdmin && db) { 
                try { 
                    for(let m of listaExpedientesMasc) { 
                        // El ID evita que 2 centros diferentes sobreescriban el mismo número "001-26"
                        let docId = m.centro.replace(/[^a-zA-Z0-9]/g, '') + '_' + m.numero.replace('/', '-');
                        await db.collection('expedientes_masc').doc(docId).set(m); 
                    } 
                } catch(e) {} 
            } 
            try { localStorage.setItem(storageMascKey, JSON.stringify(listaExpedientesMasc)); } catch (e) { if (e.name === 'QuotaExceededError') { alert("¡Límite de memoria! PDF muy pesado."); } }
        }

        function agregarCentroNuevo() {
            let nombre = prompt("Ingresa el nombre del nuevo Centro/Sede:");
            if (nombre && nombre.trim() !== "") {
                centrosMASC.push(nombre.trim());
                localStorage.setItem('carpetas_' + storageMascKey, JSON.stringify(centrosMASC));
                renderizarVista();
            }
        }

        function mostrarMenu(menu) { vistaActual = menu; document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active')); document.getElementById('menu-' + menu).classList.add('active'); renderizarVista(); }

        function renderizarVista() {
            const area = document.getElementById('area-trabajo'); let html = '';
            try {
                if (vistaActual === 'juridico') {
                    if (nivelJuridico === 0) {
                        html += `<div class="section-header-box"><div class="section-title"><i class="fa-solid fa-building-columns"></i> Base de Juzgados</div></div><div class="materia-tabs"><div class="materia-tab ${materiaActiva === 'Civil' ? 'active' : ''}" onclick="materiaActiva='Civil'; renderizarVista()">Civil</div><div class="materia-tab ${materiaActiva === 'Familiar' ? 'active' : ''}" onclick="materiaActiva='Familiar'; renderizarVista()">Familiar</div><div class="materia-tab ${materiaActiva === 'Mercantil' ? 'active' : ''}" onclick="materiaActiva='Mercantil'; renderizarVista()">Mercantil</div></div><div class="grid-carpetas">`;
                        catJuzgados[materiaActiva].forEach(j => { html += `<div class="carpeta-card" onclick="nivelJuridico=1; pathJuridico.juzgado='${j}'; renderizarVista()"><i class="fa-solid fa-folder folder-icon"></i><div class="titulo">${j}</div><div class="subtitulo">Expedientes locales</div></div>`; });
                        html += `</div>`;
                    } 
                    else if (nivelJuridico === 1) {
                        html += `<div class="breadcrumb" onclick="nivelJuridico=0; renderizarVista()"><i class="fa-solid fa-arrow-left"></i> Juzgados</div><div class="section-title" style="margin-bottom:20px;">${pathJuridico.juzgado} > Año de Inicio</div><div class="grid-carpetas">`;
                        anios.forEach(a => { html += `<div class="carpeta-card" onclick="nivelJuridico=2; pathJuridico.anio='${a}'; renderizarVista()"><i class="fa-solid fa-calendar folder-icon" style="color:var(--brand-orange);"></i><div class="titulo">${a}</div><div class="subtitulo">Año judicial</div></div>`; });
                        html += `</div>`;
                    }
                    else if (nivelJuridico === 2) {
                        html += `<div class="breadcrumb" onclick="nivelJuridico=1; renderizarVista()"><i class="fa-solid fa-arrow-left"></i> Años</div><div class="section-header-box"><div class="section-title">${pathJuridico.anio} > Expedientes</div><button type="button" class="btn-upload" onclick="document.getElementById('modal-crear').style.display='flex'"><i class="fa-solid fa-plus"></i> Añadir</button></div><div class="grid-carpetas">`;
                        let dataStr = localStorage.getItem(`exp_${storageMascKey}_${pathJuridico.juzgado}_${pathJuridico.anio}`); let exps = dataStr ? JSON.parse(dataStr) : [];
                        exps.forEach(e => { html += `<div class="carpeta-card" onclick="abrirVisorCentral('${e.nombre}')"><i class="fa-solid fa-file-pdf folder-icon" style="color:var(--success);"></i><div class="titulo">${e.nombre}</div><div class="subtitulo">Gestión Digital</div></div>`; });
                        html += `</div>`;
                    }
                } 
                else if (vistaActual === 'masc') {
                    if (nivelMasc === 0) {
                        html += `<div class="section-header-box"><div class="section-title"><i class="fa-solid fa-handshake"></i> Centros MASC de tu Entorno</div><button type="button" class="btn-upload" onclick="agregarCentroNuevo()"><i class="fa-solid fa-plus"></i> Nuevo Centro</button></div><div class="grid-carpetas">`;
                        centrosMASC.forEach(c => { html += `<div class="carpeta-card" onclick="nivelMasc=1; pathMasc.centro='${c}'; renderizarVista()"><img src="./assets/logo45.jpeg" class="center-logo" onerror="this.outerHTML='<i class=\\\'fa-solid fa-building folder-icon\\\' style=\\\'color:var(--brand-orange);\\\'></i>'"><div class="titulo">${c}</div><div class="subtitulo">Sede Activa</div></div>`; });
                        html += `</div>`;
                    }
                    else if (nivelMasc === 1) {
                        html += `<div class="breadcrumb" onclick="nivelMasc=0; renderizarVista()"><i class="fa-solid fa-arrow-left"></i> Centros</div><div class="section-title" style="margin-bottom:20px;">${pathMasc.centro} > Años</div><div class="grid-carpetas">`;
                        anios.forEach(a => { html += `<div class="carpeta-card" onclick="nivelMasc=2; pathMasc.anio='${a}'; renderizarVista()"><i class="fa-solid fa-calendar folder-icon" style="color:var(--brand-orange);"></i><div class="titulo">${a}</div><div class="subtitulo">Registro MASC</div></div>`; });
                        html += `</div>`;
                    }
                    else if (nivelMasc === 2) {
                        html += `<div class="breadcrumb" onclick="nivelMasc=1; renderizarVista()"><i class="fa-solid fa-arrow-left"></i> Años</div><div class="section-title" style="margin-bottom:20px;">${pathMasc.centro} > ${pathMasc.anio} > Tipo de Convenio</div><div class="grid-carpetas">`;
                        for(let key in tiposMascObj) { html += `<div class="carpeta-card" onclick="nivelMasc=3; pathMasc.tipo='${key}'; renderizarVista()"><i class="fa-solid fa-folder-open folder-icon" style="color:var(--brand-orange);"></i><div class="titulo">${tiposMascObj[key]}</div><div class="subtitulo">Categoría MASC</div></div>`; }
                        html += `</div>`;
                    }
                    else if (nivelMasc === 3) {
                        html += `<div class="breadcrumb" onclick="nivelMasc=2; renderizarVista()"><i class="fa-solid fa-arrow-left"></i> Tipos</div><div class="section-header-box"><div class="section-title">${pathMasc.anio} > ${tiposMascObj[pathMasc.tipo]}</div><button type="button" class="btn-upload" onclick="document.getElementById('modal-crear-masc').style.display='flex'"><i class="fa-solid fa-plus"></i> Nuevo</button></div><div class="grid-carpetas">`;
                        listaExpedientesMasc.forEach((m, i) => { if(m.centro === pathMasc.centro && m.anio === pathMasc.anio && m.tipo === pathMasc.tipo) {
                            html += `<div class="carpeta-card" onclick="nivelMasc=4; pathMasc.indexExp=${i}; renderizarVista()"><i class="fa-solid fa-file-contract folder-icon" style="color:var(--success);"></i><div class="titulo">${m.numero}</div><div class="subtitulo">${m.solicitante || 'Sin Solicitante'}</div></div>`; 
                        }});
                        html += `</div>`;
                    }
                    else if (nivelMasc === 4) {
                        let m = listaExpedientesMasc[pathMasc.indexExp];
                        html += `<div class="breadcrumb" onclick="nivelMasc=3; renderizarVista()"><i class="fa-solid fa-arrow-left"></i> Expedientes</div>
                        <div class="section-header-box" style="align-items: center;"><div class="section-title"><i class="fa-solid fa-folder-tree"></i> MASC: ${m.numero}</div><button type="button" class="btn-upload" style="background: var(--neon-blue); color: #000; font-size: 0.8rem;" onclick="abrirVisorMASC(${pathMasc.indexExp})"><i class="fa-solid fa-eye"></i> Visor Completo</button></div>
                        <div class="gestion-box">
                            <div class="form-row"><div class="form-group"><label>Solicitante:</label><input type="text" class="form-input" value="${m.solicitante || ''}" onchange="guardarCampoMASC(${pathMasc.indexExp}, 'solicitante', this.value)" placeholder="Nombre completo"></div><div class="form-group"><label>Patrocinado por:</label><input type="text" class="form-input" value="${m.patrocinado || ''}" onchange="guardarCampoMASC(${pathMasc.indexExp}, 'patrocinado', this.value)" placeholder="Ej. Eduviges"></div></div>
                            <h4 style="color:var(--brand-orange); margin: 20px 0 10px 0; font-size:0.9rem;"><i class="fa-solid fa-file-pdf"></i> Documentación Obligatoria</h4>
                            <div class="docs-table">
                                <table style="width:100%; border-collapse: collapse;">
                                <tr><th>Documento Requerido</th><th>Estado</th><th>Acción Manual</th></tr>
                                <tr><td><strong>1. Solicitud firmada</strong></td><td>${m.docs && m.docs.solicitud ? '✅ Cargado' : '❌ Pendiente'}</td><td><input type="file" id="file-solicitud" accept="application/pdf" style="display:none" onchange="subirDocMASC(${pathMasc.indexExp}, 'solicitud', event)"><button type="button" class="btn-upload" onclick="document.getElementById('file-solicitud').click()">Subir</button> ${m.docs && m.docs.solicitud ? `<button type="button" class="btn-view" onclick="verDocumento('${m.docs.solicitud}', 'Solicitud')">Ver</button>` : ''}</td></tr>
                                <tr><td><strong>2. Dictamen de viabilidad</strong></td><td>${m.docs && m.docs.dictamen ? '✅ Cargado' : '❌ Pendiente'}</td><td><input type="file" id="file-dictamen" accept="application/pdf" style="display:none" onchange="subirDocMASC(${pathMasc.indexExp}, 'dictamen', event)"><button type="button" class="btn-upload" onclick="document.getElementById('file-dictamen').click()">Subir</button> ${m.docs && m.docs.dictamen ? `<button type="button" class="btn-view" onclick="verDocumento('${m.docs.dictamen}', 'Dictamen')">Ver</button>` : ''}</td></tr>
                                <tr><td><strong>3. Acuerdo confidencial</strong></td><td>${m.docs && m.docs.acuerdo ? '✅ Cargado' : '❌ Pendiente'}</td><td><input type="file" id="file-acuerdo" accept="application/pdf" style="display:none" onchange="subirDocMASC(${pathMasc.indexExp}, 'acuerdo', event)"><button type="button" class="btn-upload" onclick="document.getElementById('file-acuerdo').click()">Subir</button> ${m.docs && m.docs.acuerdo ? `<button type="button" class="btn-view" onclick="verDocumento('${m.docs.acuerdo}', 'Acuerdo')">Ver</button>` : ''}</td></tr>
                                <tr><td><strong>4. Convenio final</strong><br><label style="font-size:0.7rem; color:var(--text-muted); cursor:pointer;"><input type="checkbox" ${m.firmadoPartes ? 'checked' : ''} onchange="toggleFirmado(${pathMasc.indexExp}, this.checked)"> Firmado partes</label></td><td>${m.docs && m.docs.convenio ? '✅ Cargado' : '❌ Pendiente'}</td><td><input type="file" id="file-convenio" accept="application/pdf" style="display:none" onchange="subirDocMASC(${pathMasc.indexExp}, 'convenio', event)"><button type="button" class="btn-upload" onclick="document.getElementById('file-convenio').click()">Subir</button> ${m.docs && m.docs.convenio ? `<button type="button" class="btn-view" onclick="verDocumento('${m.docs.convenio}', 'Convenio')">Ver</button>` : ''}</td></tr>
                                <tr><td><strong>5. Convenio digital (Word)</strong></td><td>${m.docs && m.docs.word ? '✅ Almacenado' : '❌ Pendiente'}</td><td><input type="file" id="file-word" accept=".doc, .docx" style="display:none" onchange="subirDocMASC(${pathMasc.indexExp}, 'word', event)"><button type="button" class="btn-upload" onclick="document.getElementById('file-word').click()">Subir</button></td></tr>
                                </table>
                            </div>
                            <h4 style="color:var(--brand-orange); margin: 30px 0 10px 0; font-size:0.9rem;"><i class="fa-solid fa-gavel"></i> Resoluciones y Tiempos del IJA</h4>
                            <div class="form-row">
                                <div class="form-group" style="background:rgba(0,0,0,0.2); padding:15px; border-radius:8px;"><label><input type="checkbox" ${m.prevencionActiva ? 'checked' : ''} onchange="toggleResolucion(${pathMasc.indexExp}, 'prevencion', this.checked)"> Marcar Prevención</label>${m.prevencionActiva ? `<p style="font-size:0.75rem; color:var(--text-muted); margin-top:5px;">Contestación: ${m.docs && m.docs.contestacionPrevencion ? '✅ Sí' : '❌ No'}</p><input type="file" id="file-contestacion" accept="application/pdf" style="display:none" onchange="subirDocMASC(${pathMasc.indexExp}, 'contestacionPrevencion', event)"><button type="button" class="btn-upload" style="margin-top:8px;" onclick="document.getElementById('file-contestacion').click()">Subir</button> ${m.docs && m.docs.contestacionPrevencion ? `<button type="button" class="btn-view" style="margin-top:8px;" onclick="verDocumento('${m.docs.contestacionPrevencion}', 'Contestación')">Ver</button>` : ''}` : ''}</div>
                                <div class="form-group" style="background:rgba(0,0,0,0.2); padding:15px; border-radius:8px;"><label><input type="checkbox" ${m.validacionActiva ? 'checked' : ''} onchange="toggleResolucion(${pathMasc.indexExp}, 'validacion', this.checked)"> Validado / No Sanción</label>${m.validacionActiva ? `<p style="font-size:0.75rem; color:var(--text-muted); margin-top:5px;">Validación: ${m.docs && m.docs.documentoValidacion ? '✅ Sí' : '❌ No'}</p><input type="file" id="file-validacion" accept="application/pdf" style="display:none" onchange="subirDocMASC(${pathMasc.indexExp}, 'documentoValidacion', event)"><button type="button" class="btn-upload" style="margin-top:8px;" onclick="document.getElementById('file-validacion').click()">Subir</button> ${m.docs && m.docs.documentoValidacion ? `<button type="button" class="btn-view" style="margin-top:8px;" onclick="verDocumento('${m.docs.documentoValidacion}', 'Validación')">Ver</button>` : ''}` : ''}</div>
                            </div>
                        </div>`;
                    }
                }
                // --- NUEVO PANEL DE GESTIÓN DE EQUIPO ---
                else if (vistaActual === 'usuarios') {
                    html += `<div class="section-header-box"><div class="section-title"><i class="fa-solid fa-users-cog"></i> Gestión de Equipo y Roles</div></div>`;
                    
                    html += `
                    <div class="gestion-box">
                        <h4 style="color:var(--brand-orange); margin-bottom:15px;"><i class="fa-solid fa-user-plus"></i> Crear Nuevo Perfil de Acceso</h4>
                        <div class="form-row">
                            <div class="form-group"><label>Nombre de Usuario:</label><input type="text" id="new-user-name" class="form-input" placeholder="Ej. laura_abogada"></div>
                            <div class="form-group"><label>Contraseña:</label><input type="text" id="new-user-pass" class="form-input" value="45ymas"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Centro de Trabajo (Elige o Escribe Nuevo):</label><input type="text" id="new-user-centro" class="form-input" value="${usuarioActivoObj.centro}" ${usuarioActivoObj.isMaster ? '' : 'readonly'}></div>
                        </div>
                        <div class="form-row" style="margin-top:10px; align-items:center;">
                            <label style="color:var(--text-main); font-size:0.85rem; cursor:pointer;"><input type="checkbox" id="new-user-add"> Dar privilegios para crear más usuarios (Gestor)</label>
                            ${usuarioActivoObj.isMaster ? `<label style="color:var(--neon-blue); font-size:0.85rem; cursor:pointer; margin-left:15px;"><input type="checkbox" id="new-user-cloud"> Sincronizar en Nube (Firebase)</label>` : ''}
                        </div>
                        <button type="button" class="btn-crear" style="margin-top:15px; max-width: 200px;" onclick="crearNuevoUsuario()">Registrar Usuario</button>
                    </div>
                    `;

                    html += `<h4 style="color:var(--text-main); margin: 25px 0 15px 0;"><i class="fa-solid fa-address-book"></i> Directorio de Usuarios</h4>`;
                    html += `<div class="docs-table"><table style="width:100%; border-collapse: collapse; background: var(--bg-panel);"><tr><th>Usuario</th><th>Centro / Entorno</th><th>Nube</th><th>Gestor</th><th>Acciones</th></tr>`;
                    
                    bovedaUsers.forEach((u, i) => {
                        // Un Master ve a todos. Un Gestor normal (como Aldo) solo ve a los de su Centro.
                        if(usuarioActivoObj.isMaster || u.centro === usuarioActivoObj.centro) {
                            html += `<tr>
                                <td><strong>${u.user}</strong></td>
                                <td><span style="background:rgba(255,115,21,0.2); color:var(--brand-orange); padding:3px 8px; border-radius:4px; font-size:0.75rem; font-weight:bold;">${u.centro}</span></td>
                                <td>${u.cloud ? '<i class="fa-solid fa-cloud" style="color:var(--neon-blue);"></i> Sí' : '<i class="fa-solid fa-hard-drive" style="color:var(--text-muted);"></i> Local'}</td>
                                <td>${u.addUsers ? '✅ Sí' : '❌ No'}</td>
                                <td>
                                    ${u.isMaster ? '<span style="color:var(--danger); font-size:0.75rem; font-weight:bold;">SÚPER ADMIN</span>' : `
                                    <button type="button" class="btn-upload" style="margin-right: 5px; padding: 4px 8px;" onclick="cambiarPassUsuario(${i})"><i class="fa-solid fa-key"></i></button>
                                    <button type="button" class="btn-view" style="color:var(--danger); border-color:var(--danger); padding:4px 8px;" onclick="eliminarUsuario(${i})"><i class="fa-solid fa-trash"></i></button>
                                    `}
                                </td>
                            </tr>`;
                        }
                    });
                    html += `</table></div>`;
                }
                
                area.innerHTML = html;
            } catch (error) { area.innerHTML = "<p style='color:red; text-align:center;'>Ocurrió un error interno al mostrar los datos.</p>"; }
        }

        // LÓGICA DE USUARIOS Y ROLES
        window.crearNuevoUsuario = function() {
            let n = document.getElementById('new-user-name').value.trim().toLowerCase();
            let p = document.getElementById('new-user-pass').value.trim();
            let c = document.getElementById('new-user-centro').value.trim();
            let add = document.getElementById('new-user-add').checked;
            let cloudElem = document.getElementById('new-user-cloud');
            let cloud = cloudElem ? cloudElem.checked : false;

            if(!n || !p || !c) { alert("Llena los campos obligatorios"); return; }
            if(bovedaUsers.find(x => x.user === n)) { alert("El usuario ya existe"); return; }

            bovedaUsers.push({ user: n, pass: p, centro: c, cloud: cloud, addUsers: add, isMaster: false });
            localStorage.setItem('boveda_usuarios_sistema', JSON.stringify(bovedaUsers));
            
            alert(`Usuario '${n}' creado con éxito para el entorno '${c}'.`);
            renderizarVista();
        };

        window.eliminarUsuario = function(index) {
            if(confirm("¿Eliminar este perfil permanentemente? Se perderá su acceso, pero los archivos del Centro seguirán seguros.")) {
                bovedaUsers.splice(index, 1);
                localStorage.setItem('boveda_usuarios_sistema', JSON.stringify(bovedaUsers));
                renderizarVista();
            }
        };

        window.cambiarPassUsuario = function(index) {
            let newP = prompt("Escribe la nueva contraseña para el usuario " + bovedaUsers[index].user + ":");
            if(newP && newP.trim() !== "") { 
                bovedaUsers[index].pass = newP.trim(); 
                localStorage.setItem('boveda_usuarios_sistema', JSON.stringify(bovedaUsers)); 
                alert("Contraseña modificada con éxito.");
            }
        };

        function guardarExpedienteJuridico() { let val = document.getElementById('input-nuevo-juridico').value.trim(); if(!val) return; let key = `exp_${storageMascKey}_${pathJuridico.juzgado}_${pathJuridico.anio}`; let dataStr = localStorage.getItem(key); let exps = dataStr ? JSON.parse(dataStr) : []; exps.push({ nombre: val }); localStorage.setItem(key, JSON.stringify(exps)); document.getElementById('modal-crear').style.display = 'none'; document.getElementById('input-nuevo-juridico').value = ''; renderizarVista(); }
        function abrirVisorCentral(nombreExp) { localStorage.setItem('expediente_abierto', nombreExp); window.location.href = 'visor-expediente.html'; }
        
        function base64ToBlob(base64Data) {
            try {
                const arr = base64Data.split(',');
                const mime = arr[0].match(/:(.*?);/)[1];
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while(n--) { u8arr[n] = bstr.charCodeAt(n); }
                return new Blob([u8arr], {type: mime});
            } catch(e) { return null; }
        }

        async function abrirVisorMASC(index) {
            try {
                let m = listaExpedientesMasc[index];
                let nombreExp = `MASC-${m.numero.replace(/\//g, '-')}`;
                localStorage.setItem('expediente_abierto', nombreExp);
                
                if(m.docs && m.docs.convenio) {
                    let blob = base64ToBlob(m.docs.convenio);
                    if(blob) {
                        await localforage.setItem('archivo_' + nombreExp, { blob: blob, name: `Convenio_${nombreExp}.pdf`, type: 'application/pdf' });
                    }
                }
                window.location.href = 'visor-expediente.html';
            } catch (e) { console.error("Error iniciando visor:", e); alert("Ocurrió un problema al leer el documento."); }
        }

        async function procesarNuevoMASC() { let solicitante = document.getElementById('input-solicitante-masc').value.trim(); if(!solicitante) return; let patrocinado = document.getElementById('input-patrocinado-masc').value.trim(); let filtrados = listaExpedientesMasc.filter(m => m.centro === pathMasc.centro && m.anio === pathMasc.anio); let numFinal = `${(filtrados.length + 1).toString().padStart(3, '0')}/${pathMasc.anio.slice(-2)}`; listaExpedientesMasc.push({ numero: numFinal, centro: pathMasc.centro, anio: pathMasc.anio, tipo: pathMasc.tipo, solicitante: solicitante, patrocinado: patrocinado || "", firmadoPartes: false, prevencionActiva: false, validacionActiva: false, docs: {} }); await guardarEnBDMasc(); document.getElementById('modal-crear-masc').style.display = 'none'; document.getElementById('input-solicitante-masc').value = ''; document.getElementById('input-patrocinado-masc').value = ''; renderizarVista(); }
        async function guardarCampoMASC(index, campo, valor) { listaExpedientesMasc[index][campo] = valor; await guardarEnBDMasc(); }
        async function toggleFirmado(index, valor) { listaExpedientesMasc[index].firmadoPartes = valor; await guardarEnBDMasc(); }
        async function toggleResolucion(index, tipo, valor) { if(tipo === 'prevencion') listaExpedientesMasc[index].prevencionActiva = valor; if(tipo === 'validacion') listaExpedientesMasc[index].validacionActiva = valor; await guardarEnBDMasc(); renderizarVista(); }
        
        function subirDocMASC(index, tipoDoc, event) { 
            const file = event.target.files[0]; 
            if(!file) return; 
            const reader = new FileReader(); 
            reader.onload = async function(e) { 
                if(!listaExpedientesMasc[index].docs) listaExpedientesMasc[index].docs = {}; 
                listaExpedientesMasc[index].docs[tipoDoc] = e.target.result; 
                await guardarEnBDMasc(); 
                renderizarVista(); 
            }; 
            reader.readAsDataURL(file); 
        }
        
        function verDocumento(base64Data, titulo) { 
            document.getElementById('visor-titulo-doc').innerText = titulo; 
            const isMobile = window.innerWidth <= 768 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            let blob = base64ToBlob(base64Data);
            
            if (isMobile && blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = titulo + ".pdf";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 100);
            } else if (blob) {
                const blobUrl = URL.createObjectURL(blob);
                document.getElementById('iframe-pdf-visor').src = blobUrl;
                document.getElementById('modal-visor-pdf').style.display = 'flex';
            } else {
                window.open(base64Data, '_blank');
            }
        }
        function cerrarVisorPDF() { document.getElementById('modal-visor-pdf').style.display = 'none'; document.getElementById('iframe-pdf-visor').src = ''; }
    </script>
</body>
