<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pro | Bóveda 45 y Más</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-deep: #050810; --bg-panel: #0f172a; --glass-bg: rgba(15, 23, 42, 0.8); --brand-orange: #ff7315; --neon-blue: #38bdf8; --border-glass: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-muted: #94a3b8; --success: #10b981; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at center, rgba(56, 189, 248, 0.03) 0%, transparent 100%); }
        
        /* LOGIN SCREEN */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; z-index: 50; position: absolute; background: var(--bg-deep); }
        .login-box { background: var(--glass-bg); padding: 50px 40px; border-radius: 16px; border: 1px solid var(--border-glass); text-align: center; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .login-box h1 { font-size: 1.8rem; margin-bottom: 10px; color: var(--text-main); }
        .login-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; }
        .input-login, .select-login { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 1rem; outline: none; transition: border 0.3s; }
        .select-login { appearance: none; cursor: pointer; }
        .input-login:focus, .select-login:focus { border-color: var(--brand-orange); }
        .btn-login { width: 100%; background: linear-gradient(135deg, var(--brand-orange), #d95d0b); border: none; color: white; padding: 15px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: transform 0.2s; margin-top: 10px; }
        .btn-login:hover { transform: translateY(-2px); }
        
        /* DASHBOARD SCREEN */
        #dashboard-screen { display: none; height: 100vh; flex-direction: column; }
        .topbar { background: rgba(15, 23, 42, 0.9); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); }
        .logo { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .btn-logout { background: transparent; border: 1px solid var(--danger); color: #ef4444; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.1); }
        
        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border-glass); display: flex; flex-direction: column; padding: 20px 0; }
        .menu-item { padding: 15px 25px; color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.3s; border-left: 3px solid transparent; }
        .menu-item:hover, .menu-item.active { background: rgba(56, 189, 248, 0.1); color: var(--neon-blue); border-left-color: var(--neon-blue); }
        
        /* ÁREA DE CARPETAS */
        .folder-area { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg-deep); }
        .section-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        
        .grid-carpetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .carpeta-card { background: var(--glass-bg); border: 1px solid var(--border-glass); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .carpeta-card:hover { transform: translateY(-5px); border-color: var(--brand-orange); box-shadow: 0 10px 20px rgba(255, 115, 21, 0.1); }
        .carpeta-card i.folder-icon { font-size: 3.5rem; color: var(--neon-blue); margin-bottom: 15px; }
        .carpeta-card .titulo { font-weight: 700; color: var(--text-main); margin-bottom: 5px; font-size: 1.1rem;}
        .carpeta-card .subtitulo { font-size: 0.8rem; color: var(--text-muted); }

        /* MASC CHECKLIST UI */
        .masc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--glass-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-glass); }
        .masc-info h2 { color: var(--brand-orange); margin-bottom: 5px; font-size: 1.4rem; }
        .masc-info p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 3px; }
        
        .checklist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .checklist-container { background: var(--bg-panel); border: 1px solid var(--border-glass); border-radius: 12px; padding: 25px; }
        .checklist-container h3 { color: var(--neon-blue); margin-bottom: 15px; border-bottom: 1px solid var(--border-glass); padding-bottom: 10px;}
        
        .check-group-title { color: var(--brand-orange); font-weight: bold; font-size: 0.85rem; text-transform: uppercase; margin: 20px 0 10px 0; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 4px; }
        .check-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-main); cursor: pointer; padding: 5px 10px; border-radius: 6px; transition: background 0.2s;}
        .check-item:hover { background: rgba(255,255,255,0.05); }
        .check-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--brand-orange); cursor: pointer;}
        
        .check-item.checked { color: var(--text-muted); text-decoration: line-through; }

        /* BREADCRUMB */
        .breadcrumb { display: flex; gap: 10px; color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .breadcrumb span:hover { color: var(--brand-orange); }

        /* MODAL */
        .modal { display: none; position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-panel); padding: 35px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid var(--border-glass); }
        .btn-crear { background: var(--neon-blue); color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.2s;}
        .btn-crear:hover { background: #0ea5e9; }
        
        #campo-tipo-masc { display: none; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <i class="fa-solid fa-fingerprint" style="font-size: 3.5rem; color: var(--brand-orange); margin-bottom: 20px;"></i>
            <h1>Portal Pro</h1>
            <p>Acceso Seguro a la Bóveda Local</p>
            <input type="text" id="user" class="input-login" placeholder="Usuario Institucional (admin)">
            <input type="password" id="pass" class="input-login" placeholder="Contraseña (45ymas)">
            <button class="btn-login" onclick="iniciarSesion()">INGRESAR AL SISTEMA</button>
            <p id="error-msg" style="color: #ef4444; margin-top: 15px; display: none; font-weight: bold;">Credenciales incorrectas.</p>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL (DASHBOARD) -->
    <div id="dashboard-screen">
        <div class="topbar">
            <div class="logo"><i class="fa-solid fa-shield-halved" style="color:var(--brand-orange);"></i> Bóveda Confidencial | 45 y Más</div>
            <button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="menu-item active" id="menu-juridico" onclick="mostrarSeccion('juridico')">
                    <i class="fa-solid fa-gavel"></i> Expedientes Jurídicos
                </div>
                <div class="menu-item" id="menu-masc" onclick="mostrarSeccion('masc')">
                    <i class="fa-solid fa-handshake"></i> Convenios MASC
                </div>
            </div>

            <!-- CONTENEDOR DINÁMICO -->
            <div class="folder-area" id="area-trabajo"></div>
        </div>
    </div>

    <!-- MODAL PARA CREAR NUEVO EXPEDIENTE/CONVENIO -->
    <div class="modal" id="modal-crear">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; color: var(--neon-blue); text-align: center;" id="modal-title">Nuevo Registro</h3>
            
            <div id="campo-tipo-masc">
                <label style="color:var(--text-muted); font-size:0.8rem; font-weight:bold; margin-bottom:5px; display:block;">TIPO DE CONVENIO:</label>
                <select id="select-tipo-masc" class="select-login">
                    <option value="ARRENDAMIENTO">Preventivo Arrendamiento</option>
                    <option value="ALIMENTOS">Alimentos y Convivencia</option>
                    <option value="DIVORCIO">Divorcio Admtvo. y Mutuo</option>
                </select>
            </div>

            <label id="lbl-nombre" style="color:var(--text-muted); font-size:0.8rem; font-weight:bold; margin-bottom:5px; display:block;">NOMBRE / NÚMERO:</label>
            <input type="text" id="input-nuevo" class="input-login" placeholder="Ej. EXP/340/26 o Juan Pérez">
            
            <button class="btn-crear" onclick="guardarNuevo()">Crear Carpeta Segura</button>
            <button class="btn-logout" style="width: 100%; margin-top: 10px;" onclick="document.getElementById('modal-crear').style.display='none'">Cancelar</button>
        </div>
    </div>

    <script>
        // ==== BASES DE DATOS DE CHECKLISTS MASC EXACTAS ====
        const checklistsData = {
            "ARRENDAMIENTO": {
                "Contenido de la Carpeta": ["Solicitud", "Dictamen Viabilidad", "Acuerdo de Confidencialidad", "Convenio Final *", "Convenio Digital"],
                "Documentos Generales": ["Identificaciones ()*", "Contrato de Arrendamiento ()*", "Contrato de Administracion ()*", "Escritura Publica ( )*", "Predial *", "Prevencion", "Contestacion a la Prevencion", "No Sancion", "Validacion"]
            },
            "ALIMENTOS": {
                "Contenido de la Carpeta": ["Solicitud", "Dictamen Viabilidad", "Acuerdo de Confidencialidad", "Convenio Final *", "Convenio Digital"],
                "Documentos Generales": ["Identificaciones ()*", "Actas de Nacimiento Padres ()", "Acta de Matrimonio", "Comprobantes de Domicilio Cada Parte ()", "Comprobantes de Ingreso Cada Parte ()"],
                "Documentos Menores": ["Actas de Nacimiento de los Hijos ()", "Autorizacion Escucha de Menores", "Constancia Escucha de Menor", "Prevencion", "Contestacion a la Prevencion", "No Sancion", "Validacion"]
            },
            "DIVORCIO": {
                "Contenido de la Carpeta": ["Solicitud Firmada Por Ambas Partes *", "Dictamen Viabilidad", "Acuerdo de Confidencialidad", "Convenio Final*", "Convenio Digital"],
                "Documentos Gral Divorcio": ["Identificaciones (1)", "Actas de Nacimiento Conyuges()", "Acta de Matrimonio", "Comprobantes de Domicilio Cada Parte ()", "Comprobantes de Ingreso Cada Parte()", "Certificado No Embarazo (0)"],
                "Documentos Divorcio Mutuo": ["Actas de Nacimiento de los Hijos ()", "Autorizacion Escucha de Menores", "Constancia Escucha de Menor", "Facturas Bienes Muebles ()", "Escrituras de los Bienes Inmuebles", "Certificado Libertad de Gravamen()*", "Estado de Cuenta del Credito", "Prevencion", "Contestacion a la Prevencion", "No Sancion", "Validacion"]
            }
        };

        // ==== SISTEMA DE LOGIN ====
        function iniciarSesion() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === 'admin' && p === '45ymas') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'flex';
                mostrarSeccion('juridico');
            } else { document.getElementById('error-msg').style.display = 'block'; }
        }
        function cerrarSesion() { location.reload(); }

        // ==== NAVEGACIÓN PRINCIPAL ====
        let vistaActual = 'juridico'; 
        let nivelActual = 0; 
        let pathSelection = { juzgado: '', anio: '', exp: '' };

        const juzgadosJalisco = ["Juzgado 1° Civil", "Juzgado 2° Civil", "Juzgado 1° Familiar", "Juzgado 2° Familiar", "Juzgado 1° Mercantil", "Juzgado 2° Mercantil"];
        const anios = ["2026", "2025", "2024"];

        function mostrarSeccion(seccion) {
            vistaActual = seccion; nivelActual = 0;
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById('menu-' + seccion).classList.add('active');
            renderizarVista();
        }

        function renderizarVista() {
            const area = document.getElementById('area-trabajo');
            let html = '';

            if (vistaActual === 'juridico') {
                if (nivelActual === 0) {
                    html += `<div class="section-title"><i class="fa-solid fa-building-columns"></i> Selecciona un Juzgado</div><div class="grid-carpetas">`;
                    juzgadosJalisco.forEach(j => { html += crearCardCarpeta(j, 'Expedientes locales', `entrarNivel(1, '${j}')`, 'fa-folder'); });
                    html += `</div>`;
                } 
                else if (nivelActual === 1) {
                    html += `<div class="breadcrumb" onclick="entrarNivel(0)"><i class="fa-solid fa-arrow-left"></i> Volver a Juzgados</div>`;
                    html += `<div class="section-title">${pathSelection.juzgado} > Selecciona el Año</div><div class="grid-carpetas">`;
                    anios.forEach(a => { html += crearCardCarpeta(a, 'Año judicial', `entrarNivel(2, '${a}')`, 'fa-calendar'); });
                    html += `</div>`;
                }
                else if (nivelActual === 2) {
                    html += `<div class="breadcrumb" onclick="entrarNivel(1)"><i class="fa-solid fa-arrow-left"></i> Volver a Años</div>`;
                    html += `<div class="section-title">${pathSelection.juzgado} > ${pathSelection.anio} > Expedientes</div>`;
                    html += `<div class="grid-carpetas"><div class="carpeta-card" style="border: 2px dashed var(--neon-blue);" onclick="abrirModalCrear('Nuevo Expediente')">
                            <i class="fa-solid fa-plus folder-icon" style="color:var(--text-main);"></i><div class="titulo">Añadir Expediente</div></div>`;
                    
                    let exps = JSON.parse(localStorage.getItem(`exp_${pathSelection.juzgado}_${pathSelection.anio}`)) || [];
                    exps.forEach(e => { html += crearCardCarpeta(e.nombre, 'PDF y Notas locales', `abrirVisor('${e.nombre}')`, 'fa-file-pdf'); });
                    html += `</div>`;
                }
            } 
            else if (vistaActual === 'masc') {
                html += `<div class="section-title"><i class="fa-solid fa-handshake"></i> Convenios MASC Activos</div>`;
                html += `<div class="grid-carpetas"><div class="carpeta-card" style="border: 2px dashed var(--brand-orange);" onclick="abrirModalCrear('Nuevo Convenio MASC')">
                        <i class="fa-solid fa-user-plus folder-icon" style="color:var(--text-main);"></i><div class="titulo">Nuevo Solicitante</div></div>`;
                
                let mascs = JSON.parse(localStorage.getItem('masc_list')) || [];
                // Se muestran del más reciente al más antiguo (Reverse)
                mascs.slice().reverse().forEach((m, i) => { 
                    let realIndex = mascs.length - 1 - i;
                    let tipoLabel = (m.tipo === "ARRENDAMIENTO") ? "Arrendamiento" : (m.tipo === "ALIMENTOS") ? "Alimentos" : "Divorcio";
                    html += crearCardCarpeta(`${m.numero} | ${m.nombre}`, `Tipo: ${tipoLabel} - Fecha: ${m.fecha}`, `verChecklistMasc(${realIndex})`, 'fa-folder-open', 'var(--brand-orange)'); 
                });
                html += `</div>`;
            }
            area.innerHTML = html;
        }

        function crearCardCarpeta(titulo, subtitulo, onclickAction, icon, color='var(--neon-blue)') {
            return `
            <div class="carpeta-card" onclick="${onclickAction}">
                <i class="fa-solid ${icon} folder-icon" style="color:${color};"></i>
                <div class="titulo">${titulo}</div>
                <div class="subtitulo">${subtitulo}</div>
            </div>`;
        }

        function entrarNivel(nivel, valor='') {
            nivelActual = nivel;
            if(nivel === 1) pathSelection.juzgado = valor;
            if(nivel === 2) pathSelection.anio = valor;
            renderizarVista();
        }

        // ==== CREACIÓN LOCAL ====
        function abrirModalCrear(tipo) {
            tipoCreacion = tipo;
            document.getElementById('modal-title').innerText = tipo;
            document.getElementById('input-nuevo').value = '';
            
            if(tipo === 'Nuevo Convenio MASC') {
                document.getElementById('campo-tipo-masc').style.display = 'block';
                document.getElementById('lbl-nombre').innerText = "NOMBRE DEL SOLICITANTE:";
                document.getElementById('input-nuevo').placeholder = "Ej. Juan Pérez Garza";
            } else {
                document.getElementById('campo-tipo-masc').style.display = 'none';
                document.getElementById('lbl-nombre').innerText = "NÚMERO DE EXPEDIENTE:";
                document.getElementById('input-nuevo').placeholder = "Ej. EXP/340/26";
            }
            document.getElementById('modal-crear').style.display = 'flex';
        }

        function guardarNuevo() {
            let valor = document.getElementById('input-nuevo').value.trim();
            if(!valor) return;

            if(vistaActual === 'juridico') {
                let key = `exp_${pathSelection.juzgado}_${pathSelection.anio}`;
                let exps = JSON.parse(localStorage.getItem(key)) || [];
                exps.push({ nombre: valor });
                localStorage.setItem(key, JSON.stringify(exps));
            } else {
                let mascs = JSON.parse(localStorage.getItem('masc_list')) || [];
                let tipoSelec = document.getElementById('select-tipo-masc').value;
                // Generar número correlativo Ej. 001/26
                let anioActual = new Date().getFullYear().toString().slice(-2);
                let consecutivo = (mascs.length + 1).toString().padStart(3, '0');
                let numFolder = `${consecutivo}/${anioActual}`;
                
                // Formato de guardado
                mascs.push({ 
                    numero: numFolder, 
                    nombre: valor, 
                    fecha: new Date().toLocaleDateString(),
                    tipo: tipoSelec,
                    checks: {} // Guardará el estado de las palomitas
                });
                localStorage.setItem('masc_list', JSON.stringify(mascs));
            }
            document.getElementById('modal-crear').style.display = 'none';
            renderizarVista();
        }

        // ==== REDIRECCIÓN AL EXPEDIENTE INTELIGENTE ====
        function abrirVisor(nombreExp) {
            localStorage.setItem('expediente_abierto', nombreExp);
            window.location.href = 'visor-expediente.html';
        }

        // ==== RENDER DE CHECKLISTS MASC EXACTOS ====
        function verChecklistMasc(index) {
            let mascs = JSON.parse(localStorage.getItem('masc_list')) || [];
            let m = mascs[index];
            let listaDocs = checklistsData[m.tipo];
            
            let htmlChecks = '';
            
            // Recorrer las categorías del checklist seleccionado
            for(let categoria in listaDocs) {
                htmlChecks += `<div class="check-group-title">${categoria}</div>`;
                
                listaDocs[categoria].forEach(item => {
                    let itemId = `${categoria}_${item}`;
                    let isChecked = m.checks[itemId] ? 'checked' : '';
                    let classCheck = m.checks[itemId] ? 'checked' : '';

                    htmlChecks += `
                    <label class="check-item ${classCheck}">
                        <input type="checkbox" onchange="actualizarCheckMasc(${index}, '${itemId}', this.checked)" ${isChecked}> 
                        ${item}
                    </label>`;
                });
            }

            const area = document.getElementById('area-trabajo');
            let tipoVisual = (m.tipo === "ARRENDAMIENTO") ? "Preventivo Arrendamiento" : (m.tipo === "ALIMENTOS") ? "Alimentos y Convivencia" : "Divorcio Admtvo. y Mutuo";

            area.innerHTML = `
                <div class="breadcrumb" onclick="renderizarVista()"><i class="fa-solid fa-arrow-left"></i> Volver a Convenios Activos</div>
                
                <div class="masc-header">
                    <div class="masc-info">
                        <h2>${m.numero}</h2>
                        <p><strong style="color:var(--text-main);">Solicitante:</strong> ${m.nombre}</p>
                        <p><strong style="color:var(--text-main);">Tipo:</strong> ${tipoVisual}</p>
                        <p><strong style="color:var(--text-main);">Fecha:</strong> ${m.fecha}</p>
                    </div>
                    <div>
                        <button class="btn-login" style="margin:0; padding: 10px 20px; font-size: 0.9rem;" onclick="abrirVisor('MASC_${m.numero.replace('/','-')}')">
                            <i class="fa-solid fa-file-pdf"></i> Abrir Expediente Digital
                        </button>
                    </div>
                </div>
                
                <div class="checklist-grid">
                    <div class="checklist-container" style="grid-column: 1 / -1;">
                        <h3><i class="fa-solid fa-list-check"></i> Checklist de Documentación Requerida</h3>
                        ${htmlChecks}
                    </div>
                </div>
            `;
        }

        function actualizarCheckMasc(mascIndex, itemId, isChecked) {
            let mascs = JSON.parse(localStorage.getItem('masc_list')) || [];
            mascs[mascIndex].checks[itemId] = isChecked;
            localStorage.setItem('masc_list', JSON.stringify(mascs));
            verChecklistMasc(mascIndex); // Refrescar visualmente (tachar letra)
        }
    </script>
</body>
</html>
